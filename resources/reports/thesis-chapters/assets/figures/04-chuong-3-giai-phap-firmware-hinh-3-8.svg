    <rect x="498" y="498" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="542" y="531" class="small" text-anchor="middle" fill="#122033"><tspan x="542" dy="0">Có</tspan></text>
  
      
    <line x1="984" y1="468" x2="1098" y2="644" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="1004" y="518" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="2" /><text x="1048" y="551" class="small" text-anchor="middle" fill="#122033"><tspan x="1048" dy="0">Không</tspan></text>
  
      
    <polyline points="342,728 342,748 800,748 800,602" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    
  
      
    <polyline points="1258,728 1258,748 1028,748 1028,662" fill="none" stroke="#c97a10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    
  
      
