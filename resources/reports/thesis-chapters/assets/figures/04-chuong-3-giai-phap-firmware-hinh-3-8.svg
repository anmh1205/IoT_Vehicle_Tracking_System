    <rect x="524" y="860" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="568" y="893" class="small" text-anchor="middle" fill="#122033"><tspan x="568" dy="0">Có</tspan></text>
  
      
    <line x1="984" y1="826" x2="1192" y2="862" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="1048" y="860" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="2" /><text x="1092" y="893" class="small" text-anchor="middle" fill="#122033"><tspan x="1092" dy="0">Không</tspan></text>
  
      
    <line x1="470" y1="870" x2="494" y2="864" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="744" y1="864" x2="782" y2="872" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="710" y="796" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="2" /><text x="754" y="829" class="small" text-anchor="middle" fill="#122033"><tspan x="754" dy="0">Có</tspan></text>
  
      
    <polyline points="470,920 470,956 800,956 800,892" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    <rect x="510" y="938" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="600" y="971" class="small" text-anchor="middle" fill="#122033"><tspan x="600" dy="0">Không, tiếp tục</tspan><tspan x="600" dy="20">vòng lặp</tspan></text>
  
    
</svg>