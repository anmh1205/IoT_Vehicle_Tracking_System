<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(15, 118, 110, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Lưu đồ thuật toán quy trình kết nối và đọc dữ liệu BLE OBD2</text>
  <text x="84" y="142" class="subtitle">Dàn lại các nhánh reconnect, scan BLE, GATT discovery, truy vấn PID và fallback ADC trong cùng một flow rộng ngang.</text>
  
      
  <rect x="92" y="204" width="1416" height="708" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="116" y="186" width="220" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="226" y="209" class="chip" text-anchor="middle" fill="#fff">Thuật toán kết nối và đọc dữ liệu BLE OBD2</text>
  <text x="120" y="238" class="small" text-anchor="start" fill="#122033"><tspan x="120" dy="0">Bám theo chiến lược reconnect nhanh, scan khi cần và fallback ADC nếu OBD2 mất phản hồi.</tspan></text>

      
    <rect x="580" y="248" width="440" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="580" y="248" width="440" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="598" y="268" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="643" y="291" class="chip" text-anchor="middle" fill="#fff">start</text>
    <text x="800" y="312" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Khởi động module BLE OBD2</tspan></text>
    <text x="800" y="356" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Load MAC đã lưu, chuẩn bị stack BLE và</tspan><tspan x="800" dy="24">bộ lệnh ELM327</tspan></text>
  
      
    <polygon points="800,398 984,468 800,538 616,468" fill="rgba(109, 79, 224, 0.1)" stroke="rgba(109, 79, 224, 0.42)" stroke-width="3" />
    <rect x="748" y="410" width="104" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="800" y="433" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="474" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Đã lưu địa chỉ BLE của</tspan><tspan x="800" dy="24">adapter?</tspan></text>
  
      
    <rect x="182" y="590" width="320" height="138" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="182" y="590" width="320" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="200" y="610" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="245" y="633" class="chip" text-anchor="middle" fill="#fff">path A</text>
    <text x="342" y="654" class="card-title" text-anchor="middle" fill="#122033"><tspan x="342" dy="0">Reconnect nhanh tới</tspan><tspan x="342" dy="30">vgate iCar Pro</tspan></text>
    <text x="342" y="726" class="body" text-anchor="middle" fill="#122033"><tspan x="342" dy="0">Dùng MAC trong NVS để giảm</tspan><tspan x="342" dy="24">thời gian ghép nối.</tspan></text>
  
      
    <rect x="1098" y="560" width="320" height="168" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1098" y="560" width="320" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="1116" y="580" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1161" y="603" class="chip" text-anchor="middle" fill="#fff">path B</text>
    <text x="1258" y="624" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1258" dy="0">Scan BLE và chọn</tspan><tspan x="1258" dy="30">adapter phù hợp</tspan></text>
    <text x="1258" y="696" class="body" text-anchor="middle" fill="#122033"><tspan x="1258" dy="0">Lọc theo tên hoặc service</tspan><tspan x="1258" dy="24">UUID, sau đó lưu MAC vào NVS</tspan><tspan x="1258" dy="24">cho các lần sau.</tspan></text>
  
      
    <rect x="572" y="602" width="456" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="572" y="602" width="456" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="590" y="622" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="635" y="645" class="chip" text-anchor="middle" fill="#fff">setup</text>
    <text x="800" y="666" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">GATT discovery và khởi tạo</tspan><tspan x="800" dy="30">ELM327</tspan></text>
    <text x="800" y="738" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Tìm TX / RX characteristic, gửi ATZ,</tspan><tspan x="800" dy="24">ATE0, ATL0, ATS0, ATSP0</tspan></text>
  
      
    <polygon points="800,760 984,826 800,892 616,826" fill="rgba(15, 157, 118, 0.1)" stroke="rgba(15, 157, 118, 0.42)" stroke-width="3" />
    <rect x="748" y="772" width="104" height="34" rx="17" fill="#0f9d76" stroke="#0f9d76" stroke-width="2" /><text x="800" y="795" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="836" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Đang ở chế độ lái xe?</tspan></text>
  
      
    <rect x="120" y="788" width="350" height="150" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="120" y="788" width="350" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="138" y="808" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="183" y="831" class="chip" text-anchor="middle" fill="#fff">loop</text>
    <text x="295" y="852" class="card-title" text-anchor="middle" fill="#122033"><tspan x="295" dy="0">Gửi PID và parse phản hồi</tspan></text>
    <text x="295" y="896" class="body" text-anchor="middle" fill="#122033"><tspan x="295" dy="0">010C, 010D, 0105, 012F, AT IGN</tspan><tspan x="295" dy="24">Đưa telemetry vào queue</tspan></text>
  
      
    <polygon points="619,792 744,864 619,936 494,864" fill="rgba(201, 122, 16, 0.1)" stroke="rgba(201, 122, 16, 0.42)" stroke-width="3" />
    <rect x="567" y="804" width="104" height="34" rx="17" fill="#c97a10" stroke="#c97a10" stroke-width="2" /><text x="619" y="827" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="619" y="868" class="body" text-anchor="middle" fill="#122033"><tspan x="619" dy="0">Timeout 2-3 lần?</tspan></text>
  
      
    <rect x="782" y="810" width="326" height="126" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="782" y="810" width="326" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="800" y="830" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="845" y="853" class="chip" text-anchor="middle" fill="#fff">fallback</text>
    <text x="945" y="874" class="card-title" text-anchor="middle" fill="#122033"><tspan x="945" dy="0">Fallback xác định IGN</tspan><tspan x="945" dy="30">bằng ADC</tspan></text>
    <text x="945" y="946" class="body" text-anchor="middle" fill="#122033"><tspan x="945" dy="0">Duy trì nhận biết trạng thái</tspan><tspan x="945" dy="24">động cơ khi OBD2 không ổn</tspan><tspan x="945" dy="24">định.</tspan></text>
  
      
    <rect x="1192" y="794" width="260" height="142" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1192" y="794" width="260" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="1210" y="814" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1255" y="837" class="chip" text-anchor="middle" fill="#fff">sleep</text>
    <text x="1322" y="858" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1322" dy="0">Ngắt BLE và deep</tspan><tspan x="1322" dy="30">sleep</tspan></text>
    <text x="1322" y="930" class="body" text-anchor="middle" fill="#122033"><tspan x="1322" dy="0">Giải phóng kết nối khi</tspan><tspan x="1322" dy="24">thiết bị chuyển sang</tspan><tspan x="1322" dy="24">parked.</tspan></text>
  
      
    <polyline points="800,366 800,398" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    
  
      
