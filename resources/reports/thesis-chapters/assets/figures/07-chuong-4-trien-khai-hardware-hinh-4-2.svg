<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(15, 118, 110, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ kết nối giữa ESP32-S3 và modem SIMCom SIM7600CE-T qua UART</text>
  <text x="84" y="142" class="subtitle">Tách rõ hai đầu UART1, PWRKEY và nhánh nguồn modem để tránh sơ đồ bị chồng chữ.</text>
  
      
  <rect x="106" y="230" width="560" height="560" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="130" y="212" width="110" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="185" y="235" class="chip" text-anchor="middle" fill="#fff">ESP32-S3</text>
  <text x="134" y="264" class="small" text-anchor="start" fill="#122033"><tspan x="134" dy="0">UART1 và các chân điều khiển modem được chốt đúng</tspan><tspan x="134" dy="22">với pin_map.h.</tspan></text>

      
  <rect x="934" y="230" width="560" height="560" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="958" y="212" width="132" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="1024" y="235" class="chip" text-anchor="middle" fill="#fff">SIM7600CE-T</text>
  <text x="962" y="264" class="small" text-anchor="start" fill="#122033"><tspan x="962" dy="0">Modem 4G/GNSS dùng UART1 và PWRKEY riêng, cấp</tspan><tspan x="962" dy="22">nguồn từ rail khoảng 4V.</tspan></text>

      
            <rect x="146" y="338" width="476" height="68" rx="20" fill="#eef4ff" stroke="rgba(29, 78, 216, 0.2)" stroke-width="2" />
            <text x="178" y="366" class="body" text-anchor="start" fill="#122033"><tspan x="178" dy="0">GPIO16</tspan></text>
            <text x="178" y="390" class="tiny" text-anchor="start" fill="#122033"><tspan x="178" dy="0">UART1 TX</tspan></text>
          
            <rect x="146" y="434" width="476" height="68" rx="20" fill="#eef4ff" stroke="rgba(29, 78, 216, 0.2)" stroke-width="2" />
            <text x="178" y="462" class="body" text-anchor="start" fill="#122033"><tspan x="178" dy="0">GPIO17</tspan></text>
            <text x="178" y="486" class="tiny" text-anchor="start" fill="#122033"><tspan x="178" dy="0">UART1 RX</tspan></text>
          
            <rect x="146" y="530" width="476" height="68" rx="20" fill="#eef4ff" stroke="rgba(201, 122, 16, 0.2)" stroke-width="2" />
            <text x="178" y="558" class="body" text-anchor="start" fill="#122033"><tspan x="178" dy="0">GPIO26</tspan></text>
            <text x="178" y="582" class="tiny" text-anchor="start" fill="#122033"><tspan x="178" dy="0">PWRKEY</tspan></text>
          
            <rect x="146" y="626" width="476" height="68" rx="20" fill="#eef4ff" stroke="rgba(100, 116, 139, 0.2)" stroke-width="2" />
            <text x="178" y="654" class="body" text-anchor="start" fill="#122033"><tspan x="178" dy="0">RTS / CTS</tspan></text>
            <text x="178" y="678" class="tiny" text-anchor="start" fill="#122033"><tspan x="178" dy="0">dự phòng</tspan></text>
          
      
            <rect x="978" y="338" width="470" height="68" rx="20" fill="#eef4ff" stroke="rgba(15, 118, 110, 0.2)" stroke-width="2" />
            <text x="1213" y="380" class="body" text-anchor="middle" fill="#122033"><tspan x="1213" dy="0">SIMCOM-RX</tspan></text>
          
            <rect x="978" y="434" width="470" height="68" rx="20" fill="#eef4ff" stroke="rgba(15, 118, 110, 0.2)" stroke-width="2" />
            <text x="1213" y="476" class="body" text-anchor="middle" fill="#122033"><tspan x="1213" dy="0">SIMCOM-TX</tspan></text>
          
            <rect x="978" y="530" width="470" height="68" rx="20" fill="#eef4ff" stroke="rgba(201, 122, 16, 0.2)" stroke-width="2" />
            <text x="1213" y="572" class="body" text-anchor="middle" fill="#122033"><tspan x="1213" dy="0">SIMCOM-PWRKEY</tspan></text>
          
            <rect x="978" y="626" width="470" height="68" rx="20" fill="#eef4ff" stroke="rgba(100, 116, 139, 0.2)" stroke-width="2" />
            <text x="1213" y="668" class="body" text-anchor="middle" fill="#122033"><tspan x="1213" dy="0">RTS / CTS</tspan></text>
          
      
    <line x1="622" y1="372" x2="978" y2="372" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="694" y="312" width="96" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="742" y="345" class="small" text-anchor="middle" fill="#122033"><tspan x="742" dy="0">TX -&gt; RX</tspan></text>
  
      
    <line x1="978" y1="468" x2="622" y2="468" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="804" y="408" width="96" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="852" y="441" class="small" text-anchor="middle" fill="#122033"><tspan x="852" dy="0">RX &lt;- TX</tspan></text>
  
      
    <line x1="622" y1="564" x2="978" y2="564" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="642" y="504" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="2" /><text x="732" y="537" class="small" text-anchor="middle" fill="#122033"><tspan x="732" dy="0">GPIO26 điều khiển</tspan><tspan x="732" dy="20">PWRKEY</tspan></text>
  
      
    <line x1="622" y1="660" x2="978" y2="660" stroke="#64748b" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-slate)"/>
    <rect x="646" y="686" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(100, 116, 139, 0.28)" stroke-width="2" /><text x="736" y="719" class="small" text-anchor="middle" fill="#122033"><tspan x="736" dy="0">Đường RTS / CTS để</tspan><tspan x="736" dy="20">mở rộng</tspan></text>
  
      
    <rect x="1168" y="806" width="240" height="116" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1168" y="806" width="240" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="1186" y="826" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1231" y="849" class="chip" text-anchor="middle" fill="#fff">power</text>
    <text x="1288" y="870" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1288" dy="0">Rail modem ~4V</tspan></text>
    <text x="1288" y="914" class="body" text-anchor="middle" fill="#122033"><tspan x="1288" dy="0">TPS54231 cấp nguồn</tspan><tspan x="1288" dy="24">VBAT cho modem</tspan></text>
  
      
    <line x1="1288" y1="806" x2="1288" y2="702" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    
