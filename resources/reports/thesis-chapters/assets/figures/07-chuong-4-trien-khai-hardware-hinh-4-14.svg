<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#c97a10"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(201, 122, 16, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Minh họa vị trí cổng OBD2 trên xe và cách kết nối</text>
  <text x="84" y="142" class="subtitle">Làm rõ việc adapter OBD2 cắm trực tiếp vào cổng xe, còn tracker giao tiếp BLE không dây và đặt linh hoạt trong cabin.</text>
  
      
  <rect x="118" y="234" width="520" height="590" rx="30" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="3" />
  <rect x="142" y="216" width="220" height="34" rx="17" fill="#c97a10" stroke="#c97a10" stroke-width="2" /><text x="252" y="239" class="chip" text-anchor="middle" fill="#fff">Khu vực táp-lô / chân lái</text>
  <text x="146" y="268" class="small" text-anchor="start" fill="#122033"><tspan x="146" dy="0">Cổng OBD2 nằm dưới táp-lô; vgate iCar Pro cắm</tspan><tspan x="146" dy="22">trực tiếp để lấy dữ liệu động cơ.</tspan></text>

      
  <rect x="822" y="234" width="662" height="590" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="846" y="216" width="168" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="930" y="239" class="chip" text-anchor="middle" fill="#fff">Vị trí tracker</text>
  <text x="850" y="268" class="small" text-anchor="start" fill="#122033"><tspan x="850" dy="0">Tracker đặt trong cabin hoặc gần hộp cầu chì và giao tiếp</tspan><tspan x="850" dy="22">BLE không dây với adapter OBD2.</tspan></text>

      
    <rect x="166" y="372" width="424" height="140" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="166" y="372" width="424" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="184" y="392" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="229" y="415" class="chip" text-anchor="middle" fill="#fff">port</text>
    <text x="378" y="436" class="card-title" text-anchor="middle" fill="#122033"><tspan x="378" dy="0">Cổng OBD2 dưới táp-lô</tspan></text>
    <text x="378" y="480" class="body" text-anchor="middle" fill="#122033"><tspan x="378" dy="0">Cấp nguồn xe tại chân 16 và mass tại</tspan><tspan x="378" dy="24">chân 4 / 5</tspan></text>
  
      
    <rect x="166" y="586" width="424" height="140" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="166" y="586" width="424" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="184" y="606" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="229" y="629" class="chip" text-anchor="middle" fill="#fff">dongle</text>
    <text x="378" y="650" class="card-title" text-anchor="middle" fill="#122033"><tspan x="378" dy="0">vgate iCar Pro</tspan></text>
    <text x="378" y="694" class="body" text-anchor="middle" fill="#122033"><tspan x="378" dy="0">BLE dongle cắm trực tiếp</tspan><tspan x="378" dy="24">Đọc dữ liệu OBD2 và trạng thái IGN</tspan></text>
  
      
    <rect x="872" y="404" width="260" height="146" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="872" y="404" width="260" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="890" y="424" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="935" y="447" class="chip" text-anchor="middle" fill="#fff">tracker</text>
    <text x="1002" y="468" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1002" dy="0">Tracker trong</tspan><tspan x="1002" dy="30">cabin</tspan></text>
    <text x="1002" y="540" class="body" text-anchor="middle" fill="#122033"><tspan x="1002" dy="0">Không cần cắm cố định</tspan><tspan x="1002" dy="24">vào cổng OBD2</tspan></text>
  
      
    <rect x="1182" y="404" width="252" height="146" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1182" y="404" width="252" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="1200" y="424" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="1245" y="447" class="chip" text-anchor="middle" fill="#fff">mount</text>
    <text x="1308" y="468" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1308" dy="0">Gần hộp cầu chì</tspan></text>
    <text x="1308" y="512" class="body" text-anchor="middle" fill="#122033"><tspan x="1308" dy="0">Thuận tiện lấy nguồn</tspan><tspan x="1308" dy="24">và đi dây</tspan></text>
  
      
    <rect x="912" y="618" width="472" height="130" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="912" y="618" width="472" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="930" y="638" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="975" y="661" class="chip" text-anchor="middle" fill="#fff">note</text>
    <text x="1148" y="682" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1148" dy="0">Kết luận lắp đặt</tspan></text>
    <text x="1148" y="726" class="body" text-anchor="middle" fill="#122033"><tspan x="1148" dy="0">BLE không dây giúp tracker tách khỏi cổng</tspan><tspan x="1148" dy="24">OBD2.</tspan><tspan x="1148" dy="24">Thiết bị vẫn lấy nguồn riêng từ hệ xe và</tspan><tspan x="1148" dy="24">bố trí linh hoạt hơn.</tspan></text>
  
      
    <line x1="378" y1="512" x2="378" y2="586" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <polyline points="590,656 760,656 872,476" fill="none" stroke="#6d4fe0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    <rect x="676" y="590" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="2" /><text x="720" y="623" class="small" text-anchor="middle" fill="#122033"><tspan x="720" dy="0">BLE</tspan></text>
  
      
    <line x1="1132" y1="476" x2="1182" y2="476" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <polyline points="1002,550 1002,618" fill="none" stroke="#0f9d76" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    
  
    
</svg>