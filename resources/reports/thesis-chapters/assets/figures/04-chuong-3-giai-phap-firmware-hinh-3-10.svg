<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f9d76"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(15, 157, 118, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Lưu đồ thuật toán điều khiển power path</text>
  <text x="84" y="142" class="subtitle">Bám đúng các ngưỡng Switch_OFF, Switch_ON, logic GPIO18 và GPIO5 trong firmware quản lý nguồn.</text>
  
      
  <rect x="94" y="210" width="1412" height="700" rx="30" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="3" />
  <rect x="118" y="192" width="220" height="34" rx="17" fill="#0f9d76" stroke="#0f9d76" stroke-width="2" /><text x="228" y="215" class="chip" text-anchor="middle" fill="#fff">Thuật toán điều khiển power path</text>
  <text x="122" y="244" class="small" text-anchor="start" fill="#122033"><tspan x="122" dy="0">Firmware cân bằng giữa bus chính MP2482 và bus backup SX1308 dựa trên IGN, ADC và cờ LVD.</tspan></text>

      
    <rect x="520" y="250" width="560" height="110" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="520" y="250" width="560" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="538" y="270" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="583" y="293" class="chip" text-anchor="middle" fill="#fff">sense</text>
    <text x="800" y="314" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Đọc U_batt, IGN và cờ LVD_STATUS</tspan></text>
    <text x="800" y="358" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">ADC GPIO4 kết hợp LM393 để ra quyết định chuyển</tspan><tspan x="800" dy="24">nguồn.</tspan></text>
  
      
    <polygon points="800,398 990,466 800,534 610,466" fill="rgba(29, 78, 216, 0.1)" stroke="rgba(29, 78, 216, 0.42)" stroke-width="3" />
    <rect x="748" y="410" width="104" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="800" y="433" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="474" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">IGN ON?</tspan></text>
  
      
    <rect x="170" y="578" width="340" height="152" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="170" y="578" width="340" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="188" y="598" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="233" y="621" class="chip" text-anchor="middle" fill="#fff">main</text>
    <text x="340" y="642" class="card-title" text-anchor="middle" fill="#122033"><tspan x="340" dy="0">Ưu tiên nhánh chính</tspan><tspan x="340" dy="30">MP2482</tspan></text>
    <text x="340" y="714" class="body" text-anchor="middle" fill="#122033"><tspan x="340" dy="0">GPIO18 = LOW</tspan><tspan x="340" dy="24">GPIO5 = HIGH để cho phép sạc</tspan><tspan x="340" dy="24">TP4056</tspan></text>
  
      
    <polygon points="800,576 992,646 800,716 608,646" fill="rgba(217, 72, 95, 0.1)" stroke="rgba(217, 72, 95, 0.42)" stroke-width="3" />
    <rect x="748" y="588" width="104" height="34" rx="17" fill="#d9485f" stroke="#d9485f" stroke-width="2" /><text x="800" y="611" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="652" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">U_batt &lt;= Switch_OFF?</tspan></text>
  
      
    <rect x="1090" y="562" width="330" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1090" y="562" width="330" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1108" y="582" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1153" y="605" class="chip" text-anchor="middle" fill="#fff">backup</text>
    <text x="1255" y="626" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1255" dy="0">Chuyển sang nhánh</tspan><tspan x="1255" dy="30">backup SX1308</tspan></text>
    <text x="1255" y="698" class="body" text-anchor="middle" fill="#122033"><tspan x="1255" dy="0">GPIO18 = HIGH</tspan><tspan x="1255" dy="24">GPIO5 = LOW để bảo vệ ắc quy</tspan><tspan x="1255" dy="24">Set low battery / alert nếu</tspan><tspan x="1255" dy="24">cần</tspan></text>
  
      
    <polygon points="800,774 996,840 800,906 604,840" fill="rgba(109, 79, 224, 0.1)" stroke="rgba(109, 79, 224, 0.42)" stroke-width="3" />
    <rect x="748" y="786" width="104" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="800" y="809" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="850" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">U_batt &gt;= Switch_ON?</tspan></text>
  
      
    <rect x="168" y="796" width="344" height="124" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="168" y="796" width="344" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="186" y="816" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="231" y="839" class="chip" text-anchor="middle" fill="#fff">recover</text>
    <text x="340" y="860" class="card-title" text-anchor="middle" fill="#122033"><tspan x="340" dy="0">Quay lại nhánh chính</tspan></text>
    <text x="340" y="904" class="body" text-anchor="middle" fill="#122033"><tspan x="340" dy="0">GPIO18 = LOW</tspan><tspan x="340" dy="24">GPIO5 = LOW nếu đang parking</tspan></text>
  
      
    <rect x="1094" y="794" width="324" height="126" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1094" y="794" width="324" height="12" rx="26" fill="#64748b" stroke="none"/>
    <rect x="1112" y="814" width="90" height="34" rx="17" fill="rgba(100, 116, 139, 0.88)" stroke="rgba(100, 116, 139, 0.88)" stroke-width="2" /><text x="1157" y="837" class="chip" text-anchor="middle" fill="#fff">hold</text>
    <text x="1256" y="858" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1256" dy="0">Giữ trạng thái trước đó</tspan></text>
    <text x="1256" y="902" class="body" text-anchor="middle" fill="#122033"><tspan x="1256" dy="0">Tránh rung nguồn khi điện áp</tspan><tspan x="1256" dy="24">nằm trong vùng hysteresis.</tspan></text>
  
      
    <rect x="582" y="922" width="436" height="70" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="582" y="922" width="436" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="600" y="942" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="645" y="965" class="chip" text-anchor="middle" fill="#fff">loop</text>
    <text x="800" y="986" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Delay 5 giây rồi lặp</tspan></text>
    
  
      
