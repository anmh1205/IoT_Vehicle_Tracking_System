    <line x1="1026" y1="510" x2="1058" y2="510" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    <line x1="1256" y1="510" x2="1288" y2="510" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    
</svg>