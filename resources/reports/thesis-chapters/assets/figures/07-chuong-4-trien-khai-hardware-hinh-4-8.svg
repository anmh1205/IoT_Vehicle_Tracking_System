<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#6d4fe0"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(109, 79, 224, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ nguyên lý mạch Boost Converter SX1308</text>
  <text x="84" y="142" class="subtitle">Chuỗi dự phòng từ pin 21700 qua BMS, boost và diode Schottky để duy trì bus 5V backup.</text>
  
      
  <rect x="108" y="258" width="1384" height="506" rx="30" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="3" />
  <rect x="132" y="240" width="220" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="242" y="263" class="chip" text-anchor="middle" fill="#fff">Chuỗi nguồn dự phòng</text>
  <text x="136" y="292" class="small" text-anchor="start" fill="#122033"><tspan x="136" dy="0">Pin 21700 cấp qua BMS và boost converter để duy trì bus 5V backup khi nguồn chính mất.</tspan></text>

      
    <rect x="138" y="444" width="198" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="138" y="444" width="198" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="156" y="464" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="201" y="487" class="chip" text-anchor="middle" fill="#fff">cell</text>
    <text x="237" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="237" dy="0">Pin 21700</tspan></text>
    <text x="237" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="237" dy="0">Điện áp 3.0V đến</tspan><tspan x="237" dy="24">4.2V</tspan></text>
  
    <rect x="368" y="444" width="198" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="368" y="444" width="198" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="386" y="464" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="431" y="487" class="chip" text-anchor="middle" fill="#fff">bms</text>
    <text x="467" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="467" dy="0">BMS 1S</tspan></text>
    <text x="467" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="467" dy="0">Bảo vệ quá xả, quá</tspan><tspan x="467" dy="24">sạc và ngắn mạch</tspan></text>
  
    <rect x="598" y="444" width="198" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="598" y="444" width="198" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="616" y="464" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="661" y="487" class="chip" text-anchor="middle" fill="#fff">boost</text>
    <text x="697" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="697" dy="0">SX1308</tspan></text>
    <text x="697" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="697" dy="0">Boost lên 5V cho</tspan><tspan x="697" dy="24">nhánh dự phòng</tspan></text>
  
    <rect x="828" y="444" width="198" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="828" y="444" width="198" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="846" y="464" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="891" y="487" class="chip" text-anchor="middle" fill="#fff">diode</text>
    <text x="927" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="927" dy="0">Diode Schottky</tspan></text>
    <text x="927" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="927" dy="0">Cách ly với bus 5V</tspan><tspan x="927" dy="24">chính</tspan></text>
  
    <rect x="1058" y="444" width="198" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1058" y="444" width="198" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="1076" y="464" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1121" y="487" class="chip" text-anchor="middle" fill="#fff">bus</text>
    <text x="1157" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1157" dy="0">Bus 5V backup</tspan></text>
    <text x="1157" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="1157" dy="0">Nguồn runtime khi</tspan><tspan x="1157" dy="24">xe mất điện đầu</tspan><tspan x="1157" dy="24">vào</tspan></text>
  
    <rect x="1288" y="444" width="198" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1288" y="444" width="198" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1306" y="464" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1351" y="487" class="chip" text-anchor="middle" fill="#fff">load</text>
    <text x="1387" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1387" dy="0">Tải runtime</tspan></text>
    <text x="1387" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="1387" dy="0">Giữ tracker hoạt</tspan><tspan x="1387" dy="24">động để gửi</tspan><tspan x="1387" dy="24">heartbeat hoặc</tspan><tspan x="1387" dy="24">cảnh báo</tspan></text>
  
      
    <line x1="336" y1="510" x2="368" y2="510" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    <line x1="566" y1="510" x2="598" y2="510" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
