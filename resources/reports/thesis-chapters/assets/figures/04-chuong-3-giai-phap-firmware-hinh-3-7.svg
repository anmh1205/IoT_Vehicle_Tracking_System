    <text x="292" y="868" class="body" text-anchor="middle" fill="#122033"><tspan x="292" dy="0">BLE OBD2, GNSS và LTE hoạt</tspan><tspan x="292" dy="24">động đầy đủ để theo dõi</tspan><tspan x="292" dy="24">liên tục.</tspan></text>
  
      
