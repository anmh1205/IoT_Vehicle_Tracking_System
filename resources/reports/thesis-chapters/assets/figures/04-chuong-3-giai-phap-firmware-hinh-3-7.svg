  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(29, 78, 216, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Lưu đồ thuật toán luồng hoạt động chính của firmware</text>
  <text x="84" y="142" class="subtitle">Luồng quyết định giữa nguồn IGN từ OBD2, fallback ADC và ba mode driving, parked, alarm.</text>
  
      
  <rect x="80" y="196" width="1440" height="724" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="104" y="178" width="220" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="214" y="201" class="chip" text-anchor="middle" fill="#fff">Luồng hoạt động chính của firmware</text>
  <text x="108" y="230" class="small" text-anchor="start" fill="#122033"><tspan x="108" dy="0">Firmware khởi tạo ngoại vi, xác định nguồn IGN rồi chuyển giữa driving, parked và alarm.</tspan></text>

      
    <rect x="584" y="242" width="432" height="122" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="584" y="242" width="432" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
