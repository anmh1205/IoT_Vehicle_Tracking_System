    <text x="1267" y="518" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1267" dy="0">Fallback sang ADC</tspan><tspan x="1267" dy="30">12V / 24V</tspan></text>
    <text x="1267" y="590" class="body" text-anchor="middle" fill="#122033"><tspan x="1267" dy="0">Suy ra trạng thái máy dựa</tspan><tspan x="1267" dy="24">trên profile điện áp cấu</tspan><tspan x="1267" dy="24">hình.</tspan></text>
  
      
