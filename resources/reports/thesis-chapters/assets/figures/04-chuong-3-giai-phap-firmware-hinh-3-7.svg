    <text x="800" y="306" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Khởi động firmware và khởi tạo</tspan><tspan x="800" dy="30">ngoại vi</tspan></text>
    <text x="800" y="378" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">IMU, modem, ADC, BLE, queue và các task</tspan><tspan x="800" dy="24">FreeRTOS</tspan></text>
  
      
    <rect x="190" y="454" width="286" height="136" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="190" y="454" width="286" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="208" y="474" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="253" y="497" class="chip" text-anchor="middle" fill="#fff">source</text>
    <text x="333" y="518" class="card-title" text-anchor="middle" fill="#122033"><tspan x="333" dy="0">Đọc IGN từ ECU qua</tspan><tspan x="333" dy="30">BLE OBD2</tspan></text>
    <text x="333" y="590" class="body" text-anchor="middle" fill="#122033"><tspan x="333" dy="0">Ưu tiên nguồn tín hiệu</tspan><tspan x="333" dy="24">chuẩn khi adapter OBD2</tspan><tspan x="333" dy="24">phản hồi ổn định.</tspan></text>
  
      
    <rect x="1124" y="454" width="286" height="136" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
