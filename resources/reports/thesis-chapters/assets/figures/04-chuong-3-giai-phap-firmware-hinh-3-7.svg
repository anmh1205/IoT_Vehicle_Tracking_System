    <text x="1085" y="972" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1085" dy="0">PARKED</tspan></text>
    <text x="1085" y="1016" class="body" text-anchor="middle" fill="#122033"><tspan x="1085" dy="0">Heartbeat rồi deep</tspan><tspan x="1085" dy="24">sleep</tspan></text>
  
      
    <rect x="1260" y="908" width="250" height="84" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1260" y="908" width="250" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1278" y="928" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1323" y="951" class="chip" text-anchor="middle" fill="#fff">mode</text>
    <text x="1385" y="972" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1385" dy="0">ALARM</tspan></text>
    <text x="1385" y="1016" class="body" text-anchor="middle" fill="#122033"><tspan x="1385" dy="0">Wake modem và gửi</tspan><tspan x="1385" dy="24">alert ưu tiên</tspan></text>
  
      
