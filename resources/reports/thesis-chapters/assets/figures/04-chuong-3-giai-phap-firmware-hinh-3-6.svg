    <text x="800" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">telemetry_queue</tspan></text>
    <text x="800" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Hàng đợi gom GPS, OBD2, IMU và</tspan><tspan x="800" dy="24">trạng thái nguồn trước khi</tspan><tspan x="800" dy="24">truyền.</tspan></text>
  
      
