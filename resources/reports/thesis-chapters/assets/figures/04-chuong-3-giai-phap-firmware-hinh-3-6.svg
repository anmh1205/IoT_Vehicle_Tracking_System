  <text x="84" y="106" class="title">Sơ đồ tương tác giữa các FreeRTOS task</text>
  <text x="84" y="142" class="subtitle">Minh họa lại queue trung tâm, các task producer và power_task điều phối chế độ hoạt động.</text>
  
      
  <rect x="96" y="224" width="1408" height="618" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="120" y="206" width="220" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="230" y="229" class="chip" text-anchor="middle" fill="#fff">Tương tác giữa các FreeRTOS task</text>
  <text x="124" y="258" class="small" text-anchor="start" fill="#122033"><tspan x="124" dy="0">Các task thu thập dữ liệu đưa message vào queue trung tâm; power_task điều phối chế độ hoạt động.</tspan></text>

      
    <rect x="614" y="444" width="372" height="150" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
