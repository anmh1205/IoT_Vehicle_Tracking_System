    <text x="295" y="378" class="card-title" text-anchor="middle" fill="#122033"><tspan x="295" dy="0">ISR + IMU wake-up</tspan></text>
    <text x="295" y="422" class="body" text-anchor="middle" fill="#122033"><tspan x="295" dy="0">Đánh thức hệ thống từ</tspan><tspan x="295" dy="24">interrupt và báo sự</tspan><tspan x="295" dy="24">kiện rung.</tspan></text>
  
      
