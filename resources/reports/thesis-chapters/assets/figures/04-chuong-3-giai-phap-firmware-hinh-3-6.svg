    <text x="295" y="638" class="card-title" text-anchor="middle" fill="#122033"><tspan x="295" dy="0">power_task</tspan></text>
    <text x="295" y="682" class="body" text-anchor="middle" fill="#122033"><tspan x="295" dy="0">Quyết định driving,</tspan><tspan x="295" dy="24">parked, heartbeat,</tspan><tspan x="295" dy="24">alarm và sleep.</tspan></text>
  
      
