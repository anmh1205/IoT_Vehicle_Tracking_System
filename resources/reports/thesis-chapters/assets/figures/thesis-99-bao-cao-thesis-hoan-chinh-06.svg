    <rect x="890" y="306" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="935" y="329" class="chip" text-anchor="middle" fill="#fff">map</text>
    <text x="999" y="350" class="card-title" text-anchor="middle" fill="#122033"><tspan x="999" dy="0">React Leaflet Map</tspan></text>
    <text x="999" y="394" class="body" text-anchor="middle" fill="#122033"><tspan x="999" dy="0">Tile Layer</tspan><tspan x="999" dy="24">Marker Layer</tspan><tspan x="999" dy="24">Geofence Overlay</tspan></text>
  
      
    <rect x="1194" y="286" width="238" height="182" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1194" y="286" width="238" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="1212" y="306" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1257" y="329" class="chip" text-anchor="middle" fill="#fff">sidebar</text>
    <text x="1313" y="350" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1313" dy="0">Sidebar thông tin</tspan></text>
    <text x="1313" y="394" class="body" text-anchor="middle" fill="#122033"><tspan x="1313" dy="0">Danh sách xe</tspan><tspan x="1313" dy="24">Thông tin chuyến và</tspan><tspan x="1313" dy="24">cảnh báo</tspan></text>
  
      
    <rect x="942" y="578" width="260" height="164" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="942" y="578" width="260" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="960" y="598" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1005" y="621" class="chip" text-anchor="middle" fill="#fff">visual</text>
    <text x="1072" y="642" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1072" dy="0">Marker / Route</tspan><tspan x="1072" dy="30">Replay</tspan></text>
    <text x="1072" y="714" class="body" text-anchor="middle" fill="#122033"><tspan x="1072" dy="0">Nội suy vị trí</tspan><tspan x="1072" dy="24">Phát lại hành trình</tspan></text>
  
      
