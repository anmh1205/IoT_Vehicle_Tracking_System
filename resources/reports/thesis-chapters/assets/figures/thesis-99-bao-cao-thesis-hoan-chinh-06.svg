  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(109, 79, 224, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Phân rã lớp bản đồ React Leaflet và kênh Socket.IO</text>
  <text x="84" y="142" class="subtitle">Biểu diễn lại tầng server, store, map, sidebar và marker bằng cùng phong cách SVG UML sáng.</text>
  
      
  <rect x="112" y="232" width="1378" height="590" rx="30" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="3" />
  <rect x="136" y="214" width="220" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="246" y="237" class="chip" text-anchor="middle" fill="#fff">Kiến trúc map realtime</text>
  <text x="140" y="266" class="small" text-anchor="start" fill="#122033"><tspan x="140" dy="0">Leaflet nhận dữ liệu vị trí qua store trung gian để đồng bộ marker và panel thông tin.</tspan></text>

      
    <rect x="170" y="322" width="286" height="154" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="170" y="322" width="286" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="188" y="342" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="233" y="365" class="chip" text-anchor="middle" fill="#fff">server</text>
    <text x="313" y="386" class="card-title" text-anchor="middle" fill="#122033"><tspan x="313" dy="0">Backend API +</tspan><tspan x="313" dy="30">Socket.IO</tspan></text>
    <text x="313" y="458" class="body" text-anchor="middle" fill="#122033"><tspan x="313" dy="0">Nhận telemetry từ MQTT</tspan><tspan x="313" dy="24">Bridge</tspan><tspan x="313" dy="24">Phát event</tspan><tspan x="313" dy="24">vehicle:{id}:location</tspan></text>
  
      
    <rect x="528" y="322" width="276" height="154" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="528" y="322" width="276" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="546" y="342" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="591" y="365" class="chip" text-anchor="middle" fill="#fff">store</text>
    <text x="666" y="386" class="card-title" text-anchor="middle" fill="#122033"><tspan x="666" dy="0">Zustand Realtime</tspan><tspan x="666" dy="30">Store</tspan></text>
    <text x="666" y="458" class="body" text-anchor="middle" fill="#122033"><tspan x="666" dy="0">Lưu vị trí hiện tại</tspan><tspan x="666" dy="24">Điều phối cập nhật sang</tspan><tspan x="666" dy="24">UI</tspan></text>
  
      
