  <text x="84" y="106" class="title">Lưu đồ thuật toán chính của firmware thiết bị theo dõi xe</text>
  <text x="84" y="142" class="subtitle">Bản SVG custom bám theo các state trong code thực thi: INIT, CHECK_IGN, DRIVING, PARKED, ALERT, HEARTBEAT và SLEEP.</text>
  
      
  <rect x="90" y="214" width="1420" height="700" rx="30" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="3" />
  <rect x="114" y="196" width="220" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="224" y="219" class="chip" text-anchor="middle" fill="#fff">Lưu đồ thuật toán chính của firmware</text>
  <text x="118" y="248" class="small" text-anchor="start" fill="#122033"><tspan x="118" dy="0">Biểu diễn bám theo mã trạng thái STATE_INIT -&gt; STATE_CHECK_IGN -&gt; các mode vận hành -&gt; STATE_SLEEP.</tspan></text>

      
