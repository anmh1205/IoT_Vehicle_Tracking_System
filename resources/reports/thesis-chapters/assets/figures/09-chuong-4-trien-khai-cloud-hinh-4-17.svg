    <text x="622" y="662" class="card-title" text-anchor="middle" fill="#122033"><tspan x="622" dy="0">3. Fan-out và phát sự</tspan><tspan x="622" dy="30">kiện</tspan></text>
    <text x="622" y="734" class="body" text-anchor="middle" fill="#122033"><tspan x="622" dy="0">Ghi song song vào kho dữ</tspan><tspan x="622" dy="24">liệu, gửi Socket.IO</tspan></text>
  
      
