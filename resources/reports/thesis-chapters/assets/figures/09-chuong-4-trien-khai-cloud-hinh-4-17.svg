    <text x="622" y="506" class="card-title" text-anchor="middle" fill="#122033"><tspan x="622" dy="0">2. Validate schema Zod</tspan></text>
    <text x="622" y="550" class="body" text-anchor="middle" fill="#122033"><tspan x="622" dy="0">Loại bỏ payload lỗi, gắn</tspan><tspan x="622" dy="24">timestamp chuẩn</tspan></text>
  
      
