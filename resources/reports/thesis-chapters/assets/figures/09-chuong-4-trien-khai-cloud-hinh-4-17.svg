  <text x="128" y="258" class="small" text-anchor="start" fill="#122033"><tspan x="128" dy="0">EMQX đẩy message theo</tspan><tspan x="128" dy="22">topic telemetry và</tspan><tspan x="128" dy="22">alert.</tspan></text>

      
  <rect x="436" y="224" width="372" height="602" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
