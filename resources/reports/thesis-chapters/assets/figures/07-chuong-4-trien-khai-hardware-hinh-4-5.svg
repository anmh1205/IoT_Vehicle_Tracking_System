  <text x="84" y="106" class="title">Sơ đồ đấu nối tổng thể giữa ESP32-S3 và các module ngoại vi</text>
  <text x="84" y="142" class="subtitle">Sinh lại hoàn toàn bằng SVG custom theo pin mapping firmware hiện tại, thay cho layout Mermaid cũ.</text>
  
      
  <rect x="76" y="214" width="1448" height="704" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="100" y="196" width="220" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="210" y="219" class="chip" text-anchor="middle" fill="#fff">Sơ đồ đấu nối tổng thể giữa ESP32-S3 và các module ngoại vi</text>
  <text x="104" y="248" class="small" text-anchor="start" fill="#122033"><tspan x="104" dy="0">Pin mapping được chuẩn hóa theo firmware hiện tại: GPIO47/48 cho I2C, GPIO26 cho PWRKEY, GPIO19 nhận LVD_STATUS và GPIO4 đo U_batt.</tspan></text>

      
    <rect x="610" y="452" width="380" height="150" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
