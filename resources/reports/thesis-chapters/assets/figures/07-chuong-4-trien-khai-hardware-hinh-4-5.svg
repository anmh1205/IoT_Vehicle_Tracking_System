    <text x="800" y="516" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">ESP32-S3 DevKitC</tspan></text>
    <text x="800" y="560" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Trung tâm điều phối tracker, quản</tspan><tspan x="800" dy="24">lý power path, BLE OBD2, modem và</tspan><tspan x="800" dy="24">cảm biến.</tspan></text>
  
      
