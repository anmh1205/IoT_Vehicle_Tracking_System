    <text x="291" y="380" class="card-title" text-anchor="middle" fill="#122033"><tspan x="291" dy="0">Voltage divider</tspan></text>
    <text x="291" y="424" class="body" text-anchor="middle" fill="#122033"><tspan x="291" dy="0">GPIO4 / ADC</tspan><tspan x="291" dy="24">Đo U_batt</tspan></text>
  
      
