    <text x="800" y="784" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">State machine / log / MQTT</tspan></text>
    <text x="800" y="828" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Lớp runtime và telemetry dùng chung</tspan><tspan x="800" dy="24">các ngoại vi trên.</tspan></text>
  
      
