    <text x="291" y="672" class="card-title" text-anchor="middle" fill="#122033"><tspan x="291" dy="0">GPIO điều khiển</tspan><tspan x="291" dy="30">nguồn</tspan></text>
    <text x="291" y="744" class="body" text-anchor="middle" fill="#122033"><tspan x="291" dy="0">GPIO5 CHARGER_EN</tspan><tspan x="291" dy="24">GPIO18 POWER_PATH_EN</tspan><tspan x="291" dy="24">GPIO19 LVD_STATUS</tspan></text>
  
      
    <rect x="1134" y="286" width="284" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
