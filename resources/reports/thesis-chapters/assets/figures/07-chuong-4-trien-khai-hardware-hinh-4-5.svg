    <text x="1276" y="608" class="body" text-anchor="middle" fill="#122033"><tspan x="1276" dy="0">I2C GPIO47 / GPIO48</tspan><tspan x="1276" dy="24">INT1 GPIO21</tspan></text>
  
      
