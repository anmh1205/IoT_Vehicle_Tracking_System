    <text x="557" y="654" class="body" text-anchor="middle" fill="#122033"><tspan x="557" dy="0">Truy xuất theo use</tspan><tspan x="557" dy="24">case</tspan><tspan x="557" dy="24">Tổng hợp dữ liệu</tspan><tspan x="557" dy="24">trả frontend</tspan></text>
  
      
