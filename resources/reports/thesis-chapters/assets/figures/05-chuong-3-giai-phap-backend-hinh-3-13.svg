    <text x="557" y="388" class="card-title" text-anchor="middle" fill="#122033"><tspan x="557" dy="0">MQTT Bridge</tspan></text>
    <text x="557" y="432" class="body" text-anchor="middle" fill="#122033"><tspan x="557" dy="0">Xác thực schema</tspan><tspan x="557" dy="24">Phân loại dữ liệu</tspan><tspan x="557" dy="24">Ghi song song vào</tspan><tspan x="557" dy="24">nhiều kho</tspan></text>
  
      
