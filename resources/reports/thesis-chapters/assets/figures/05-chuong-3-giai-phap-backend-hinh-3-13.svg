    <text x="870" y="378" class="body" text-anchor="middle" fill="#122033"><tspan x="870" dy="0">Người dùng</tspan><tspan x="870" dy="24">Phương tiện</tspan><tspan x="870" dy="24">Khách hàng</tspan><tspan x="870" dy="24">Cảnh báo và điều</tspan><tspan x="870" dy="24">khiển</tspan></text>
  
      
