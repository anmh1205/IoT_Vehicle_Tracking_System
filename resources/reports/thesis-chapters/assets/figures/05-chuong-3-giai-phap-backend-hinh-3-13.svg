    <rect x="906" y="540" width="99" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="955.5" y="563" class="chip" text-anchor="middle" fill="#fff">analytics</text>
    <text x="1119" y="584" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1119" dy="0">Lớp khai thác dữ liệu</tspan></text>
    <text x="1119" y="628" class="body" text-anchor="middle" fill="#122033"><tspan x="1119" dy="0">REST API truy xuất PostgreSQL cho dữ liệu</tspan><tspan x="1119" dy="24">nghiệp vụ.</tspan><tspan x="1119" dy="24">PromQL/Grafana khai thác VictoriaMetrics</tspan><tspan x="1119" dy="24">cho dashboard theo thời gian.</tspan><tspan x="1119" dy="24">LogsQL hỗ trợ điều tra sự cố và đối soát</tspan><tspan x="1119" dy="24">sự kiện.</tspan></text>
  
      
