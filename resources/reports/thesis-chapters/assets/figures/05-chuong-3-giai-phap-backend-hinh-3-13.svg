    <text x="1120" y="334" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1120" dy="0">VictoriaMetrics</tspan></text>
    <text x="1120" y="378" class="body" text-anchor="middle" fill="#122033"><tspan x="1120" dy="0">Vị trí GPS</tspan><tspan x="1120" dy="24">RPM, tốc độ, nhiệt</tspan><tspan x="1120" dy="24">độ</tspan><tspan x="1120" dy="24">Dữ liệu cảm biến</tspan><tspan x="1120" dy="24">theo chuỗi thời gian</tspan></text>
  
      
    <rect x="1260" y="270" width="220" height="168" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1260" y="270" width="220" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1278" y="290" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1323" y="313" class="chip" text-anchor="middle" fill="#fff">logs</text>
    <text x="1370" y="334" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1370" dy="0">VictoriaLogs</tspan></text>
    <text x="1370" y="378" class="body" text-anchor="middle" fill="#122033"><tspan x="1370" dy="0">Kết nối</tspan><tspan x="1370" dy="24">Lỗi thiết bị</tspan><tspan x="1370" dy="24">Audit trail và log</tspan><tspan x="1370" dy="24">bridge</tspan></text>
  
      
