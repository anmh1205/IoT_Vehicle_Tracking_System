  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(217, 72, 95, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Chiến lược lưu trữ kép của hệ thống</text>
  <text x="84" y="142" class="subtitle">Mỗi loại dữ liệu được ghi vào đúng kho chuyên biệt để tối ưu vận hành và truy vấn.</text>
  
      
  <rect x="82" y="220" width="300" height="608" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="106" y="202" width="156" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="184" y="225" class="chip" text-anchor="middle" fill="#fff">Nguồn dữ liệu</text>
  <text x="110" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="110" dy="0">Dữ liệu thô phát sinh</tspan><tspan x="110" dy="22">theo ngữ cảnh vận hành</tspan><tspan x="110" dy="22">của xe.</tspan></text>

      
  <rect x="426" y="220" width="262" height="608" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="450" y="202" width="180" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="540" y="225" class="chip" text-anchor="middle" fill="#fff">Gateway dữ liệu</text>
  <text x="454" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="454" dy="0">Chuẩn hóa payload và</tspan><tspan x="454" dy="22">định tuyến đúng loại</tspan><tspan x="454" dy="22">kho lưu trữ.</tspan></text>

      
  <rect x="726" y="220" width="788" height="608" rx="30" fill="#ffffff" stroke="rgba(217, 72, 95, 0.28)" stroke-width="3" />
  <rect x="750" y="202" width="220" height="34" rx="17" fill="#d9485f" stroke="#d9485f" stroke-width="2" /><text x="860" y="225" class="chip" text-anchor="middle" fill="#fff">Kho dữ liệu chuyên biệt</text>
  <text x="754" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="754" dy="0">Mỗi loại dữ liệu dùng đúng công cụ để cân bằng tốc độ và khả năng truy</tspan><tspan x="754" dy="22">vấn.</tspan></text>

      
