    <text x="232" y="350" class="card-title" text-anchor="middle" fill="#122033"><tspan x="232" dy="0">Thiết bị tracker</tspan></text>
    <text x="232" y="394" class="body" text-anchor="middle" fill="#122033"><tspan x="232" dy="0">GPS, OBD2, điện áp,</tspan><tspan x="232" dy="24">trạng thái nguồn</tspan><tspan x="232" dy="24">Dữ liệu gửi định kỳ</tspan><tspan x="232" dy="24">qua MQTT</tspan></text>
  
      
