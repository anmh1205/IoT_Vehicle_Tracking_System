    <text x="232" y="560" class="card-title" text-anchor="middle" fill="#122033"><tspan x="232" dy="0">Frontend và API</tspan></text>
    <text x="232" y="604" class="body" text-anchor="middle" fill="#122033"><tspan x="232" dy="0">CRUD xe, chuyến đi,</tspan><tspan x="232" dy="24">cảnh báo</tspan><tspan x="232" dy="24">Truy vấn dữ liệu lịch</tspan><tspan x="232" dy="24">sử</tspan></text>
  
      
