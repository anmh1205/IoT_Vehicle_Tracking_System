    <text x="658" y="580" class="card-title" text-anchor="middle" fill="#122033"><tspan x="658" dy="0">Pin 21700 + giá đỡ</tspan></text>
    <text x="658" y="624" class="body" text-anchor="middle" fill="#122033"><tspan x="658" dy="0">Khối dự phòng ở trung tâm</tspan><tspan x="658" dy="24">trọng lượng</tspan></text>
  
      
