<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#c97a10"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(201, 122, 16, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ mạch đo điện áp ắc quy bằng voltage divider và ADC ESP32-S3</text>
  <text x="84" y="142" class="subtitle">Chuẩn hóa lại tỷ lệ chia áp, nhánh R1/R2 và đường đi vào ADC của ESP32-S3.</text>
  
      
  <rect x="96" y="236" width="1408" height="600" rx="30" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="3" />
  <rect x="120" y="218" width="220" height="34" rx="17" fill="#c97a10" stroke="#c97a10" stroke-width="2" /><text x="230" y="241" class="chip" text-anchor="middle" fill="#fff">Mạch chia áp đo điện áp ắc quy</text>
  <text x="124" y="270" class="small" text-anchor="start" fill="#122033"><tspan x="124" dy="0">Chuỗi phần cứng chuẩn hóa cho cả hệ 12V và 24V, đưa điện áp về dải ADC1 của ESP32-S3.</tspan></text>

      
    <rect x="126" y="422" width="260" height="156" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="126" y="422" width="260" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="144" y="442" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="189" y="465" class="chip" text-anchor="middle" fill="#fff">input</text>
    <text x="256" y="486" class="card-title" text-anchor="middle" fill="#122033"><tspan x="256" dy="0">Ắc quy xe</tspan></text>
    <text x="256" y="530" class="body" text-anchor="middle" fill="#122033"><tspan x="256" dy="0">12V hoặc 24V danh định</tspan></text>
  
      
    <rect x="464" y="402" width="240" height="196" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="464" y="402" width="240" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="482" y="422" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="527" y="445" class="chip" text-anchor="middle" fill="#fff">resistor</text>
    <text x="584" y="466" class="card-title" text-anchor="middle" fill="#122033"><tspan x="584" dy="0">R1 = 100 kΩ</tspan></text>
    <text x="584" y="510" class="body" text-anchor="middle" fill="#122033"><tspan x="584" dy="0">Điện trở nhánh trên</tspan><tspan x="584" dy="24">Giảm áp để bảo vệ ADC</tspan></text>
  
      
    <rect x="792" y="404" width="304" height="192" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="792" y="404" width="304" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="810" y="424" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="855" y="447" class="chip" text-anchor="middle" fill="#fff">sense</text>
    <text x="944" y="468" class="card-title" text-anchor="middle" fill="#122033"><tspan x="944" dy="0">Nút chia áp</tspan></text>
    <text x="944" y="512" class="body" text-anchor="middle" fill="#122033"><tspan x="944" dy="0">V_adc = U_batt x 0.0909</tspan><tspan x="944" dy="24">Tín hiệu analog trước khi</tspan><tspan x="944" dy="24">vào ADC</tspan></text>
  
      
    <rect x="1182" y="410" width="250" height="180" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1182" y="410" width="250" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="1200" y="430" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="1245" y="453" class="chip" text-anchor="middle" fill="#fff">adc</text>
    <text x="1307" y="474" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1307" dy="0">GPIO4 / ADC1</tspan></text>
    <text x="1307" y="518" class="body" text-anchor="middle" fill="#122033"><tspan x="1307" dy="0">ESP32-S3 đọc điện áp</tspan><tspan x="1307" dy="24">và suy ra IGN, LVD</tspan><tspan x="1307" dy="24">theo profile</tspan></text>
  
      
    <rect x="792" y="666" width="304" height="110" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="792" y="666" width="304" height="12" rx="26" fill="#64748b" stroke="none"/>
    <rect x="810" y="686" width="90" height="34" rx="17" fill="rgba(100, 116, 139, 0.88)" stroke="rgba(100, 116, 139, 0.88)" stroke-width="2" /><text x="855" y="709" class="chip" text-anchor="middle" fill="#fff">resistor</text>
    <text x="944" y="730" class="card-title" text-anchor="middle" fill="#122033"><tspan x="944" dy="0">R2 = 10 kΩ xuống GND</tspan></text>
    <text x="944" y="774" class="body" text-anchor="middle" fill="#122033"><tspan x="944" dy="0">Hoàn tất bộ chia áp</tspan></text>
  
      
    <line x1="386" y1="500" x2="464" y2="500" stroke="#d9485f" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="704" y1="500" x2="792" y2="500" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="1096" y1="500" x2="1182" y2="500" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <polyline points="944,596 944,666" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    
  
      <text x="946" y="650" class="small" text-anchor="middle" fill="#122033"><tspan x="946" dy="0">GND</tspan></text>
      <rect x="310" y="820" width="980" height="54" rx="18" fill="#eef4ff" stroke="rgba(201, 122, 16, 0.18)" stroke-width="2" /><text x="800" y="853" class="small" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Firmware dùng cùng bộ chia áp cho cả hai profile 12V và 24V; các ngưỡng Switch_OFF, Switch_ON,</tspan><tspan x="800" dy="20">IGN_ON và IGN_OFF được hiệu chỉnh trong cấu hình.</tspan></text>
    
</svg>