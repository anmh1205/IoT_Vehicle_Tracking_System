<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#6d4fe0"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(109, 79, 224, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ máy trạng thái của thiết bị theo dõi</text>
  <text x="84" y="142" class="subtitle">Cập nhật lại đủ bảy trạng thái INIT, CHECK_IGN, DRIVING, PARKED, ALARM, HEARTBEAT và SLEEP theo text chuẩn.</text>
  
      
  <rect x="88" y="210" width="1424" height="706" rx="30" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="3" />
  <rect x="112" y="192" width="220" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="222" y="215" class="chip" text-anchor="middle" fill="#fff">Máy trạng thái của thiết bị theo dõi</text>
  <text x="116" y="244" class="small" text-anchor="start" fill="#122033"><tspan x="116" dy="0">Bảy trạng thái chính điều phối toàn bộ hành vi firmware từ lúc khởi tạo cho tới deep sleep.</tspan></text>

      
    <rect x="640" y="256" width="320" height="106" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="640" y="256" width="320" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="658" y="276" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="703" y="299" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="800" y="320" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">INIT</tspan></text>
    <text x="800" y="364" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Khởi tạo ngoại vi</tspan></text>
  
      
    <rect x="640" y="412" width="320" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="640" y="412" width="320" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="658" y="432" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="703" y="455" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="800" y="476" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">CHECK_IGN</tspan></text>
    <text x="800" y="520" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Ưu tiên OBD2, fallback ADC</tspan></text>
  
      
    <rect x="154" y="620" width="316" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="154" y="620" width="316" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="172" y="640" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="217" y="663" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="312" y="684" class="card-title" text-anchor="middle" fill="#122033"><tspan x="312" dy="0">DRIVING</tspan></text>
    <text x="312" y="728" class="body" text-anchor="middle" fill="#122033"><tspan x="312" dy="0">Theo dõi liên tục, publish</tspan><tspan x="312" dy="24">telemetry</tspan></text>
  
      
    <rect x="642" y="620" width="316" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="642" y="620" width="316" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="660" y="640" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="705" y="663" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="800" y="684" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">PARKED</tspan></text>
    <text x="800" y="728" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Ngắt BLE, chờ heartbeat hoặc</tspan><tspan x="800" dy="24">motion</tspan></text>
  
      
    <rect x="1130" y="620" width="316" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1130" y="620" width="316" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1148" y="640" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1193" y="663" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="1288" y="684" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1288" dy="0">ALARM</tspan></text>
    <text x="1288" y="728" class="body" text-anchor="middle" fill="#122033"><tspan x="1288" dy="0">Wake modem, gửi motion alert</tspan></text>
  
      
    <rect x="430" y="804" width="316" height="114" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="430" y="804" width="316" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="448" y="824" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="493" y="847" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="588" y="868" class="card-title" text-anchor="middle" fill="#122033"><tspan x="588" dy="0">HEARTBEAT</tspan></text>
    <text x="588" y="912" class="body" text-anchor="middle" fill="#122033"><tspan x="588" dy="0">Gửi heartbeat định kỳ</tspan></text>
  
      
    <rect x="860" y="804" width="316" height="114" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="860" y="804" width="316" height="12" rx="26" fill="#64748b" stroke="none"/>
    <rect x="878" y="824" width="90" height="34" rx="17" fill="rgba(100, 116, 139, 0.88)" stroke="rgba(100, 116, 139, 0.88)" stroke-width="2" /><text x="923" y="847" class="chip" text-anchor="middle" fill="#fff">state</text>
    <text x="1018" y="868" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1018" dy="0">SLEEP</tspan></text>
    <text x="1018" y="912" class="body" text-anchor="middle" fill="#122033"><tspan x="1018" dy="0">Deep sleep, chờ timer hoặc</tspan><tspan x="1018" dy="24">IMU</tspan></text>
  
      
    <line x1="800" y1="362" x2="800" y2="412" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="810" y="368" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="2" /><text x="900" y="401" class="small" text-anchor="middle" fill="#122033"><tspan x="900" dy="0">Khởi tạo hoàn tất</tspan></text>
  
      
    <line x1="640" y1="488" x2="470" y2="654" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="512" y="518" width="96" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="560" y="551" class="small" text-anchor="middle" fill="#122033"><tspan x="560" dy="0">IGN = ON</tspan></text>
  
      
    <line x1="800" y1="530" x2="800" y2="620" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="826" y="544" width="108" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="2" /><text x="880" y="577" class="small" text-anchor="middle" fill="#122033"><tspan x="880" dy="0">IGN = OFF</tspan></text>
  
      
    <line x1="470" y1="680" x2="642" y2="680" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="430" y="616" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="2" /><text x="520" y="649" class="small" text-anchor="middle" fill="#122033"><tspan x="520" dy="0">Phát hiện IGN OFF</tspan></text>
  
      
    <line x1="958" y1="680" x2="1130" y2="680" stroke="#d9485f" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="938" y="604" width="156" height="54" rx="18" fill="#ffffff" stroke="rgba(217, 72, 95, 0.28)" stroke-width="2" /><text x="1016" y="637" class="small" text-anchor="middle" fill="#122033"><tspan x="1016" dy="0">IMU interrupt</tspan></text>
  
      
    <line x1="760" y1="738" x2="588" y2="804" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="560" y="744" width="156" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="638" y="777" class="small" text-anchor="middle" fill="#122033"><tspan x="638" dy="0">Timer wake-up</tspan></text>
  
      
    <polyline points="1288,620 1288,540 640,540 470,620" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    <rect x="1138" y="500" width="96" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="1186" y="533" class="small" text-anchor="middle" fill="#122033"><tspan x="1186" dy="0">IGN = ON</tspan></text>
  
      
    <polyline points="1130,700 1058,700 1058,680 958,680" fill="none" stroke="#0f9d76" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    <rect x="956" y="716" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="2" /><text x="1046" y="749" class="small" text-anchor="middle" fill="#122033"><tspan x="1046" dy="0">Motion dừng, IGN</tspan><tspan x="1046" dy="20">OFF</tspan></text>
  
      
    <line x1="746" y1="860" x2="860" y2="860" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="712" y="802" width="96" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="760" y="835" class="small" text-anchor="middle" fill="#122033"><tspan x="760" dy="0">Gửi xong</tspan></text>
  
      
    <polyline points="1176,860 1320,860 1320,470 960,470" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    
  
      <rect x="1228" y="654" width="232" height="54" rx="18" fill="#ffffff" stroke="rgba(100, 116, 139, 0.24)" stroke-width="2" /><text x="1344" y="687" class="small" text-anchor="middle" fill="#122033"><tspan x="1344" dy="0">Timer hoặc IMU</tspan><tspan x="1344" dy="20">interrupt</tspan></text>
    
</svg>