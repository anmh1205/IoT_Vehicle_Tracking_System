<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#c97a10"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(201, 122, 16, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Lưu đồ thuật toán điều khiển modem theo chế độ hoạt động</text>
  <text x="84" y="142" class="subtitle">Biểu diễn các bước wake modem, đăng ký mạng và ba nhánh driving, heartbeat, parked bằng SVG custom.</text>
  
      
  <rect x="94" y="210" width="1412" height="700" rx="30" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="3" />
  <rect x="118" y="192" width="220" height="34" rx="17" fill="#c97a10" stroke="#c97a10" stroke-width="2" /><text x="228" y="215" class="chip" text-anchor="middle" fill="#fff">Thuật toán điều khiển modem theo chế độ hoạt động</text>
  <text x="122" y="244" class="small" text-anchor="start" fill="#122033"><tspan x="122" dy="0">Firmware kiểm tra phản hồi AT, trạng thái mạng rồi chọn cấu hình modem phù hợp với driving, heartbeat hoặc parked.</tspan></text>

      
    <rect x="544" y="246" width="512" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="544" y="246" width="512" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="562" y="266" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="607" y="289" class="chip" text-anchor="middle" fill="#fff">start</text>
    <text x="800" y="310" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Wake modem hoặc cold start</tspan></text>
    <text x="800" y="354" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">AT -&gt; CPIN -&gt; CEREG -&gt; CSQ</tspan><tspan x="800" dy="24">Kiểm tra sẵn sàng của SIM và đăng ký mạng</tspan></text>
  
      
    <polygon points="800,404 982,470 800,536 618,470" fill="rgba(217, 72, 95, 0.1)" stroke="rgba(217, 72, 95, 0.42)" stroke-width="3" />
    <rect x="748" y="416" width="104" height="34" rx="17" fill="#d9485f" stroke="#d9485f" stroke-width="2" /><text x="800" y="439" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="480" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Modem phản hồi?</tspan></text>
  
      
    <rect x="180" y="562" width="320" height="140" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="180" y="562" width="320" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="198" y="582" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="243" y="605" class="chip" text-anchor="middle" fill="#fff">recovery</text>
    <text x="340" y="626" class="card-title" text-anchor="middle" fill="#122033"><tspan x="340" dy="0">Reset PWRKEY và đợi</tspan><tspan x="340" dy="30">10-30 giây</tspan></text>
    <text x="340" y="698" class="body" text-anchor="middle" fill="#122033"><tspan x="340" dy="0">Lặp lại chuỗi AT sau khi</tspan><tspan x="340" dy="24">modem hồi phục.</tspan></text>
  
      
    <polygon points="800,572 982,638 800,704 618,638" fill="rgba(109, 79, 224, 0.1)" stroke="rgba(109, 79, 224, 0.42)" stroke-width="3" />
    <rect x="748" y="584" width="104" height="34" rx="17" fill="#6d4fe0" stroke="#6d4fe0" stroke-width="2" /><text x="800" y="607" class="chip" text-anchor="middle" fill="#fff">decision</text>
    <text x="800" y="648" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Đã đăng ký mạng?</tspan></text>
  
      
    <rect x="184" y="742" width="316" height="126" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="184" y="742" width="316" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="202" y="762" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="247" y="785" class="chip" text-anchor="middle" fill="#fff">retry</text>
    <text x="342" y="806" class="card-title" text-anchor="middle" fill="#122033"><tspan x="342" dy="0">Đợi và retry CEREG /</tspan><tspan x="342" dy="30">CPIN</tspan></text>
    <text x="342" y="878" class="body" text-anchor="middle" fill="#122033"><tspan x="342" dy="0">Tiếp tục vòng polling cho</tspan><tspan x="342" dy="24">đến khi có sóng.</tspan></text>
  
      
    <polygon points="800,760 984,828 800,896 616,828" fill="rgba(15, 118, 110, 0.1)" stroke="rgba(15, 118, 110, 0.42)" stroke-width="3" />
    <rect x="754" y="772" width="92" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="800" y="795" class="chip" text-anchor="middle" fill="#fff">mode</text>
    <text x="800" y="836" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Chế độ hoạt động hiện tại?</tspan></text>
  
      
    <rect x="1088" y="542" width="330" height="148" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1088" y="542" width="330" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="1106" y="562" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="1151" y="585" class="chip" text-anchor="middle" fill="#fff">mode</text>
    <text x="1253" y="606" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1253" dy="0">DRIVING</tspan></text>
    <text x="1253" y="650" class="body" text-anchor="middle" fill="#122033"><tspan x="1253" dy="0">Giữ LTE active</tspan><tspan x="1253" dy="24">Bật GNSS, đọc CGNSINF /</tspan><tspan x="1253" dy="24">CGNSTST</tspan><tspan x="1253" dy="24">Publish telemetry MQTT</tspan></text>
  
      
    <rect x="1062" y="724" width="356" height="126" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1062" y="724" width="356" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="1080" y="744" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1125" y="767" class="chip" text-anchor="middle" fill="#fff">mode</text>
    <text x="1240" y="788" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1240" dy="0">HEARTBEAT</tspan></text>
    <text x="1240" y="832" class="body" text-anchor="middle" fill="#122033"><tspan x="1240" dy="0">Bật LTE, gửi heartbeat rồi tắt</tspan><tspan x="1240" dy="24">PDP trước khi ngủ</tspan></text>
  
      
    <rect x="1052" y="872" width="376" height="94" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1052" y="872" width="376" height="12" rx="26" fill="#64748b" stroke="none"/>
    <rect x="1070" y="892" width="90" height="34" rx="17" fill="rgba(100, 116, 139, 0.88)" stroke="rgba(100, 116, 139, 0.88)" stroke-width="2" /><text x="1115" y="915" class="chip" text-anchor="middle" fill="#fff">mode</text>
    <text x="1240" y="936" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1240" dy="0">PARKED / SLEEP PREP</tspan></text>
    <text x="1240" y="980" class="body" text-anchor="middle" fill="#122033"><tspan x="1240" dy="0">AT+CGACT=0,1 hoặc AT+CFUN=4, sau</tspan><tspan x="1240" dy="24">đó AT+CSCLK=1</tspan></text>
  
      
