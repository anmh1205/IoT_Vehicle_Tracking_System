<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#c97a10"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(201, 122, 16, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Thiết bị tracker được lắp đặt trên xe thử nghiệm</text>
  <text x="84" y="142" class="subtitle">Minh họa vị trí tracker, cổng OBD2, anten và tuyến đi dây chính.</text>
  
      <rect x="80" y="200" width="1440" height="720" rx="34" fill="#ffffff" stroke="rgba(201, 122, 16, 0.18)" stroke-width="2" />
      <path d="M238 610 L290 520 L430 468 L730 468 L840 520 L916 520 L954 574 L954 632 L866 632 L838 676 L730 676 L706 632 L468 632 L442 676 L330 676 L304 632 L220 632 L220 590 Z" fill="rgba(29, 78, 216, 0.08)" stroke="rgba(29, 78, 216, 0.42)" stroke-width="4"/>
      <circle cx="384" cy="674" r="52" fill="#fff" stroke="rgba(29, 78, 216, 0.42)" stroke-width="4"/>
      <circle cx="766" cy="674" r="52" fill="#fff" stroke="rgba(29, 78, 216, 0.42)" stroke-width="4"/>
      
    <rect x="342" y="452" width="190" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="342" y="452" width="190" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="360" y="472" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="405" y="495" class="chip" text-anchor="middle" fill="#fff">port</text>
    <text x="437" y="516" class="card-title" text-anchor="middle" fill="#122033"><tspan x="437" dy="0">Cổng OBD2</tspan></text>
    <text x="437" y="560" class="body" text-anchor="middle" fill="#122033"><tspan x="437" dy="0">Nguồn xe + dữ liệu</tspan><tspan x="437" dy="24">chẩn đoán</tspan></text>
  
      
    <rect x="602" y="420" width="210" height="136" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="602" y="420" width="210" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="620" y="440" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="665" y="463" class="chip" text-anchor="middle" fill="#fff">device</text>
    <text x="707" y="484" class="card-title" text-anchor="middle" fill="#122033"><tspan x="707" dy="0">Tracker trong</tspan><tspan x="707" dy="30">cabin</tspan></text>
    <text x="707" y="556" class="body" text-anchor="middle" fill="#122033"><tspan x="707" dy="0">ESP32-S3 +</tspan><tspan x="707" dy="24">SIM7600CE-T</tspan><tspan x="707" dy="24">Đặt gần bảng táp-lô</tspan></text>
  
      
    <rect x="850" y="436" width="124" height="102" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="850" y="436" width="124" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="868" y="456" width="88" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="912" y="479" class="chip" text-anchor="middle" fill="#fff">rf</text>
    <text x="912" y="500" class="card-title" text-anchor="middle" fill="#122033"><tspan x="912" dy="0">Anten</tspan></text>
    <text x="912" y="544" class="body" text-anchor="middle" fill="#122033"><tspan x="912" dy="0">LTE / GNSS</tspan></text>
  
      
    <rect x="1118" y="310" width="312" height="160" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1118" y="310" width="312" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="1136" y="330" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1181" y="353" class="chip" text-anchor="middle" fill="#fff">note</text>
    <text x="1274" y="374" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1274" dy="0">Kết nối chính</tspan></text>
    <text x="1274" y="418" class="body" text-anchor="middle" fill="#122033"><tspan x="1274" dy="0">OBD2 cung cấp nguồn xe và dữ</tspan><tspan x="1274" dy="24">liệu động cơ.</tspan><tspan x="1274" dy="24">Tracker lấy GNSS từ modem và</tspan><tspan x="1274" dy="24">gửi MQTT qua 4G.</tspan></text>
  
      
    <rect x="1118" y="520" width="312" height="178" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1118" y="520" width="312" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="1136" y="540" width="99" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="1185.5" y="563" class="chip" text-anchor="middle" fill="#fff">checklist</text>
    <text x="1274" y="584" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1274" dy="0">Lưu ý lắp đặt</tspan></text>
    <text x="1274" y="628" class="body" text-anchor="middle" fill="#122033"><tspan x="1274" dy="0">Đi dây gọn, tránh gần vùng</tspan><tspan x="1274" dy="24">nhiệt cao.</tspan><tspan x="1274" dy="24">Anten đặt thoáng để cải</tspan><tspan x="1274" dy="24">thiện GNSS.</tspan><tspan x="1274" dy="24">Thiết bị cố định để hạn chế</tspan><tspan x="1274" dy="24">rung lắc.</tspan></text>
  
      
    <line x1="532" y1="500" x2="602" y2="488" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="444" y="432" width="144" height="54" rx="18" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="2" /><text x="516" y="465" class="small" text-anchor="middle" fill="#122033"><tspan x="516" dy="0">nguồn + OBD2</tspan></text>
  
      
    <line x1="812" y1="470" x2="850" y2="488" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="746" y="412" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="790" y="445" class="small" text-anchor="middle" fill="#122033"><tspan x="790" dy="0">RF</tspan></text>
  
      
    <polyline points="812,488 1018,488 1118,388" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    <rect x="840" y="424" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="930" y="457" class="small" text-anchor="middle" fill="#122033"><tspan x="930" dy="0">luồng telemetry</tspan></text>
  
    
</svg>