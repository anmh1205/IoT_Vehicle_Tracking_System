  <text x="84" y="142" class="subtitle">Roadmap được tách làm hai cụm mốc để giữ hình cân trang và dễ theo dõi hơn.</text>
  
      
  <rect x="94" y="236" width="1412" height="246" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="118" y="218" width="220" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="228" y="241" class="chip" text-anchor="middle" fill="#fff">Các mốc hoàn thiện prototype</text>
  <text x="122" y="270" class="small" text-anchor="start" fill="#122033"><tspan x="122" dy="0">Ba bước đầu giữ nhịp triển khai hoặc kiểm tra trước khi chuyển sang pha kế tiếp.</tspan></text>

      
  <rect x="94" y="552" width="1412" height="246" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="118" y="534" width="220" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="228" y="557" class="chip" text-anchor="middle" fill="#fff">Các mốc mở rộng sản phẩm</text>
  <text x="122" y="586" class="small" text-anchor="start" fill="#122033"><tspan x="122" dy="0">Ba bước cuối chốt vòng thực thi, đánh giá và hoàn thiện hệ thống.</tspan></text>

      
    <rect x="138" y="304" width="280" height="128" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
