    <rect x="1000" y="324" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1045" y="347" class="chip" text-anchor="middle" fill="#fff">m3</text>
    <text x="1122" y="368" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1122" dy="0">Mốc 3</tspan></text>
    <text x="1122" y="412" class="body" text-anchor="middle" fill="#122033"><tspan x="1122" dy="0">Ổn định hóa cloud và</tspan><tspan x="1122" dy="24">dashboard</tspan></text>
  
    <rect x="138" y="620" width="280" height="128" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="138" y="620" width="280" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="156" y="640" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="201" y="663" class="chip" text-anchor="middle" fill="#fff">m4</text>
