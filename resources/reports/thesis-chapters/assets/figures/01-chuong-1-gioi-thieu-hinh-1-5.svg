    <rect x="1130" y="492" width="120" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="1190" y="525" class="small" text-anchor="middle" fill="#122033"><tspan x="1190" dy="0">chuyển pha</tspan></text>
  
      
    <line x1="418" y1="684" x2="560" y2="684" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
