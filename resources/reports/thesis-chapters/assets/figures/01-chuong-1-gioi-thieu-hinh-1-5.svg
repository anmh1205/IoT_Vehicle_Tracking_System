    <text x="278" y="728" class="body" text-anchor="middle" fill="#122033"><tspan x="278" dy="0">Ứng dụng di động và thông</tspan><tspan x="278" dy="24">báo đẩy</tspan></text>
  
    <rect x="560" y="620" width="280" height="128" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="560" y="620" width="280" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="578" y="640" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="623" y="663" class="chip" text-anchor="middle" fill="#fff">m5</text>
    <text x="700" y="684" class="card-title" text-anchor="middle" fill="#122033"><tspan x="700" dy="0">Mốc 5</tspan></text>
    <text x="700" y="728" class="body" text-anchor="middle" fill="#122033"><tspan x="700" dy="0">PCB chuyên dụng và tối ưu</tspan><tspan x="700" dy="24">sản xuất</tspan></text>
  
    <rect x="982" y="620" width="280" height="128" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="982" y="620" width="280" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="1000" y="640" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="1045" y="663" class="chip" text-anchor="middle" fill="#fff">m6</text>
    <text x="1122" y="684" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1122" dy="0">Mốc 6</tspan></text>
    <text x="1122" y="728" class="body" text-anchor="middle" fill="#122033"><tspan x="1122" dy="0">Mở rộng AI, bảo mật và</tspan><tspan x="1122" dy="24">scale-out</tspan></text>
  
      
    <line x1="418" y1="368" x2="560" y2="368" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
