<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(15, 118, 110, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ mạch Power Path và logic chuyển nguồn tự động</text>
  <text x="84" y="142" class="subtitle">Ghép lại logic chọn nhánh chính hoặc backup, bám đúng tín hiệu ADC, LVD_STATUS, GPIO18 và GPIO5.</text>
  
      
  <rect x="92" y="228" width="388" height="596" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="116" y="210" width="180" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="206" y="233" class="chip" text-anchor="middle" fill="#fff">Hai nhánh nguồn</text>
  <text x="120" y="262" class="small" text-anchor="start" fill="#122033"><tspan x="120" dy="0">Nguồn chính từ MP2482 và nguồn</tspan><tspan x="120" dy="22">backup từ SX1308 hội tụ qua</tspan><tspan x="120" dy="22">diode-OR.</tspan></text>

      
  <rect x="520" y="228" width="370" height="596" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="544" y="210" width="180" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="634" y="233" class="chip" text-anchor="middle" fill="#fff">ESP32 Power FSM</text>
  <text x="548" y="262" class="small" text-anchor="start" fill="#122033"><tspan x="548" dy="0">Firmware đọc LVD + ADC rồi</tspan><tspan x="548" dy="22">quyết định chọn nhánh nguồn và</tspan><tspan x="548" dy="22">trạng thái sạc.</tspan></text>

      
  <rect x="930" y="228" width="578" height="596" rx="30" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="3" />
  <rect x="954" y="210" width="220" height="34" rx="17" fill="#c97a10" stroke="#c97a10" stroke-width="2" /><text x="1064" y="233" class="chip" text-anchor="middle" fill="#fff">Bus runtime và rail chức năng</text>
  <text x="958" y="262" class="small" text-anchor="start" fill="#122033"><tspan x="958" dy="0">Bus 5V runtime cấp về rail 3.3V và ~4V cho toàn hệ</tspan><tspan x="958" dy="22">thống.</tspan></text>

      
    <rect x="132" y="320" width="308" height="128" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="132" y="320" width="308" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="150" y="340" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="195" y="363" class="chip" text-anchor="middle" fill="#fff">main</text>
    <text x="286" y="384" class="card-title" text-anchor="middle" fill="#122033"><tspan x="286" dy="0">MP2482 5V</tspan></text>
    <text x="286" y="428" class="body" text-anchor="middle" fill="#122033"><tspan x="286" dy="0">Nhánh nguồn chính khi ắc quy</tspan><tspan x="286" dy="24">xe còn đủ áp</tspan></text>
  
      
    <rect x="132" y="544" width="308" height="128" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="132" y="544" width="308" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="150" y="564" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="195" y="587" class="chip" text-anchor="middle" fill="#fff">backup</text>
    <text x="286" y="608" class="card-title" text-anchor="middle" fill="#122033"><tspan x="286" dy="0">SX1308 5V backup</tspan></text>
    <text x="286" y="652" class="body" text-anchor="middle" fill="#122033"><tspan x="286" dy="0">Nhánh dự phòng từ pin 21700</tspan></text>
  
      
    <rect x="560" y="304" width="290" height="138" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="560" y="304" width="290" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="578" y="324" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="623" y="347" class="chip" text-anchor="middle" fill="#fff">sense</text>
    <text x="705" y="368" class="card-title" text-anchor="middle" fill="#122033"><tspan x="705" dy="0">Đầu vào giám sát</tspan></text>
    <text x="705" y="412" class="body" text-anchor="middle" fill="#122033"><tspan x="705" dy="0">GPIO19 LVD_STATUS</tspan><tspan x="705" dy="24">GPIO4 ADC</tspan><tspan x="705" dy="24">Ngưỡng profile 12V / 24V</tspan></text>
  
      
    <rect x="560" y="526" width="290" height="158" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="560" y="526" width="290" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="578" y="546" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="623" y="569" class="chip" text-anchor="middle" fill="#fff">control</text>
    <text x="705" y="590" class="card-title" text-anchor="middle" fill="#122033"><tspan x="705" dy="0">Điều khiển FSM</tspan></text>
    <text x="705" y="634" class="body" text-anchor="middle" fill="#122033"><tspan x="705" dy="0">GPIO18 POWER_PATH_EN chọn</tspan><tspan x="705" dy="24">nhánh runtime</tspan><tspan x="705" dy="24">GPIO5 CHARGER_EN bật hoặc</tspan><tspan x="705" dy="24">tắt sạc</tspan></text>
  
      
    <rect x="970" y="430" width="218" height="148" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="970" y="430" width="218" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="988" y="450" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1033" y="473" class="chip" text-anchor="middle" fill="#fff">or</text>
    <text x="1079" y="494" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1079" dy="0">D1 + D2</tspan><tspan x="1079" dy="30">Schottky</tspan></text>
    <text x="1079" y="566" class="body" text-anchor="middle" fill="#122033"><tspan x="1079" dy="0">Diode-OR cách ly</tspan><tspan x="1079" dy="24">hai nhánh</tspan></text>
  
      
    <rect x="1230" y="430" width="238" height="148" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1230" y="430" width="238" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="1248" y="450" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1293" y="473" class="chip" text-anchor="middle" fill="#fff">bus</text>
    <text x="1349" y="494" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1349" dy="0">Bus 5V runtime</tspan></text>
    <text x="1349" y="538" class="body" text-anchor="middle" fill="#122033"><tspan x="1349" dy="0">Không reset khi</tspan><tspan x="1349" dy="24">chuyển nguồn</tspan></text>
  
      
    <rect x="1100" y="648" width="498" height="126" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1100" y="648" width="498" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1118" y="668" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1163" y="691" class="chip" text-anchor="middle" fill="#fff">rails</text>
    <text x="1349" y="712" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1349" dy="0">Rail đầu ra</tspan></text>
    <text x="1349" y="756" class="body" text-anchor="middle" fill="#122033"><tspan x="1349" dy="0">XL1509 3.3V cho ESP32-S3, LIS3DH</tspan><tspan x="1349" dy="24">TPS54231 ~4V cho SIM7600CE-T</tspan></text>
  
      
    <line x1="440" y1="384" x2="560" y2="372" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="440" y1="608" x2="560" y2="604" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="850" y1="372" x2="970" y2="476" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="818" y="392" width="108" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="872" y="425" class="small" text-anchor="middle" fill="#122033"><tspan x="872" dy="0">LVD + ADC</tspan></text>
  
      
    <polyline points="850,604 930,604 930,522 970,522" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/>
    <rect x="798" y="544" width="168" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="882" y="577" class="small" text-anchor="middle" fill="#122033"><tspan x="882" dy="0">GPIO18 / GPIO5</tspan></text>
  
      
    <line x1="1188" y1="504" x2="1230" y2="504" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="1348" y1="578" x2="1348" y2="648" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    
</svg>