<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(15, 118, 110, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ chuyển đổi giữa các chế độ năng lượng</text>
  <text x="84" y="142" class="subtitle">Thiết bị chuyển giữa lái xe, đỗ xe và cảnh báo theo trạng thái IGN và dữ liệu IMU.</text>
  
      
    <rect x="618" y="236" width="360" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="618" y="236" width="360" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="636" y="256" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="681" y="279" class="chip" text-anchor="middle" fill="#fff">driving</text>
    <text x="798" y="300" class="card-title" text-anchor="middle" fill="#122033"><tspan x="798" dy="0">Chế độ lái xe</tspan></text>
    <text x="798" y="344" class="body" text-anchor="middle" fill="#122033"><tspan x="798" dy="0">IGN ON</tspan><tspan x="798" dy="24">BLE OBD2 + GNSS + 4G hoạt động</tspan><tspan x="798" dy="24">đầy đủ</tspan></text>
  
      
    <rect x="188" y="560" width="360" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="188" y="560" width="360" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="206" y="580" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="251" y="603" class="chip" text-anchor="middle" fill="#fff">parking</text>
    <text x="368" y="624" class="card-title" text-anchor="middle" fill="#122033"><tspan x="368" dy="0">Chế độ đỗ xe</tspan></text>
    <text x="368" y="668" class="body" text-anchor="middle" fill="#122033"><tspan x="368" dy="0">IGN OFF</tspan><tspan x="368" dy="24">ESP32 deep sleep, IMU canh rung</tspan><tspan x="368" dy="24">động</tspan></text>
  
      
    <rect x="1050" y="560" width="360" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1050" y="560" width="360" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="1068" y="580" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1113" y="603" class="chip" text-anchor="middle" fill="#fff">alert</text>
    <text x="1230" y="624" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1230" dy="0">Chế độ cảnh báo</tspan></text>
    <text x="1230" y="668" class="body" text-anchor="middle" fill="#122033"><tspan x="1230" dy="0">IMU phát hiện chuyển động</tspan><tspan x="1230" dy="24">Thiết bị thức dậy và gửi alert</tspan><tspan x="1230" dy="24">ưu tiên</tspan></text>
  
      
    <line x1="508" y1="560" x2="618" y2="412" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="476" y="446" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="520" y="479" class="small" text-anchor="middle" fill="#122033"><tspan x="520" dy="0">Bật máy</tspan></text>
  
      
    <line x1="978" y1="412" x2="1050" y2="560" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="940" y="446" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="2" /><text x="1030" y="479" class="small" text-anchor="middle" fill="#122033"><tspan x="1030" dy="0">Xe đỗ nhưng có</tspan><tspan x="1030" dy="20">rung</tspan></text>
  
      
    <line x1="1050" y1="648" x2="548" y2="648" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="664" y="586" width="180" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="2" /><text x="754" y="619" class="small" text-anchor="middle" fill="#122033"><tspan x="754" dy="0">Timeout / reset</tspan></text>
  
      
    <line x1="978" y1="324" x2="1050" y2="324" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="924" y="264" width="144" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="996" y="297" class="small" text-anchor="middle" fill="#122033"><tspan x="996" dy="0">Tiếp tục lái</tspan></text>
  
      
    <line x1="618" y1="324" x2="548" y2="560" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    <rect x="498" y="368" width="88" height="54" rx="18" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="2" /><text x="542" y="401" class="small" text-anchor="middle" fill="#122033"><tspan x="542" dy="0">Tắt máy</tspan></text>
  
    
</svg>