  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(15, 157, 118, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ kiến trúc tổng thể phương án tối ưu</text>
  <text x="84" y="142" class="subtitle">Phương án tối ưu hóa luồng dữ liệu giữa thiết bị, backend, frontend và quan trắc.</text>
  
      
  <rect x="98" y="242" width="262" height="522" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="122" y="224" width="110" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="177" y="247" class="chip" text-anchor="middle" fill="#fff">Thiết bị</text>
  <text x="126" y="276" class="small" text-anchor="start" fill="#122033"><tspan x="126" dy="0">Tracker, OBD2 và cảm</tspan><tspan x="126" dy="22">biến.</tspan></text>

      
  <rect x="404" y="242" width="250" height="522" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="428" y="224" width="110" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="483" y="247" class="chip" text-anchor="middle" fill="#fff">Messaging</text>
  <text x="432" y="276" class="small" text-anchor="start" fill="#122033"><tspan x="432" dy="0">EMQX và MQTT</tspan><tspan x="432" dy="22">Bridge.</tspan></text>

      
  <rect x="694" y="242" width="250" height="522" rx="30" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="3" />
