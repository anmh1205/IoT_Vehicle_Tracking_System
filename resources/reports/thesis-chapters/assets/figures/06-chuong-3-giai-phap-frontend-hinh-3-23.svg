  <text x="722" y="276" class="small" text-anchor="start" fill="#122033"><tspan x="722" dy="0">API, session,</tspan><tspan x="722" dy="22">command.</tspan></text>

      
  <rect x="984" y="242" width="246" height="522" rx="30" fill="#ffffff" stroke="rgba(109, 79, 224, 0.28)" stroke-width="3" />
