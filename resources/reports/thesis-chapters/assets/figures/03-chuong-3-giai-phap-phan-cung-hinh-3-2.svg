      <rect x="146" y="848" width="452" height="54" rx="18" fill="#fff7d6" stroke="rgba(201, 122, 16, 0.32)" stroke-width="2" /><text x="372" y="881" class="small" text-anchor="middle" fill="#122033"><tspan x="372" dy="0">Nếu timeout 2-3 lần, fallback sang đo U_batt</tspan><tspan x="372" dy="20">qua ADC để suy ra IGN.</tspan></text>
    
