  <text x="84" y="106" class="title">Sơ đồ kết nối BLE giữa ESP32-S3 và vgate iCar Pro</text>
  <text x="84" y="142" class="subtitle">Luồng kết nối BLE OBD2 được dàn lại theo dạng sequence SVG để đọc rõ từng bước ghép nối và truy vấn PID.</text>
  
      <rect x="90" y="198" width="1420" height="724" rx="34" fill="#ffffff" stroke="rgba(15, 118, 110, 0.18)" stroke-width="2" />
      
            
