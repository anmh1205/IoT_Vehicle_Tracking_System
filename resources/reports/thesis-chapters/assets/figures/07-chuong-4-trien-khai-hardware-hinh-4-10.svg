    <rect x="600" y="462" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="645" y="485" class="chip" text-anchor="middle" fill="#fff">bms</text>
