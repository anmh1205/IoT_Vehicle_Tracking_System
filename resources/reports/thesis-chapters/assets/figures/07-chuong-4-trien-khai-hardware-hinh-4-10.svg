  <text x="84" y="106" class="title">Sơ đồ mạch sạc TP4056 và bảo vệ pin 21700</text>
  <text x="84" y="142" class="subtitle">Thể hiện rõ chuỗi sạc pin và mối liên hệ giữa TP4056, BMS, pin 21700 và nhánh backup SX1308.</text>
  
      
