    <text x="896" y="506" class="card-title" text-anchor="middle" fill="#122033"><tspan x="896" dy="0">Pin 21700</tspan></text>
    <text x="896" y="550" class="body" text-anchor="middle" fill="#122033"><tspan x="896" dy="0">Dung lượng 5000</tspan><tspan x="896" dy="24">mAh</tspan></text>
  
