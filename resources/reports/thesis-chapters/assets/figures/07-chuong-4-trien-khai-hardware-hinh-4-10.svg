    <text x="676" y="550" class="body" text-anchor="middle" fill="#122033"><tspan x="676" dy="0">Bảo vệ pin và giới</tspan><tspan x="676" dy="24">hạn dòng</tspan></text>
  
    <rect x="802" y="442" width="188" height="136" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
