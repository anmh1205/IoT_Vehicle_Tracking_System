  <rect x="134" y="240" width="220" height="34" rx="17" fill="#d9485f" stroke="#d9485f" stroke-width="2" /><text x="244" y="263" class="chip" text-anchor="middle" fill="#fff">Chuỗi sạc và dự phòng năng lượng</text>
  <text x="138" y="292" class="small" text-anchor="start" fill="#122033"><tspan x="138" dy="0">Bus 5V từ nhánh chính sạc pin 21700 qua TP4056 và BMS; pin này lại nuôi nhánh backup SX1308.</tspan></text>

      
    <rect x="142" y="442" width="188" height="136" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
