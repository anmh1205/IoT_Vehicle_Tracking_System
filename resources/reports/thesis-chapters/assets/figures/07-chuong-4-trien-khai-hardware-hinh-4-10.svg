    <text x="1336" y="506" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1336" dy="0">Nguồn dự phòng</tspan></text>
    <text x="1336" y="550" class="body" text-anchor="middle" fill="#122033"><tspan x="1336" dy="0">Cấp cho tracker</tspan><tspan x="1336" dy="24">khi mất nguồn</tspan><tspan x="1336" dy="24">chính</tspan></text>
  
      <rect x="344" y="338" width="330" height="54" rx="18" fill="#eef4ff" stroke="rgba(217, 72, 95, 0.26)" stroke-width="2" /><text x="509" y="371" class="small" text-anchor="middle" fill="#122033"><tspan x="509" dy="0">GPIO5 CHARGER_EN bật hoặc tắt</tspan><tspan x="509" dy="20">mạch sạc TP4056</tspan></text>
      
