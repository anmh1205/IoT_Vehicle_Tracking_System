    <text x="236" y="506" class="card-title" text-anchor="middle" fill="#122033"><tspan x="236" dy="0">Bus 5V từ</tspan><tspan x="236" dy="30">MP2482</tspan></text>
    <text x="236" y="578" class="body" text-anchor="middle" fill="#122033"><tspan x="236" dy="0">Nguồn sạc khi xe</tspan><tspan x="236" dy="24">đang hoạt động</tspan></text>
  
