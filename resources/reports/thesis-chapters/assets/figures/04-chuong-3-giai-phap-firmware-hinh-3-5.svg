<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#6d4fe0"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(109, 79, 224, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ kiến trúc phân lớp của firmware</text>
  <text x="84" y="142" class="subtitle">Chuyển sang bố cục phân lớp SVG rộng ngang để tránh hình cao hẹp và bám đúng các tầng phần mềm đang triển khai.</text>
  
      <rect x="198" y="206" width="1204" height="650" rx="34" fill="#ffffff" stroke="rgba(109, 79, 224, 0.18)" stroke-width="2" />
      
    <rect x="332" y="252" width="936" height="80" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="332" y="252" width="936" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="350" y="272" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="395" y="295" class="chip" text-anchor="middle" fill="#fff">layer 1</text>
    <text x="800" y="316" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Lớp ứng dụng</tspan></text>
    <text x="800" y="360" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">State machine</tspan><tspan x="800" dy="24">Cảnh báo, geofence, policy</tspan></text>
  
    <rect x="332" y="348" width="936" height="80" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="332" y="348" width="936" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="350" y="368" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="395" y="391" class="chip" text-anchor="middle" fill="#fff">layer 2</text>
    <text x="800" y="412" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Lớp quản lý nguồn</tspan></text>
    <text x="800" y="456" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Xác định IGN</tspan><tspan x="800" dy="24">Điều phối power path, charger</tspan></text>
  
    <rect x="332" y="444" width="936" height="80" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="332" y="444" width="936" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="350" y="464" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="395" y="487" class="chip" text-anchor="middle" fill="#fff">layer 3</text>
    <text x="800" y="508" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Lớp giao tiếp và telemetry</tspan></text>
    <text x="800" y="552" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">BLE OBD2, GNSS, MQTT</tspan><tspan x="800" dy="24">Đóng gói payload JSON</tspan></text>
  
    <rect x="332" y="540" width="936" height="80" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="332" y="540" width="936" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    <rect x="350" y="560" width="90" height="34" rx="17" fill="rgba(109, 79, 224, 0.88)" stroke="rgba(109, 79, 224, 0.88)" stroke-width="2" /><text x="395" y="583" class="chip" text-anchor="middle" fill="#fff">layer 4</text>
    <text x="800" y="604" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Lớp runtime FreeRTOS</tspan></text>
    <text x="800" y="648" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Task, queue, timer, event group</tspan></text>
  
    <rect x="332" y="636" width="936" height="80" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="332" y="636" width="936" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="350" y="656" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="395" y="679" class="chip" text-anchor="middle" fill="#fff">layer 5</text>
    <text x="800" y="700" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Lớp HAL và driver</tspan></text>
    <text x="800" y="744" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">GPIO, UART, I2C, ADC, deep sleep</tspan></text>
  
    <rect x="332" y="732" width="936" height="80" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="332" y="732" width="936" height="12" rx="26" fill="#64748b" stroke="none"/>
    <rect x="350" y="752" width="90" height="34" rx="17" fill="rgba(100, 116, 139, 0.88)" stroke="rgba(100, 116, 139, 0.88)" stroke-width="2" /><text x="395" y="775" class="chip" text-anchor="middle" fill="#fff">hw</text>
    <text x="800" y="796" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Phần cứng</tspan></text>
    <text x="800" y="840" class="body" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">ESP32-S3, SIM7600CE-T, LIS3DH, adapter BLE OBD2</tspan></text>
  
      
    <line x1="800" y1="332" x2="800" y2="348" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    <line x1="800" y1="428" x2="800" y2="444" stroke="#c97a10" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    <line x1="800" y1="524" x2="800" y2="540" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    <line x1="800" y1="620" x2="800" y2="636" stroke="#6d4fe0" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    <line x1="800" y1="716" x2="800" y2="732" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      <rect x="252" y="878" width="1096" height="54" rx="18" fill="#eef4ff" stroke="rgba(109, 79, 224, 0.18)" stroke-width="2" /><text x="800" y="911" class="small" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Thiết kế được tổ chức theo hướng tách biệt nghiệp vụ, truyền thông và truy cập phần cứng để dễ kiểm thử và</tspan><tspan x="800" dy="20">bảo trì.</tspan></text>
    
</svg>