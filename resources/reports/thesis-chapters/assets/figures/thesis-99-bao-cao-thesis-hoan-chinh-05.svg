  <text x="84" y="106" class="title">Luồng dữ liệu một chiều giữa Next.js, Query, Zustand và Backend</text>
  <text x="84" y="142" class="subtitle">Tách rõ ba nguồn dữ liệu chính của frontend: REST API, client state và realtime Socket.IO.</text>
  
      
