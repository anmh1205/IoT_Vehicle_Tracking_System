    <rect x="598" y="204" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="643" y="227" class="chip" text-anchor="middle" fill="#fff">root</text>
    <text x="800" y="248" class="card-title" text-anchor="middle" fill="#122033"><tspan x="800" dy="0">Tracking_Backend / src</tspan></text>
