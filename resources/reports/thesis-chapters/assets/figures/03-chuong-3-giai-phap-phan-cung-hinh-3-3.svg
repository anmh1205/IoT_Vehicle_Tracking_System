            <text x="1205" y="648" class="body" text-anchor="middle" fill="#122033"><tspan x="1205" dy="0">VDD 3.3V</tspan></text>
          
            <rect x="948" y="700" width="514" height="68" rx="20" fill="#eef4ff" stroke="rgba(100, 116, 139, 0.18)" stroke-width="2" />
            <text x="1205" y="742" class="body" text-anchor="middle" fill="#122033"><tspan x="1205" dy="0">GND</tspan></text>
          
      
