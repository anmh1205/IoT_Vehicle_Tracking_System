            <text x="1205" y="366" class="body" text-anchor="middle" fill="#122033"><tspan x="1205" dy="0">LIS3DH SCL</tspan></text>
          
            <rect x="948" y="418" width="514" height="68" rx="20" fill="#eef4ff" stroke="rgba(15, 118, 110, 0.18)" stroke-width="2" />
