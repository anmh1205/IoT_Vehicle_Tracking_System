      <rect x="548" y="770" width="500" height="54" rx="18" fill="#fff7d6" stroke="rgba(201, 122, 16, 0.3)" stroke-width="2" /><text x="798" y="803" class="small" text-anchor="middle" fill="#122033"><tspan x="798" dy="0">INT2 được chừa lại cho mở rộng về sau và chưa dùng</tspan><tspan x="798" dy="20">trong firmware hiện tại.</tspan></text>
    
