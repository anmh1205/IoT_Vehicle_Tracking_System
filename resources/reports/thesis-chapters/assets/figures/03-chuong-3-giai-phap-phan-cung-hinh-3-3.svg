  <text x="84" y="106" class="title">Sơ đồ kết nối LIS3DH với ESP32-S3 qua I2C</text>
  <text x="84" y="142" class="subtitle">Thể hiện lại pin mapping I2C, nguồn 3.3V và chân INT1 đánh thức ESP32-S3.</text>
  
      
  <rect x="94" y="220" width="602" height="612" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="118" y="202" width="110" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="173" y="225" class="chip" text-anchor="middle" fill="#fff">ESP32-S3</text>
  <text x="122" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="122" dy="0">Pin mapping bám theo firmware hiện tại và sơ đồ phần</tspan><tspan x="122" dy="22">cứng thực tế.</tspan></text>

      
  <rect x="904" y="220" width="602" height="612" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="928" y="202" width="110" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="983" y="225" class="chip" text-anchor="middle" fill="#fff">LIS3DH</text>
  <text x="932" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="932" dy="0">Cảm biến gia tốc 3 trục dùng cho motion detection khi</tspan><tspan x="932" dy="22">xe đỗ.</tspan></text>

      
            <rect x="132" y="324" width="520" height="68" rx="20" fill="#eef4ff" stroke="rgba(29, 78, 216, 0.18)" stroke-width="2" />
            <text x="168" y="354" class="body" text-anchor="start" fill="#122033"><tspan x="168" dy="0">GPIO48 / I2C SCL</tspan></text>
            <text x="168" y="378" class="tiny" text-anchor="start" fill="#122033"><tspan x="168" dy="0">Bus clock 400 kHz</tspan></text>
          
            <rect x="132" y="418" width="520" height="68" rx="20" fill="#eef4ff" stroke="rgba(29, 78, 216, 0.18)" stroke-width="2" />
