  <text x="84" y="106" class="title">Sơ đồ nguyên lý mạch Buck Converter MP2482</text>
  <text x="84" y="142" class="subtitle">Minh họa lại luồng nguồn 12V / 24V sang bus 5V chính với các linh kiện then chốt.</text>
  
      
  <rect x="90" y="242" width="300" height="522" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="114" y="224" width="110" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="169" y="247" class="chip" text-anchor="middle" fill="#fff">Nguồn vào</text>
  <text x="118" y="276" class="small" text-anchor="start" fill="#122033"><tspan x="118" dy="0">Nhánh lấy điện từ ắc quy</tspan><tspan x="118" dy="22">xe qua cầu chì và tụ lọc</tspan><tspan x="118" dy="22">đầu vào.</tspan></text>

      
  <rect x="432" y="242" width="350" height="522" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="456" y="224" width="220" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="566" y="247" class="chip" text-anchor="middle" fill="#fff">Khối chuyển đổi buck</text>
  <text x="460" y="276" class="small" text-anchor="start" fill="#122033"><tspan x="460" dy="0">MP2482 tạo bus 5V chính từ</tspan><tspan x="460" dy="22">nguồn 12V hoặc 24V.</tspan></text>

      
  <rect x="824" y="242" width="686" height="522" rx="30" fill="#ffffff" stroke="rgba(201, 122, 16, 0.28)" stroke-width="3" />
  <rect x="848" y="224" width="168" height="34" rx="17" fill="#c97a10" stroke="#c97a10" stroke-width="2" /><text x="932" y="247" class="chip" text-anchor="middle" fill="#fff">Khối đầu ra 5V</text>
  <text x="852" y="276" class="small" text-anchor="start" fill="#122033"><tspan x="852" dy="0">Cuộn cảm, diode và tụ đầu ra phối hợp để giữ rail 5V ổn định.</tspan></text>

      
