<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(18, 32, 51, 0.14)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #122033;
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .title { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
    .subtitle { font-size: 22px; fill: #52637a; }
    .section-title { font-size: 24px; font-weight: 700; }
    .card-title { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52637a; }
    .tiny { font-size: 15px; fill: #52637a; }
    .chip { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .metric { font-size: 42px; font-weight: 760; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
    .sidebar { fill: #f8fafc; font-size: 18px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(29, 78, 216, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Sơ đồ tổng quan vấn đề và giải pháp đề xuất</text>
  <text x="84" y="142" class="subtitle">Đối chiếu giữa mô hình quản lý thủ công và phương án tracker IoT tự động.</text>
  
      
  <rect x="84" y="220" width="620" height="620" rx="30" fill="#ffffff" stroke="rgba(217, 72, 95, 0.28)" stroke-width="3" />
  <rect x="108" y="202" width="180" height="34" rx="17" fill="#d9485f" stroke="#d9485f" stroke-width="2" /><text x="198" y="225" class="chip" text-anchor="middle" fill="#fff">Vấn đề hiện tại</text>
  <text x="112" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="112" dy="0">Quản lý thủ công tạo độ trễ và làm mất tính quan sát</tspan><tspan x="112" dy="22">theo thời gian thực.</tspan></text>

      
  <rect x="894" y="220" width="620" height="620" rx="30" fill="#ffffff" stroke="rgba(15, 157, 118, 0.28)" stroke-width="3" />
  <rect x="918" y="202" width="204" height="34" rx="17" fill="#0f9d76" stroke="#0f9d76" stroke-width="2" /><text x="1020" y="225" class="chip" text-anchor="middle" fill="#fff">Giải pháp đề xuất</text>
  <text x="922" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="922" dy="0">Tracker gửi dữ liệu liên tục để tự động hóa giám sát và</tspan><tspan x="922" dy="22">điều phối.</tspan></text>

      
    <rect x="130" y="316" width="240" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="130" y="316" width="240" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="148" y="336" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="193" y="359" class="chip" text-anchor="middle" fill="#fff">manual</text>
    <text x="250" y="380" class="card-title" text-anchor="middle" fill="#122033"><tspan x="250" dy="0">Quản lý rời rạc</tspan></text>
    <text x="250" y="424" class="body" text-anchor="middle" fill="#122033"><tspan x="250" dy="0">Gọi điện, giấy tờ,</tspan><tspan x="250" dy="24">xác nhận thủ công</tspan><tspan x="250" dy="24">Thông tin xe cập nhật</tspan><tspan x="250" dy="24">chậm</tspan></text>
  
      
    <rect x="414" y="316" width="240" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="414" y="316" width="240" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="432" y="336" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="477" y="359" class="chip" text-anchor="middle" fill="#fff">risk</text>
    <text x="534" y="380" class="card-title" text-anchor="middle" fill="#122033"><tspan x="534" dy="0">Rủi ro vận hành</tspan></text>
    <text x="534" y="424" class="body" text-anchor="middle" fill="#122033"><tspan x="534" dy="0">Khó biết xe đang ở</tspan><tspan x="534" dy="24">đâu</tspan><tspan x="534" dy="24">Chậm xử lý sự cố và</tspan><tspan x="534" dy="24">vi phạm</tspan></text>
  
      
    <rect x="250" y="560" width="240" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="250" y="560" width="240" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="268" y="580" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="313" y="603" class="chip" text-anchor="middle" fill="#fff">impact</text>
    <text x="370" y="624" class="card-title" text-anchor="middle" fill="#122033"><tspan x="370" dy="0">Hệ quả</tspan></text>
    <text x="370" y="668" class="body" text-anchor="middle" fill="#122033"><tspan x="370" dy="0">Thiếu dữ liệu lịch sử</tspan><tspan x="370" dy="24">Không có cảnh báo tức</tspan><tspan x="370" dy="24">thời</tspan><tspan x="370" dy="24">Quyết định dựa trên</tspan><tspan x="370" dy="24">cảm tính</tspan></text>
  
      
    <rect x="936" y="286" width="240" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="936" y="286" width="240" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="954" y="306" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="999" y="329" class="chip" text-anchor="middle" fill="#fff">device</text>
    <text x="1056" y="350" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1056" dy="0">Thiết bị tracker</tspan></text>
    <text x="1056" y="394" class="body" text-anchor="middle" fill="#122033"><tspan x="1056" dy="0">GPS, OBD2, IMU, 4G</tspan><tspan x="1056" dy="24">LTE</tspan></text>
  
      
    <rect x="1198" y="286" width="268" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1198" y="286" width="268" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="1216" y="306" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="1261" y="329" class="chip" text-anchor="middle" fill="#fff">cloud</text>
    <text x="1332" y="350" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1332" dy="0">Cloud + lưu trữ</tspan></text>
    <text x="1332" y="394" class="body" text-anchor="middle" fill="#122033"><tspan x="1332" dy="0">EMQX, MQTT Bridge,</tspan><tspan x="1332" dy="24">Backend</tspan><tspan x="1332" dy="24">PostgreSQL,</tspan><tspan x="1332" dy="24">VictoriaMetrics,</tspan><tspan x="1332" dy="24">VictoriaLogs</tspan></text>
  
      
    <rect x="1066" y="560" width="268" height="176" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1066" y="560" width="268" height="12" rx="26" fill="#0f9d76" stroke="none"/>
    <rect x="1084" y="580" width="90" height="34" rx="17" fill="rgba(15, 157, 118, 0.88)" stroke="rgba(15, 157, 118, 0.88)" stroke-width="2" /><text x="1129" y="603" class="chip" text-anchor="middle" fill="#fff">ui</text>
    <text x="1200" y="624" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1200" dy="0">Dashboard giám sát</tspan></text>
    <text x="1200" y="668" class="body" text-anchor="middle" fill="#122033"><tspan x="1200" dy="0">Bản đồ thời gian thực</tspan><tspan x="1200" dy="24">Cảnh báo, báo cáo, điều</tspan><tspan x="1200" dy="24">khiển</tspan></text>
  
      
    <line x1="654" y1="528" x2="936" y2="414" stroke="#1d4ed8" stroke-width="4"  marker-end="url(#arrow)"/>
    <rect x="668" y="426" width="156" height="54" rx="18" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="2" /><text x="746" y="459" class="small" text-anchor="middle" fill="#122033"><tspan x="746" dy="0">chuyển đổi số</tspan></text>
  
      
    <line x1="1176" y1="374" x2="1198" y2="374" stroke="#0f766e" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
      
    <line x1="1332" y1="648" x2="1240" y2="462" stroke="#0f9d76" stroke-width="4"  marker-end="url(#arrow-slate)"/>
    
  
    
</svg>