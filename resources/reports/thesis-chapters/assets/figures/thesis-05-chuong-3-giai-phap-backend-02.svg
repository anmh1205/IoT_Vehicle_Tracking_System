  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <rect x="32" y="32" width="1536" height="936" rx="30" fill="none" stroke="rgba(217, 72, 95, 0.12)" stroke-width="2"/>
  <rect x="56" y="56" width="1488" height="888" rx="28" fill="rgba(255, 255, 255, 0.45)" stroke="none"/>
  <text x="84" y="106" class="title">Luồng xử lý cảnh báo trong hệ thống</text>
  <text x="84" y="142" class="subtitle">Làm rõ đường đi của alert từ EMQX qua MQTT Bridge, PostgreSQL, VictoriaLogs và Socket.IO.</text>
  
      
  <rect x="90" y="220" width="280" height="560" rx="30" fill="#ffffff" stroke="rgba(29, 78, 216, 0.28)" stroke-width="3" />
  <rect x="114" y="202" width="156" height="34" rx="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2" /><text x="192" y="225" class="chip" text-anchor="middle" fill="#fff">Nguồn sự kiện</text>
  <text x="118" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="118" dy="0">EMQX tiếp nhận</tspan><tspan x="118" dy="22">telemetry và các event</tspan><tspan x="118" dy="22">cảnh báo thô.</tspan></text>

      
  <rect x="410" y="220" width="360" height="560" rx="30" fill="#ffffff" stroke="rgba(15, 118, 110, 0.28)" stroke-width="3" />
  <rect x="434" y="202" width="132" height="34" rx="17" fill="#0f766e" stroke="#0f766e" stroke-width="2" /><text x="500" y="225" class="chip" text-anchor="middle" fill="#fff">MQTT Bridge</text>
  <text x="438" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="438" dy="0">Validate, enrich và quyết định</tspan><tspan x="438" dy="22">tuyến xử lý.</tspan></text>

      
  <rect x="810" y="220" width="700" height="560" rx="30" fill="#ffffff" stroke="rgba(217, 72, 95, 0.28)" stroke-width="3" />
  <rect x="834" y="202" width="120" height="34" rx="17" fill="#d9485f" stroke="#d9485f" stroke-width="2" /><text x="894" y="225" class="chip" text-anchor="middle" fill="#fff">Đích xử lý</text>
  <text x="838" y="254" class="small" text-anchor="start" fill="#122033"><tspan x="838" dy="0">Lưu log, ghi alert nghiệp vụ và đẩy realtime ra dashboard.</tspan></text>

      
    <rect x="118" y="342" width="224" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="118" y="342" width="224" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="136" y="362" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="181" y="385" class="chip" text-anchor="middle" fill="#fff">broker</text>
    <text x="230" y="406" class="card-title" text-anchor="middle" fill="#122033"><tspan x="230" dy="0">EMQX Rules</tspan><tspan x="230" dy="30">Engine</tspan></text>
    <text x="230" y="478" class="body" text-anchor="middle" fill="#122033"><tspan x="230" dy="0">motion, speed,</tspan><tspan x="230" dy="24">low_battery, offline</tspan></text>
  
      
    <rect x="118" y="548" width="224" height="132" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="118" y="548" width="224" height="12" rx="26" fill="#1d4ed8" stroke="none"/>
    <rect x="136" y="568" width="90" height="34" rx="17" fill="rgba(29, 78, 216, 0.88)" stroke="rgba(29, 78, 216, 0.88)" stroke-width="2" /><text x="181" y="591" class="chip" text-anchor="middle" fill="#fff">payload</text>
    <text x="230" y="612" class="card-title" text-anchor="middle" fill="#122033"><tspan x="230" dy="0">Payload sự kiện</tspan></text>
    <text x="230" y="656" class="body" text-anchor="middle" fill="#122033"><tspan x="230" dy="0">device_id, severity,</tspan><tspan x="230" dy="24">vị trí, timestamp</tspan></text>
  
      
    <rect x="446" y="300" width="288" height="122" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="446" y="300" width="288" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="464" y="320" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="509" y="343" class="chip" text-anchor="middle" fill="#fff">step</text>
    <text x="590" y="364" class="card-title" text-anchor="middle" fill="#122033"><tspan x="590" dy="0">1. Parse và phân</tspan><tspan x="590" dy="30">loại</tspan></text>
    <text x="590" y="436" class="body" text-anchor="middle" fill="#122033"><tspan x="590" dy="0">Nhận message, xác định</tspan><tspan x="590" dy="24">loại alert và context liên</tspan><tspan x="590" dy="24">quan</tspan></text>
  
      
    <rect x="446" y="468" width="288" height="122" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="446" y="468" width="288" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="464" y="488" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="509" y="511" class="chip" text-anchor="middle" fill="#fff">step</text>
    <text x="590" y="532" class="card-title" text-anchor="middle" fill="#122033"><tspan x="590" dy="0">2. Validate + enrich</tspan></text>
    <text x="590" y="576" class="body" text-anchor="middle" fill="#122033"><tspan x="590" dy="0">Chuẩn hóa schema, gắn</tspan><tspan x="590" dy="24">vehicle_id, geofence hoặc</tspan><tspan x="590" dy="24">mức ưu tiên</tspan></text>
  
      
    <rect x="446" y="636" width="288" height="122" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="446" y="636" width="288" height="12" rx="26" fill="#0f766e" stroke="none"/>
    <rect x="464" y="656" width="90" height="34" rx="17" fill="rgba(15, 118, 110, 0.88)" stroke="rgba(15, 118, 110, 0.88)" stroke-width="2" /><text x="509" y="679" class="chip" text-anchor="middle" fill="#fff">step</text>
    <text x="590" y="700" class="card-title" text-anchor="middle" fill="#122033"><tspan x="590" dy="0">3. Fan-out</tspan></text>
    <text x="590" y="744" class="body" text-anchor="middle" fill="#122033"><tspan x="590" dy="0">Song song ghi log, alert</tspan><tspan x="590" dy="24">nghiệp vụ và Socket.IO</tspan></text>
  
      
    <rect x="858" y="312" width="180" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="858" y="312" width="180" height="12" rx="26" fill="#d9485f" stroke="none"/>
