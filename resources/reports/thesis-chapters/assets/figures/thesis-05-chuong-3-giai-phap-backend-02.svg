    <text x="948" y="376" class="card-title" text-anchor="middle" fill="#122033"><tspan x="948" dy="0">VictoriaLogs</tspan></text>
    <text x="948" y="420" class="body" text-anchor="middle" fill="#122033"><tspan x="948" dy="0">Audit, debug, truy</tspan><tspan x="948" dy="24">vết</tspan></text>
  
      
    <rect x="1070" y="312" width="196" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1070" y="312" width="196" height="12" rx="26" fill="#d9485f" stroke="none"/>
    <rect x="1088" y="332" width="90" height="34" rx="17" fill="rgba(217, 72, 95, 0.88)" stroke="rgba(217, 72, 95, 0.88)" stroke-width="2" /><text x="1133" y="355" class="chip" text-anchor="middle" fill="#fff">sql</text>
    <text x="1168" y="376" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1168" dy="0">PostgreSQL</tspan></text>
    <text x="1168" y="420" class="body" text-anchor="middle" fill="#122033"><tspan x="1168" dy="0">Alerts, trạng thái</tspan><tspan x="1168" dy="24">xử lý</tspan></text>
  
      
    <rect x="1298" y="312" width="164" height="118" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1298" y="312" width="164" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="1316" y="332" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1361" y="355" class="chip" text-anchor="middle" fill="#fff">push</text>
    <text x="1380" y="376" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1380" dy="0">Socket.IO</tspan></text>
    <text x="1380" y="420" class="body" text-anchor="middle" fill="#122033"><tspan x="1380" dy="0">Kênh realtime</tspan></text>
  
      
    <rect x="1018" y="562" width="320" height="156" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="1018" y="562" width="320" height="12" rx="26" fill="#c97a10" stroke="none"/>
    <rect x="1036" y="582" width="90" height="34" rx="17" fill="rgba(201, 122, 16, 0.88)" stroke="rgba(201, 122, 16, 0.88)" stroke-width="2" /><text x="1081" y="605" class="chip" text-anchor="middle" fill="#fff">ui</text>
    <text x="1178" y="626" class="card-title" text-anchor="middle" fill="#122033"><tspan x="1178" dy="0">Dashboard Web</tspan></text>
    <text x="1178" y="670" class="body" text-anchor="middle" fill="#122033"><tspan x="1178" dy="0">Toast, badge, lịch sử alert</tspan><tspan x="1178" dy="24">và luồng xử lý theo thời gian</tspan><tspan x="1178" dy="24">thực</tspan></text>
  
      
