    <rect x="696" y="776" width="160" height="12" rx="26" fill="#c97a10" stroke="none"/>
    
    <text x="776" y="818" class="card-title" text-anchor="middle" fill="#122033"><tspan x="776" dy="0">TPS54231 -&gt;</tspan><tspan x="776" dy="30">~4V</tspan></text>
    
  
      
    <rect x="882" y="776" width="152" height="74" rx="26" fill="#eef4ff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="882" y="776" width="152" height="12" rx="26" fill="#6d4fe0" stroke="none"/>
    
    <text x="958" y="818" class="card-title" text-anchor="middle" fill="#122033"><tspan x="958" dy="0">TP4056 + 21700</tspan><tspan x="958" dy="30">+ SX1308</tspan></text>
    
  
      
