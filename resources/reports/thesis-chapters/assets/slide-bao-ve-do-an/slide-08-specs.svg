<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="Times New Roman, serif">
  <rect width="1360" height="800" fill="#ffffff"/>

  <!-- Two columns: Chỉ tiêu (left) | Ràng buộc (right) -->

  <!-- Left header -->
  <rect x="20" y="20" width="660" height="60" rx="6" fill="#1a5276"/>
  <text x="350" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">CHỈ TIÊU THIẾT KẾ (Phải đạt)</text>

  <!-- Right header -->
  <rect x="700" y="20" width="640" height="60" rx="6" fill="#475569"/>
  <text x="1020" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">RÀNG BUỘC THIẾT KẾ (Không vi phạm)</text>

  <!-- Left col: 5 spec rows -->
  <g transform="translate(20, 100)">
    <rect width="660" height="650" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="2"/>
    <!-- Row 1 -->
    <g transform="translate(20, 25)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#1a5276">Nguồn cấp</text>
      <text x="0" y="60" font-size="20" fill="#000">12 – 24 VDC</text>
      <text x="0" y="88" font-size="18" font-style="italic" fill="#475569">phù hợp ắc quy ô tô</text>
    </g>
    <line x1="20" y1="135" x2="640" y2="135" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 2 -->
    <g transform="translate(20, 145)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#1a5276">MCU điều khiển</text>
      <text x="0" y="60" font-size="20" fill="#000">Vi điều khiển họ ESP</text>
      <text x="0" y="88" font-size="18" font-style="italic" fill="#475569">đủ ngoại vi cho modem + BLE + IMU</text>
    </g>
    <line x1="20" y1="255" x2="640" y2="255" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 3 -->
    <g transform="translate(20, 265)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#1a5276">Giao tiếp với xe</text>
      <text x="0" y="60" font-size="20" fill="#000">Chuẩn OBD-II</text>
      <text x="0" y="88" font-size="18" font-style="italic" fill="#475569">không can thiệp ECU</text>
    </g>
    <line x1="20" y1="375" x2="640" y2="375" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 4 -->
    <g transform="translate(20, 385)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#1a5276">Tham số quản lý</text>
      <text x="0" y="60" font-size="20" fill="#000">Tọa độ GPS, tốc độ, hoạt động</text>
      <text x="0" y="88" font-size="18" font-style="italic" fill="#475569">đủ cho theo dõi và cảnh báo</text>
    </g>
    <line x1="20" y1="495" x2="640" y2="495" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 5 -->
    <g transform="translate(20, 505)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#1a5276">Tính năng chính</text>
      <text x="0" y="60" font-size="20" fill="#000">Quãng đường, thời gian, chi phí, cảnh báo</text>
      <text x="0" y="88" font-size="18" font-style="italic" fill="#475569">trên nền tảng quản lý duy nhất</text>
    </g>
  </g>

  <!-- Right col: 4 constraint rows -->
  <g transform="translate(700, 100)">
    <rect width="640" height="650" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <!-- Row 1 -->
    <g transform="translate(20, 25)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#475569">Tài chính</text>
      <text x="0" y="65" font-size="26" font-weight="bold" fill="#dc2626">Tổng chi phí ≤ 20.000.000 VND</text>
      <text x="0" y="95" font-size="18" font-style="italic" fill="#475569">tổng giá thành thiết bị + máy chủ + SIM</text>
    </g>
    <line x1="20" y1="155" x2="620" y2="155" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 2 -->
    <g transform="translate(20, 165)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#475569">Kiểm chứng</text>
      <text x="0" y="65" font-size="22" fill="#000">Phòng thí nghiệm + xe thử</text>
      <text x="0" y="95" font-size="18" font-style="italic" fill="#475569">đủ điều kiện để đánh giá khả năng vận hành</text>
    </g>
    <line x1="20" y1="295" x2="620" y2="295" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 3 -->
    <g transform="translate(20, 305)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#475569">Gia công</text>
      <text x="0" y="65" font-size="22" fill="#000">Mạch PCB + vỏ in 3D</text>
      <text x="0" y="95" font-size="18" font-style="italic" fill="#475569">tận dụng cơ sở vật chất sẵn có của trường</text>
    </g>
    <line x1="20" y1="435" x2="620" y2="435" stroke="#cccccc" stroke-width="1"/>
    <!-- Row 4 -->
    <g transform="translate(20, 445)">
      <text x="0" y="30" font-size="22" font-weight="bold" fill="#475569">Tiêu chuẩn</text>
      <text x="0" y="65" font-size="22" fill="#000">IPC-2221, IEC 60664-1</text>
      <text x="0" y="95" font-size="18" font-style="italic" fill="#475569">PCB và an toàn điện theo tiêu chuẩn quốc tế</text>
    </g>
  </g>
</svg>
