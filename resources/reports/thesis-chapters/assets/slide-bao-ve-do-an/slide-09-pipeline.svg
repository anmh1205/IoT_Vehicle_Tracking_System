<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="Times New Roman, serif">
  <defs>
    <marker id="arr9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5276"/>
    </marker>
  </defs>

  <rect width="1360" height="800" fill="#ffffff"/>

  <!-- 5 boxes in a row, each 240w × 360h, connected by arrows -->
  <!-- positions: x = 20, 280, 540, 800, 1060  (gap 260, arrow inside gap) -->
  <!-- Box 1 -->
  <g transform="translate(20, 100)">
    <rect width="240" height="500" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="240" height="80" rx="8" fill="#1a5276"/>
    <rect y="50" width="240" height="30" fill="#1a5276"/>
    <text x="120" y="40" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">1</text>
    <text x="120" y="70" text-anchor="middle" font-size="18" fill="#ffffff">BƯỚC</text>
    <text x="120" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">Ghi nhận</text>
    <text x="120" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">trạng thái xe</text>
    <line x1="20" y1="190" x2="220" y2="190" stroke="#1a5276" stroke-width="1"/>
    <text x="120" y="240" text-anchor="middle" font-size="20" fill="#000000">Vị trí</text>
    <text x="120" y="275" text-anchor="middle" font-size="20" fill="#000000">+ vận hành</text>
    <text x="120" y="310" text-anchor="middle" font-size="20" fill="#000000">+ chuyển động</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="265" y1="350" x2="305" y2="350" stroke="#1a5276" stroke-width="6" marker-end="url(#arr9)"/>

  <!-- Box 2 -->
  <g transform="translate(310, 100)">
    <rect width="240" height="500" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="240" height="80" rx="8" fill="#1a5276"/>
    <rect y="50" width="240" height="30" fill="#1a5276"/>
    <text x="120" y="40" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">2</text>
    <text x="120" y="70" text-anchor="middle" font-size="18" fill="#ffffff">BƯỚC</text>
    <text x="120" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">Thu nhận &amp;</text>
    <text x="120" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">xử lý tại thiết bị</text>
    <line x1="20" y1="190" x2="220" y2="190" stroke="#1a5276" stroke-width="1"/>
    <text x="120" y="240" text-anchor="middle" font-size="20" fill="#000000">GNSS + OBD-II</text>
    <text x="120" y="275" text-anchor="middle" font-size="20" fill="#000000">+ IMU</text>
    <text x="120" y="310" text-anchor="middle" font-size="20" fill="#000000">→ ghép bản tin</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="555" y1="350" x2="595" y2="350" stroke="#1a5276" stroke-width="6" marker-end="url(#arr9)"/>

  <!-- Box 3 -->
  <g transform="translate(600, 100)">
    <rect width="240" height="500" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="240" height="80" rx="8" fill="#1a5276"/>
    <rect y="50" width="240" height="30" fill="#1a5276"/>
    <text x="120" y="40" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">3</text>
    <text x="120" y="70" text-anchor="middle" font-size="18" fill="#ffffff">BƯỚC</text>
    <text x="120" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">Gửi bản tin</text>
    <text x="120" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">về máy chủ</text>
    <line x1="20" y1="190" x2="220" y2="190" stroke="#1a5276" stroke-width="1"/>
    <text x="120" y="240" text-anchor="middle" font-size="20" fill="#000000">4G/LTE</text>
    <text x="120" y="275" text-anchor="middle" font-size="20" fill="#000000">MQTT TLS</text>
    <text x="120" y="310" text-anchor="middle" font-size="20" fill="#000000">chu kỳ / sự kiện</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="845" y1="350" x2="885" y2="350" stroke="#1a5276" stroke-width="6" marker-end="url(#arr9)"/>

  <!-- Box 4 -->
  <g transform="translate(890, 100)">
    <rect width="240" height="500" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="240" height="80" rx="8" fill="#1a5276"/>
    <rect y="50" width="240" height="30" fill="#1a5276"/>
    <text x="120" y="40" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">4</text>
    <text x="120" y="70" text-anchor="middle" font-size="18" fill="#ffffff">BƯỚC</text>
    <text x="120" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">Xử lý</text>
    <text x="120" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">tại máy chủ</text>
    <line x1="20" y1="190" x2="220" y2="190" stroke="#1a5276" stroke-width="1"/>
    <text x="120" y="240" text-anchor="middle" font-size="20" fill="#000000">Chuẩn hóa,</text>
    <text x="120" y="275" text-anchor="middle" font-size="20" fill="#000000">lưu trữ, phát</text>
    <text x="120" y="310" text-anchor="middle" font-size="20" fill="#000000">hiện cảnh báo</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="1135" y1="350" x2="1175" y2="350" stroke="#1a5276" stroke-width="6" marker-end="url(#arr9)"/>

  <!-- Box 5 (highlighted as final output) -->
  <g transform="translate(1180, 100)">
    <rect width="160" height="500" rx="8" fill="#fefce8" stroke="#1a5276" stroke-width="4"/>
    <rect width="160" height="80" rx="8" fill="#1a5276"/>
    <rect y="50" width="160" height="30" fill="#1a5276"/>
    <text x="80" y="40" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">5</text>
    <text x="80" y="70" text-anchor="middle" font-size="18" fill="#ffffff">BƯỚC</text>
    <text x="80" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">Biểu diễn</text>
    <text x="80" y="160" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">thông tin</text>
    <line x1="15" y1="190" x2="145" y2="190" stroke="#1a5276" stroke-width="1"/>
    <text x="80" y="240" text-anchor="middle" font-size="18" fill="#000000">Bản đồ,</text>
    <text x="80" y="275" text-anchor="middle" font-size="18" fill="#000000">trạng thái,</text>
    <text x="80" y="310" text-anchor="middle" font-size="18" fill="#000000">cảnh báo,</text>
    <text x="80" y="345" text-anchor="middle" font-size="18" fill="#000000">lịch sử</text>
  </g>

  <!-- Tag below: "vòng lặp dữ liệu" -->
  <text x="680" y="730" text-anchor="middle" font-size="22" font-style="italic" fill="#1a5276">
    Hành trình + vận hành + cảnh báo gom về cùng một tuyến xử lý
  </text>
</svg>
