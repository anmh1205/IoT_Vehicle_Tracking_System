<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="Times New Roman, serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5276"/>
    </marker>
  </defs>

  <rect width="1360" height="800" fill="#ffffff"/>

  <!-- 4 quadrants: 2x2 grid -->
  <!-- Each card: stakeholder name (header), requirement (body), → design implication (footer) -->

  <!-- Quadrant 1: top-left — Đơn vị quản lý đội xe -->
  <g transform="translate(40, 30)">
    <rect width="630" height="350" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="630" height="70" rx="8" fill="#1a5276"/>
    <rect y="40" width="630" height="30" fill="#1a5276"/>
    <text x="40" y="48" font-size="32" font-weight="bold" fill="#ffffff">Đơn vị quản lý đội xe</text>

    <text x="40" y="125" font-size="26" font-weight="bold" fill="#1a5276">Yêu cầu:</text>
    <text x="40" y="165" font-size="24" fill="#000000">Theo dõi vị trí, hành trình, cảnh báo,</text>
    <text x="40" y="200" font-size="24" fill="#000000">dữ liệu vận hành trên cùng một nền tảng.</text>

    <line x1="40" y1="225" x2="590" y2="225" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="40" y="260" font-size="26" font-weight="bold" fill="#1a5276">→ Định hướng thiết kế:</text>
    <text x="40" y="300" font-size="24" font-style="italic" fill="#000000">Giao diện ưu tiên bản đồ —</text>
    <text x="40" y="332" font-size="24" font-style="italic" fill="#000000">trạng thái xe — cảnh báo — lịch sử.</text>
  </g>

  <!-- Quadrant 2: top-right — Người phụ trách kỹ thuật -->
  <g transform="translate(690, 30)">
    <rect width="630" height="350" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="630" height="70" rx="8" fill="#1a5276"/>
    <rect y="40" width="630" height="30" fill="#1a5276"/>
    <text x="40" y="48" font-size="32" font-weight="bold" fill="#ffffff">Người phụ trách kỹ thuật</text>

    <text x="40" y="125" font-size="26" font-weight="bold" fill="#1a5276">Yêu cầu:</text>
    <text x="40" y="165" font-size="24" fill="#000000">Biết thiết bị online/offline, lỗi nguồn,</text>
    <text x="40" y="200" font-size="24" fill="#000000">lỗi mạng, thiếu dữ liệu.</text>

    <line x1="40" y1="225" x2="590" y2="225" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="40" y="260" font-size="26" font-weight="bold" fill="#1a5276">→ Định hướng thiết kế:</text>
    <text x="40" y="300" font-size="24" font-style="italic" fill="#000000">Lớp giám sát kỹ thuật riêng,</text>
    <text x="40" y="332" font-size="24" font-style="italic" fill="#000000">tách khỏi luồng dữ liệu khai thác.</text>
  </g>

  <!-- Quadrant 3: bottom-left — Đội lắp đặt / bảo trì -->
  <g transform="translate(40, 410)">
    <rect width="630" height="350" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="630" height="70" rx="8" fill="#1a5276"/>
    <rect y="40" width="630" height="30" fill="#1a5276"/>
    <text x="40" y="48" font-size="32" font-weight="bold" fill="#ffffff">Đội lắp đặt / bảo trì</text>

    <text x="40" y="125" font-size="26" font-weight="bold" fill="#1a5276">Yêu cầu:</text>
    <text x="40" y="165" font-size="24" fill="#000000">Lắp nhanh, ít xâm lấn vào xe,</text>
    <text x="40" y="200" font-size="24" fill="#000000">dễ thay xe, dễ khoanh vùng lỗi.</text>

    <line x1="40" y1="225" x2="590" y2="225" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="40" y="260" font-size="26" font-weight="bold" fill="#1a5276">→ Định hướng thiết kế:</text>
    <text x="40" y="300" font-size="24" font-style="italic" fill="#000000">Kết cấu gọn,</text>
    <text x="40" y="332" font-size="24" font-style="italic" fill="#000000">tháo lắp lặp lại được.</text>
  </g>

  <!-- Quadrant 4: bottom-right — Người lái / người thuê xe -->
  <g transform="translate(690, 410)">
    <rect width="630" height="350" rx="8" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="630" height="70" rx="8" fill="#1a5276"/>
    <rect y="40" width="630" height="30" fill="#1a5276"/>
    <text x="40" y="48" font-size="32" font-weight="bold" fill="#ffffff">Người lái / người thuê xe</text>

    <text x="40" y="125" font-size="26" font-weight="bold" fill="#1a5276">Yêu cầu:</text>
    <text x="40" y="165" font-size="24" fill="#000000">Thiết bị không ảnh hưởng vận hành xe,</text>
    <text x="40" y="200" font-size="24" fill="#000000">không thu thập vượt nhu cầu quản lý.</text>

    <line x1="40" y1="225" x2="590" y2="225" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="40" y="260" font-size="26" font-weight="bold" fill="#1a5276">→ Định hướng thiết kế:</text>
    <text x="40" y="300" font-size="24" font-style="italic" fill="#000000">Tách khỏi điều khiển phương tiện,</text>
    <text x="40" y="332" font-size="24" font-style="italic" fill="#000000">tối thiểu trường dữ liệu.</text>
  </g>

</svg>
