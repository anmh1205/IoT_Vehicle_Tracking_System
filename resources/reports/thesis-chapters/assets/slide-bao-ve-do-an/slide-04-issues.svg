<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Times New Roman, serif">
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Subtitle: bản chất là 5 mâu thuẫn cần cân bằng -->
  <text x="640" y="35" text-anchor="middle" font-size="20" fill="#1a5276" font-style="italic">
    Mỗi vấn đề là một bài toán cân bằng giữa <tspan font-weight="bold">YÊU CẦU</tspan> và <tspan font-weight="bold">GIỚI HẠN</tspan>
  </text>

  <!-- Header row -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="60" height="50" fill="#1a5276"/>
    <text x="30" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">#</text>

    <rect x="60" y="0" width="280" height="50" fill="#1a5276"/>
    <text x="200" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">NHÓM VẤN ĐỀ</text>

    <rect x="340" y="0" width="400" height="50" fill="#0c4a6e"/>
    <text x="540" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">YÊU CẦU (cần đạt)</text>

    <rect x="740" y="0" width="60" height="50" fill="#1a5276"/>
    <text x="770" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">⇄</text>

    <rect x="800" y="0" width="400" height="50" fill="#7f1d1d"/>
    <text x="1000" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">GIỚI HẠN (không vi phạm)</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="60" height="100" fill="#f0f6fb" stroke="#1a5276" stroke-width="1"/>
    <text x="30" y="62" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a5276">1</text>

    <rect x="60" y="0" width="280" height="100" fill="#ffffff" stroke="#1a5276" stroke-width="1"/>
    <text x="200" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Theo dõi hành trình</text>
    <text x="200" y="65" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">&amp; trạng thái xe</text>

    <rect x="340" y="0" width="400" height="100" fill="#ecfdf5" stroke="#1a5276" stroke-width="1"/>
    <text x="360" y="32" font-size="16" fill="#000000">Duy trì dữ liệu vị trí và</text>
    <text x="360" y="55" font-size="16" fill="#000000">trạng thái <tspan font-weight="bold">liên tục</tspan> trong quá</text>
    <text x="360" y="78" font-size="16" fill="#000000">trình di chuyển</text>

    <rect x="740" y="0" width="60" height="100" fill="#f8fafc" stroke="#1a5276" stroke-width="1"/>
    <text x="770" y="60" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5276">⇄</text>

    <rect x="800" y="0" width="400" height="100" fill="#fef2f2" stroke="#1a5276" stroke-width="1"/>
    <text x="820" y="32" font-size="16" fill="#000000">Không làm tuyến dữ liệu</text>
    <text x="820" y="55" font-size="16" fill="#000000"><tspan font-weight="bold">quá nặng</tspan> hoặc <tspan font-weight="bold">đứt quãng</tspan></text>
    <text x="820" y="78" font-size="16" fill="#000000">khi điều kiện thay đổi</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40, 215)">
    <rect x="0" y="0" width="60" height="80" fill="#f0f6fb" stroke="#1a5276" stroke-width="1"/>
    <text x="30" y="52" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a5276">2</text>

    <rect x="60" y="0" width="280" height="80" fill="#ffffff" stroke="#1a5276" stroke-width="1"/>
    <text x="200" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Thu dữ liệu</text>
    <text x="200" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">vận hành</text>

    <rect x="340" y="0" width="400" height="80" fill="#ecfdf5" stroke="#1a5276" stroke-width="1"/>
    <text x="360" y="32" font-size="16" fill="#000000">Lấy được <tspan font-weight="bold">đủ dữ liệu</tspan> qua</text>
    <text x="360" y="55" font-size="16" fill="#000000">OBD-II cho giám sát sâu</text>

    <rect x="740" y="0" width="60" height="80" fill="#f8fafc" stroke="#1a5276" stroke-width="1"/>
    <text x="770" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5276">⇄</text>

    <rect x="800" y="0" width="400" height="80" fill="#fef2f2" stroke="#1a5276" stroke-width="1"/>
    <text x="820" y="32" font-size="16" fill="#000000"><tspan font-weight="bold">Không can thiệp ECU</tspan>,</text>
    <text x="820" y="55" font-size="16" fill="#000000">phù hợp lắp nhiều dòng xe</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(40, 300)">
    <rect x="0" y="0" width="60" height="80" fill="#f0f6fb" stroke="#1a5276" stroke-width="1"/>
    <text x="30" y="52" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a5276">3</text>

    <rect x="60" y="0" width="280" height="80" fill="#ffffff" stroke="#1a5276" stroke-width="1"/>
    <text x="200" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Phát hiện bất thường</text>
    <text x="200" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">&amp; cảnh báo</text>

    <rect x="340" y="0" width="400" height="80" fill="#ecfdf5" stroke="#1a5276" stroke-width="1"/>
    <text x="360" y="32" font-size="16" fill="#000000">Đủ <tspan font-weight="bold">nhạy</tspan> phát hiện rung,</text>
    <text x="360" y="55" font-size="16" fill="#000000">dịch chuyển khi chạy/đỗ</text>

    <rect x="740" y="0" width="60" height="80" fill="#f8fafc" stroke="#1a5276" stroke-width="1"/>
    <text x="770" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5276">⇄</text>

    <rect x="800" y="0" width="400" height="80" fill="#fef2f2" stroke="#1a5276" stroke-width="1"/>
    <text x="820" y="32" font-size="16" fill="#000000">Hạn chế <tspan font-weight="bold">cảnh báo giả</tspan></text>
    <text x="820" y="55" font-size="16" fill="#000000">gây nhiễu cho vận hành</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="60" height="80" fill="#f0f6fb" stroke="#1a5276" stroke-width="1"/>
    <text x="30" y="52" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a5276">4</text>

    <rect x="60" y="0" width="280" height="80" fill="#ffffff" stroke="#1a5276" stroke-width="1"/>
    <text x="200" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Quản lý</text>
    <text x="200" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">năng lượng</text>

    <rect x="340" y="0" width="400" height="80" fill="#ecfdf5" stroke="#1a5276" stroke-width="1"/>
    <text x="360" y="32" font-size="16" fill="#000000"><tspan font-weight="bold">Bền</tspan> trên ắc quy, vẫn theo</text>
    <text x="360" y="55" font-size="16" fill="#000000">dõi và cảnh báo khi xe đỗ</text>

    <rect x="740" y="0" width="60" height="80" fill="#f8fafc" stroke="#1a5276" stroke-width="1"/>
    <text x="770" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5276">⇄</text>

    <rect x="800" y="0" width="400" height="80" fill="#fef2f2" stroke="#1a5276" stroke-width="1"/>
    <text x="820" y="32" font-size="16" fill="#000000">Không <tspan font-weight="bold">hao điện</tspan>, không</text>
    <text x="820" y="55" font-size="16" fill="#000000">ảnh hưởng <tspan font-weight="bold">khả năng khởi động</tspan></text>
  </g>

  <!-- Row 5 -->
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="60" height="80" fill="#f0f6fb" stroke="#1a5276" stroke-width="1"/>
    <text x="30" y="52" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a5276">5</text>

    <rect x="60" y="0" width="280" height="80" fill="#ffffff" stroke="#1a5276" stroke-width="1"/>
    <text x="200" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Tổng hợp</text>
    <text x="200" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">&amp; khai thác dữ liệu</text>

    <rect x="340" y="0" width="400" height="80" fill="#ecfdf5" stroke="#1a5276" stroke-width="1"/>
    <text x="360" y="32" font-size="16" fill="#000000"><tspan font-weight="bold">Gom về 1 tuyến</tspan> xử lý,</text>
    <text x="360" y="55" font-size="16" fill="#000000">dễ theo dõi lúc vận hành</text>

    <rect x="740" y="0" width="60" height="80" fill="#f8fafc" stroke="#1a5276" stroke-width="1"/>
    <text x="770" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5276">⇄</text>

    <rect x="800" y="0" width="400" height="80" fill="#fef2f2" stroke="#1a5276" stroke-width="1"/>
    <text x="820" y="32" font-size="16" fill="#000000">Vẫn đủ <tspan font-weight="bold">chi tiết</tspan> để tra cứu</text>
    <text x="820" y="55" font-size="16" fill="#000000">lại sau chuyến đi</text>
  </g>

  <!-- Bottom note -->
  <text x="640" y="600" text-anchor="middle" font-size="16" fill="#1a5276" font-style="italic" font-weight="bold">
    7 lựa chọn thiết kế ở phần tiếp theo sẽ lần lượt giải quyết 5 mâu thuẫn này
  </text>
</svg>
