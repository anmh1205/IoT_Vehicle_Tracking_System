<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Infographic bối cảnh đề tài: GPS hiện có chưa đủ cho quản lý xe cho thuê tự lái">
  <defs>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#1a5276"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17456a"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#17324d">
    Bối cảnh: GPS chỉ là một phần của bài toán quản lý xe thuê
  </text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Left panel: GPS only -->
    <g filter="url(#softShadow)">
      <rect x="70" y="125" width="390" height="590" rx="28" fill="#f7fbff" stroke="#c8d8e8" stroke-width="3"/>
      <rect x="100" y="155" width="330" height="62" rx="18" fill="#e8f3fb"/>
      <text x="265" y="196" text-anchor="middle" font-size="28" font-weight="800" fill="#1a5276">Thiết bị GPS hiện có</text>

      <g transform="translate(265 335)">
        <ellipse cx="0" cy="125" rx="160" ry="52" fill="#dcecf8"/>
        <path d="M-150 110c60-46 240-46 300 0" fill="none" stroke="#b8d4e8" stroke-width="4"/>
        <path d="M-112 60h224m-184 0 42-42h96l48 42m-184 34a24 24 0 1 0 0 1m142 0a24 24 0 1 0 0 1" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0-112c-36 0-66 29-66 66 0 50 66 137 66 137s66-87 66-137c0-37-30-66-66-66zm0 90a25 25 0 1 1 0-50 25 25 0 0 1 0 50z" fill="#1a5276"/>
        <path d="M-96-170c34-26 158-26 192 0M-60-205c23-18 97-18 120 0" fill="none" stroke="#75b7df" stroke-width="6" stroke-linecap="round"/>
      </g>

      <rect x="116" y="575" width="298" height="90" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
      <text x="265" y="612" text-anchor="middle" font-size="26" font-weight="800" fill="#17324d">Biết xe ở đâu</text>
      <text x="265" y="647" text-anchor="middle" font-size="23" fill="#596775">nhưng chưa biết xe đang thế nào</text>
    </g>

    <!-- Arrows -->
    <line x1="492" y1="420" x2="575" y2="420" stroke="#1a5276" stroke-width="8" marker-end="url(#arrowBlue)"/>
    <line x1="1034" y1="420" x2="1114" y2="420" stroke="#1a5276" stroke-width="8" marker-end="url(#arrowBlue)"/>

    <!-- Middle panel: missing signals -->
    <g filter="url(#softShadow)">
      <rect x="580" y="125" width="450" height="590" rx="28" fill="#fffaf4" stroke="#f0c78b" stroke-width="3"/>
      <rect x="610" y="155" width="390" height="62" rx="18" fill="#fff0d8"/>
      <text x="805" y="196" text-anchor="middle" font-size="28" font-weight="800" fill="#9a4f00">Còn thiếu khi khai thác đội xe</text>

      <g transform="translate(625 250)">
        <g>
          <rect x="0" y="0" width="365" height="82" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M42 56a34 34 0 1 1 68 0" fill="none" stroke="#1a5276" stroke-width="6" stroke-linecap="round"/>
          <path d="M76 56l24-24" stroke="#e46b2c" stroke-width="6" stroke-linecap="round"/>
          <text x="138" y="34" font-size="25" font-weight="800" fill="#17324d">Trạng thái vận hành</text>
          <text x="138" y="64" font-size="21" fill="#596775">đang chạy, dừng, nguồn, tốc độ</text>
        </g>
        <g transform="translate(0 110)">
          <rect x="0" y="0" width="365" height="82" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M74 14l42 70H32z" fill="none" stroke="#d83b2d" stroke-width="6" stroke-linejoin="round"/>
          <line x1="74" y1="34" x2="74" y2="56" stroke="#d83b2d" stroke-width="6" stroke-linecap="round"/>
          <circle cx="74" cy="68" r="4" fill="#d83b2d"/>
          <text x="138" y="34" font-size="25" font-weight="800" fill="#17324d">Cảnh báo bất thường</text>
          <text x="138" y="64" font-size="21" fill="#596775">rung, dịch chuyển, vượt vùng</text>
        </g>
        <g transform="translate(0 220)">
          <rect x="0" y="0" width="365" height="82" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M38 15h54l24 24v50H38z" fill="none" stroke="#1a5276" stroke-width="5" stroke-linejoin="round"/>
          <path d="M92 15v25h24" fill="none" stroke="#1a5276" stroke-width="5" stroke-linejoin="round"/>
          <path d="M53 55h38M53 70h50" stroke="#75b7df" stroke-width="5" stroke-linecap="round"/>
          <circle cx="104" cy="70" r="19" fill="#22a06b"/>
          <text x="104" y="78" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">$</text>
          <text x="138" y="34" font-size="25" font-weight="800" fill="#17324d">Dữ liệu sau chuyến</text>
          <text x="138" y="64" font-size="21" fill="#596775">quãng đường, thời gian, chi phí</text>
        </g>
        <g transform="translate(0 330)">
          <rect x="0" y="0" width="365" height="82" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M45 22h52a18 18 0 0 1 18 18v28a18 18 0 0 1-18 18H45a18 18 0 0 1-18-18V40a18 18 0 0 1 18-18z" fill="none" stroke="#1a5276" stroke-width="5"/>
          <path d="M48 55l17 17 39-43" fill="none" stroke="#22a06b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="138" y="34" font-size="25" font-weight="800" fill="#17324d">Cơ sở xử lý sự cố</text>
          <text x="138" y="64" font-size="21" fill="#596775">có bằng chứng để đối chiếu</text>
        </g>
      </g>
    </g>

    <!-- Right panel: proposed unified system -->
    <g filter="url(#softShadow)">
      <rect x="1120" y="125" width="410" height="590" rx="28" fill="#f7fbff" stroke="#b8d4e8" stroke-width="3"/>
      <rect x="1150" y="155" width="350" height="62" rx="18" fill="url(#bluePanel)"/>
      <text x="1325" y="196" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">Hệ thống đề tài xây dựng</text>

      <g transform="translate(1160 255)">
        <rect x="0" y="0" width="330" height="300" rx="24" fill="#ffffff" stroke="#c8d8e8" stroke-width="3"/>
        <rect x="22" y="24" width="178" height="142" rx="15" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M42 134c30-42 50-16 78-56 20-28 43-16 62-44" fill="none" stroke="#1a9bd7" stroke-width="7" stroke-linecap="round"/>
        <circle cx="42" cy="134" r="12" fill="#22a06b"/>
        <circle cx="182" cy="34" r="12" fill="#e64b35"/>
        <rect x="218" y="24" width="88" height="52" rx="12" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M236 56a26 26 0 0 1 52 0" fill="none" stroke="#1a5276" stroke-width="4"/>
        <path d="M262 56l18-18" stroke="#e46b2c" stroke-width="4" stroke-linecap="round"/>
        <rect x="218" y="92" width="88" height="52" rx="12" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M236 118h50M236 132h38" stroke="#22a06b" stroke-width="7" stroke-linecap="round"/>
        <rect x="22" y="190" width="88" height="78" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M38 242l16-28 17 15 22-31" fill="none" stroke="#1a9bd7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="126" y="190" width="88" height="78" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <circle cx="170" cy="229" r="27" fill="none" stroke="#22a06b" stroke-width="12"/>
        <path d="M170 202a27 27 0 0 1 26 20" fill="none" stroke="#e46b2c" stroke-width="12"/>
        <rect x="230" y="190" width="76" height="78" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M248 210h39M248 226h28M248 242h44" stroke="#596775" stroke-width="5" stroke-linecap="round"/>
      </g>

      <g transform="translate(1225 600)">
        <rect x="0" y="0" width="200" height="56" rx="18" fill="#e8f3fb" stroke="#c8d8e8" stroke-width="2"/>
        <text x="100" y="37" text-anchor="middle" font-size="24" font-weight="800" fill="#1a5276">Một nền tảng quản lý</text>
      </g>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="180" y="770" width="1240" height="72" rx="24" fill="#17324d"/>
    <text x="800" y="817" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">
      Đề tài: liên kết hành trình + vận hành + cảnh báo trong cùng một hệ thống
    </text>
  </g>
</svg>
