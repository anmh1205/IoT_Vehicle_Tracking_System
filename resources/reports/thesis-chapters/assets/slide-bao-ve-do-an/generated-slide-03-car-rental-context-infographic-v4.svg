<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Infographic bối cảnh cho thuê xe tự lái và nhu cầu quản lý IoT">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12334f"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="lightBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef7fd"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf4"/>
      <stop offset="100%" stop-color="#fff2df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#102c46" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11.5" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1a5276"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="960" y="70" text-anchor="middle" font-size="42" font-weight="800" fill="#17324d">
      Từ bài toán cho thuê xe tự lái đến nhu cầu giám sát IoT
    </text>

    <!-- Flow arrows -->
    <g stroke="#1a5276" stroke-width="8" marker-end="url(#arrow)" opacity="0.95">
      <line x1="472" y1="500" x2="550" y2="500"/>
      <line x1="912" y1="500" x2="990" y2="500"/>
      <line x1="1348" y1="500" x2="1425" y2="500"/>
    </g>

    <!-- Panel 1: rental context -->
    <g filter="url(#shadow)">
      <rect x="70" y="130" width="390" height="720" rx="28" fill="url(#lightBlue)" stroke="#b9d4e9" stroke-width="3"/>
      <rect x="108" y="168" width="314" height="72" rx="20" fill="url(#navy)"/>
      <text x="265" y="199" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">
        <tspan x="265">Cho thuê xe</tspan>
        <tspan x="265" dy="33">tự lái</tspan>
      </text>

      <!-- rental scene icon -->
      <g transform="translate(265 390)">
        <ellipse cx="0" cy="145" rx="160" ry="52" fill="#dcecf8"/>
        <path d="M-132 44h264m-218 0 46-48h106l54 48m-218 38a27 27 0 1 0 0 1m164 0a27 27 0 1 0 0 1" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-95-116h70v52h-70z" fill="#e8f3fb" stroke="#1a5276" stroke-width="5" rx="8"/>
        <path d="M-75-64v38M-45-64v38" stroke="#1a5276" stroke-width="5" stroke-linecap="round"/>
        <circle cx="72" cy="-100" r="28" fill="#1a5276"/>
        <path d="M47-55c8-28 42-28 50 0" fill="none" stroke="#1a5276" stroke-width="8" stroke-linecap="round"/>
        <path d="M-7-132c22 0 40 18 40 40 0 30-40 83-40 83s-40-53-40-83c0-22 18-40 40-40zm0 53a15 15 0 1 0 0-30 15 15 0 0 0 0 30z" fill="#1a9bd7"/>
        <path d="M85-54l36-34m-2 0h22m-22 0v22" fill="none" stroke="#e6a23c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <rect x="112" y="665" width="306" height="118" rx="20" fill="#ffffff" stroke="#cfe0ee" stroke-width="2"/>
      <text x="265" y="707" text-anchor="middle" font-size="26" font-weight="800" fill="#17324d">Nhiều xe, nhiều chuyến</text>
      <text x="265" y="743" text-anchor="middle" font-size="22" fill="#596775">khó kiểm soát thủ công</text>
    </g>

    <!-- Panel 2: management questions -->
    <g filter="url(#shadow)">
      <rect x="560" y="130" width="340" height="720" rx="28" fill="url(#warm)" stroke="#f0c78b" stroke-width="3"/>
      <rect x="592" y="168" width="276" height="72" rx="20" fill="#fff0d8"/>
      <text x="730" y="199" text-anchor="middle" font-size="28" font-weight="800" fill="#9a4f00">
        <tspan x="730">Người quản lý</tspan>
        <tspan x="730" dy="33">cần biết</tspan>
      </text>

      <g transform="translate(598 292)">
        <rect x="0" y="0" width="264" height="122" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
        <path d="M35 70a25 25 0 1 1 50 0" fill="none" stroke="#1a5276" stroke-width="5" stroke-linecap="round"/>
        <path d="M60 70l18-18" stroke="#e46b2c" stroke-width="5" stroke-linecap="round"/>
        <text x="170" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#17324d">Trong chuyến</text>
        <text x="170" y="74" text-anchor="middle" font-size="19" fill="#596775">xe ở đâu, chạy/đỗ?</text>
      </g>
      <g transform="translate(598 445)">
        <rect x="0" y="0" width="264" height="122" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
        <path d="M55 25l34 62H21z" fill="none" stroke="#d83b2d" stroke-width="5" stroke-linejoin="round"/>
        <line x1="55" y1="45" x2="55" y2="63" stroke="#d83b2d" stroke-width="5" stroke-linecap="round"/>
        <circle cx="55" cy="75" r="4" fill="#d83b2d"/>
        <text x="170" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#17324d">Khi bất thường</text>
        <text x="170" y="74" text-anchor="middle" font-size="19" fill="#596775">rung, vượt vùng?</text>
      </g>
      <g transform="translate(598 598)">
        <rect x="0" y="0" width="264" height="122" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
        <path d="M28 27h47l22 22v55H28z" fill="none" stroke="#1a5276" stroke-width="5" stroke-linejoin="round"/>
        <path d="M75 27v23h22" fill="none" stroke="#1a5276" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="91" cy="90" r="18" fill="#22a06b"/>
        <text x="91" y="97" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">$</text>
        <text x="170" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#17324d">Sau chuyến</text>
        <text x="170" y="74" text-anchor="middle" font-size="19" fill="#596775">đối chiếu khai thác?</text>
      </g>
    </g>

    <!-- Panel 3: GPS limitation -->
    <g filter="url(#shadow)">
      <rect x="1000" y="130" width="340" height="720" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="1032" y="168" width="276" height="72" rx="20" fill="#eef2f7"/>
      <text x="1170" y="199" text-anchor="middle" font-size="28" font-weight="800" fill="#334155">
        <tspan x="1170">GPS đơn thuần</tspan>
        <tspan x="1170" dy="33">chưa đủ</tspan>
      </text>
      <g transform="translate(1170 392)">
        <path d="M0-102c-38 0-70 31-70 70 0 53 70 145 70 145s70-92 70-145c0-39-32-70-70-70zm0 96a26 26 0 1 1 0-52 26 26 0 0 1 0 52z" fill="#1a5276"/>
        <path d="M-92 166c40-24 144-24 184 0" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
      </g>
      <rect x="1040" y="560" width="260" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="1170" y="604" text-anchor="middle" font-size="27" font-weight="800" fill="#17324d">Chỉ trả lời vị trí</text>
      <g transform="translate(1040 665)">
        <rect x="0" y="0" width="260" height="42" rx="14" fill="#fff1f0" stroke="#f2b8b5"/>
        <text x="130" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#b42318">Thiếu vận hành</text>
        <rect x="0" y="52" width="260" height="42" rx="14" fill="#fff1f0" stroke="#f2b8b5"/>
        <text x="130" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#b42318">Thiếu cảnh báo</text>
        <rect x="0" y="104" width="260" height="42" rx="14" fill="#fff1f0" stroke="#f2b8b5"/>
        <text x="130" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#b42318">Thiếu đối chiếu</text>
      </g>
    </g>

    <!-- Panel 4: proposed system -->
    <g filter="url(#shadow)">
      <rect x="1430" y="130" width="420" height="720" rx="28" fill="url(#lightBlue)" stroke="#b9d4e9" stroke-width="3"/>
      <rect x="1468" y="168" width="344" height="72" rx="20" fill="url(#navy)"/>
      <text x="1640" y="199" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">
        <tspan x="1640">Hệ thống</tspan>
        <tspan x="1640" dy="33">đề tài xây dựng</tspan>
      </text>
      <g transform="translate(1484 300)">
        <rect x="0" y="0" width="312" height="270" rx="24" fill="#ffffff" stroke="#c8d8e8" stroke-width="3"/>
        <rect x="20" y="24" width="172" height="126" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M42 122c30-42 50-16 78-56 20-28 43-16 62-44" fill="none" stroke="#1a9bd7" stroke-width="7" stroke-linecap="round"/>
        <circle cx="42" cy="122" r="12" fill="#22a06b"/>
        <circle cx="182" cy="22" r="12" fill="#e64b35"/>
        <rect x="210" y="24" width="82" height="52" rx="12" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M230 55a23 23 0 0 1 46 0" fill="none" stroke="#1a5276" stroke-width="4"/>
        <path d="M253 55l16-16" stroke="#e46b2c" stroke-width="4" stroke-linecap="round"/>
        <rect x="210" y="94" width="82" height="52" rx="12" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M228 120h45M228 135h34" stroke="#22a06b" stroke-width="7" stroke-linecap="round"/>
        <rect x="20" y="180" width="76" height="64" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M35 224l16-28 17 15 21-31" fill="none" stroke="#1a9bd7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="116" y="180" width="76" height="64" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <circle cx="154" cy="213" r="23" fill="none" stroke="#22a06b" stroke-width="10"/>
        <path d="M154 190a23 23 0 0 1 22 16" fill="none" stroke="#e46b2c" stroke-width="10"/>
        <rect x="216" y="180" width="76" height="64" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M232 200h38M232 216h28M232 232h42" stroke="#596775" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g transform="translate(1470 625)">
        <rect x="0" y="0" width="340" height="68" rx="18" fill="#e8f3fb" stroke="#c8d8e8" stroke-width="2"/>
        <text x="170" y="43" text-anchor="middle" font-size="24" font-weight="800" fill="#1a5276">Một nền tảng quản lý</text>
      </g>
      <g transform="translate(1460 724)">
        <rect x="0" y="0" width="360" height="66" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/>
        <text x="180" y="27" text-anchor="middle" font-size="21" font-weight="800" fill="#17324d">Hành trình + vận hành</text>
        <text x="180" y="53" text-anchor="middle" font-size="21" font-weight="800" fill="#17324d">+ cảnh báo + đối chiếu</text>
      </g>
    </g>

    <rect x="140" y="920" width="1640" height="92" rx="26" fill="url(#navy)"/>
    <text x="960" y="976" text-anchor="middle" font-size="35" font-weight="800" fill="#ffffff">
      Đề tài không chỉ theo dõi vị trí, mà phục vụ quản lý xe cho thuê tự lái
    </text>
  </g>
</svg>
