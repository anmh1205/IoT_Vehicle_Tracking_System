<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="Times New Roman, serif">
  <rect width="1360" height="800" fill="#ffffff"/>

  <!-- Card 1: Teltonika FMC920 -->
  <g transform="translate(40, 30)">
    <rect width="420" height="740" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="420" height="80" rx="6" fill="#1a5276"/>
    <rect y="55" width="420" height="25" fill="#1a5276"/>
    <text x="210" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">
      Teltonika FMC920
    </text>

    <!-- Image area -->
    <rect x="60" y="110" width="300" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="210" y="205" text-anchor="middle" font-size="20" fill="#94a3b8" font-style="italic">[ảnh thiết bị]</text>

    <line x1="40" y1="310" x2="380" y2="310" stroke="#1a5276" stroke-width="1"/>

    <text x="40" y="350" font-size="24" font-weight="bold" fill="#1a5276">Xuất xứ:</text>
    <text x="180" y="350" font-size="24" fill="#000000">Lithuania</text>

    <text x="40" y="395" font-size="24" font-weight="bold" fill="#1a5276">Giá:</text>
    <text x="180" y="395" font-size="24" fill="#000000">~2,5–3,5 triệu</text>

    <text x="40" y="445" font-size="24" font-weight="bold" fill="#1a5276">Đặc điểm:</text>
    <g font-size="22" fill="#000000">
      <text x="55" y="485">• 4G LTE Cat 1</text>
      <text x="55" y="525">• Theo dõi vị trí GPS</text>
      <text x="55" y="565">• Trạng thái cơ bản xe</text>
    </g>

    <line x1="40" y1="600" x2="380" y2="600" stroke="#dc2626" stroke-width="2"/>
    <text x="40" y="640" font-size="22" font-weight="bold" fill="#dc2626">Hạn chế:</text>
    <text x="40" y="680" font-size="22" fill="#000000">Chưa khai thác OBD-II,</text>
    <text x="40" y="710" font-size="22" fill="#000000">thiếu dữ liệu vận hành</text>
  </g>

  <!-- Card 2: OBD Vcar -->
  <g transform="translate(470, 30)">
    <rect width="420" height="740" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="420" height="80" rx="6" fill="#1a5276"/>
    <rect y="55" width="420" height="25" fill="#1a5276"/>
    <text x="210" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">
      OBD Vcar (Viettel)
    </text>

    <rect x="60" y="110" width="300" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="210" y="205" text-anchor="middle" font-size="20" fill="#94a3b8" font-style="italic">[ảnh thiết bị]</text>

    <line x1="40" y1="310" x2="380" y2="310" stroke="#1a5276" stroke-width="1"/>

    <text x="40" y="350" font-size="24" font-weight="bold" fill="#1a5276">Xuất xứ:</text>
    <text x="180" y="350" font-size="24" fill="#000000">Việt Nam</text>

    <text x="40" y="395" font-size="24" font-weight="bold" fill="#1a5276">Giá:</text>
    <text x="180" y="395" font-size="24" fill="#000000">~2 triệu + thuê bao</text>

    <text x="40" y="445" font-size="24" font-weight="bold" fill="#1a5276">Đặc điểm:</text>
    <g font-size="22" fill="#000000">
      <text x="55" y="485">• Cắm cổng OBD-II</text>
      <text x="55" y="525">• Phát Wi-Fi, kiểm tra xe</text>
      <text x="55" y="565">• Có ứng dụng quản lý</text>
    </g>

    <line x1="40" y1="600" x2="380" y2="600" stroke="#dc2626" stroke-width="2"/>
    <text x="40" y="640" font-size="22" font-weight="bold" fill="#dc2626">Hạn chế:</text>
    <text x="40" y="680" font-size="22" fill="#000000">Phụ thuộc nền tảng</text>
    <text x="40" y="710" font-size="22" fill="#000000">nhà cung cấp</text>
  </g>

  <!-- Card 3: Queclink -->
  <g transform="translate(900, 30)">
    <rect width="420" height="740" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="3"/>
    <rect width="420" height="80" rx="6" fill="#1a5276"/>
    <rect y="55" width="420" height="25" fill="#1a5276"/>
    <text x="210" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">
      Queclink GV305CEU
    </text>

    <rect x="60" y="110" width="300" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="210" y="205" text-anchor="middle" font-size="20" fill="#94a3b8" font-style="italic">[ảnh thiết bị]</text>

    <line x1="40" y1="310" x2="380" y2="310" stroke="#1a5276" stroke-width="1"/>

    <text x="40" y="350" font-size="24" font-weight="bold" fill="#1a5276">Xuất xứ:</text>
    <text x="180" y="350" font-size="24" fill="#000000">Trung Quốc</text>

    <text x="40" y="395" font-size="24" font-weight="bold" fill="#1a5276">Giá:</text>
    <text x="180" y="395" font-size="24" fill="#000000">~3,5–5 triệu</text>

    <text x="40" y="445" font-size="24" font-weight="bold" fill="#1a5276">Đặc điểm:</text>
    <g font-size="22" fill="#000000">
      <text x="55" y="485">• LTE + GNSS + BLE 5.2</text>
      <text x="55" y="525">• Nguồn 8–32V, pin dự phòng</text>
      <text x="55" y="565">• Nhiều I/O, RS232/RS485</text>
    </g>

    <line x1="40" y1="600" x2="380" y2="600" stroke="#dc2626" stroke-width="2"/>
    <text x="40" y="640" font-size="22" font-weight="bold" fill="#dc2626">Hạn chế:</text>
    <text x="40" y="680" font-size="22" fill="#000000">Chi phí cao, vượt nhu</text>
    <text x="40" y="710" font-size="22" fill="#000000">cầu nguyên mẫu</text>
  </g>
</svg>
