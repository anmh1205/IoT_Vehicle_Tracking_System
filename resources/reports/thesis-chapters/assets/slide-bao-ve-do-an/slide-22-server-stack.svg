<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="800" viewBox="0 0 500 800" font-family="Times New Roman, serif">
  <rect width="500" height="800" fill="#ffffff"/>

  <!-- Title -->
  <rect x="20" y="20" width="460" height="60" rx="6" fill="#1a5276"/>
  <text x="250" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">3 LỚP MÁY CHỦ</text>

  <!-- Layer 1: Tiếp nhận -->
  <g transform="translate(20, 110)">
    <rect width="460" height="170" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="460" height="55" rx="8" fill="#1a5276"/>
    <rect y="30" width="460" height="25" fill="#1a5276"/>
    <text x="20" y="38" font-size="22" font-weight="bold" fill="#ffffff">LỚP 1 — TIẾP NHẬN</text>
    <text x="20" y="95" font-size="22" font-weight="bold" fill="#000">EMQX Broker</text>
    <text x="20" y="125" font-size="20" fill="#000">Tiếp nhận MQTT TLS</text>
    <text x="20" y="155" font-size="20" fill="#000">→ chịu được khi nhiều xe gửi dồn</text>
  </g>

  <!-- Layer 2: Trung gian -->
  <g transform="translate(20, 295)">
    <rect width="460" height="170" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="460" height="55" rx="8" fill="#1a5276"/>
    <rect y="30" width="460" height="25" fill="#1a5276"/>
    <text x="20" y="38" font-size="22" font-weight="bold" fill="#ffffff">LỚP 2 — TRUNG GIAN</text>
    <text x="20" y="95" font-size="22" font-weight="bold" fill="#000">MQTT Bridge + Backend API</text>
    <text x="20" y="125" font-size="20" fill="#000">Kiểm tra, phân luồng theo chủ đề</text>
    <text x="20" y="155" font-size="20" fill="#000">→ tách nghiệp vụ khỏi luồng nhận</text>
  </g>

  <!-- Layer 3: Lưu trữ -->
  <g transform="translate(20, 480)">
    <rect width="460" height="200" rx="8" fill="#fefce8" stroke="#1a5276" stroke-width="4"/>
    <rect width="460" height="55" rx="8" fill="#1a5276"/>
    <rect y="30" width="460" height="25" fill="#1a5276"/>
    <text x="20" y="38" font-size="22" font-weight="bold" fill="#ffffff">LỚP 3 — LƯU TRỮ (3 KHO)</text>

    <!-- 3 small chips -->
    <g transform="translate(20, 75)">
      <rect width="135" height="100" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="2"/>
      <text x="67.5" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a5276">PostgreSQL</text>
      <text x="67.5" y="65" text-anchor="middle" font-size="18" fill="#000">Nghiệp vụ</text>
      <text x="67.5" y="88" text-anchor="middle" font-size="16" fill="#475569">(quan hệ)</text>
    </g>

    <g transform="translate(165, 75)">
      <rect width="135" height="100" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="2"/>
      <text x="67.5" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a5276">InfluxDB</text>
      <text x="67.5" y="65" text-anchor="middle" font-size="18" fill="#000">Time-series</text>
      <text x="67.5" y="88" text-anchor="middle" font-size="16" fill="#475569">(vị trí, OBD)</text>
    </g>

    <g transform="translate(310, 75)">
      <rect width="130" height="100" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="2"/>
      <text x="65" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a5276">Loki</text>
      <text x="65" y="65" text-anchor="middle" font-size="18" fill="#000">Log &amp; sự kiện</text>
      <text x="65" y="88" text-anchor="middle" font-size="16" fill="#475569">(theo dõi)</text>
    </g>
  </g>

  <!-- Footer tag -->
  <text x="250" y="720" text-anchor="middle" font-size="20" font-style="italic" fill="#1a5276">
    Triển khai: Docker + Compose
  </text>
  <text x="250" y="750" text-anchor="middle" font-size="20" font-style="italic" fill="#1a5276">
    CI/CD: GitHub Actions • thingdock.dev
  </text>

  <!-- Vertical arrows between layers -->
  <line x1="250" y1="280" x2="250" y2="295" stroke="#1a5276" stroke-width="3"/>
  <polygon points="244,288 256,288 250,300" fill="#1a5276"/>
  <line x1="250" y1="465" x2="250" y2="480" stroke="#1a5276" stroke-width="3"/>
  <polygon points="244,473 256,473 250,485" fill="#1a5276"/>
</svg>
