<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Infographic bối cảnh đề tài: GPS chỉ là một phần của bài toán quản lý xe thuê">
  <defs>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#1a5276"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17324d"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="960" y="78" text-anchor="middle" font-size="40" font-weight="800" fill="#17324d">
      Bối cảnh: GPS chỉ là một phần của bài toán quản lý xe thuê
    </text>

    <!-- Left panel -->
    <g filter="url(#softShadow)">
      <rect x="80" y="145" width="470" height="725" rx="30" fill="#f7fbff" stroke="#c8d8e8" stroke-width="3"/>
      <rect x="120" y="180" width="390" height="70" rx="20" fill="#e8f3fb"/>
      <text x="315" y="225" text-anchor="middle" font-size="31" font-weight="800" fill="#1a5276">Thiết bị GPS hiện có</text>

      <g transform="translate(315 415)">
        <ellipse cx="0" cy="155" rx="190" ry="62" fill="#dcecf8"/>
        <path d="M-135 42h270m-220 0 48-50h116l56 50m-222 40a27 27 0 1 0 0 1m168 0a27 27 0 1 0 0 1" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0-150c-42 0-76 34-76 76 0 58 76 158 76 158s76-100 76-158c0-42-34-76-76-76zm0 104a29 29 0 1 1 0-58 29 29 0 0 1 0 58z" fill="#1a5276"/>
        <path d="M-105-205c42-32 168-32 210 0M-68-245c30-22 106-22 136 0" fill="none" stroke="#75b7df" stroke-width="7" stroke-linecap="round"/>
      </g>

      <rect x="130" y="690" width="370" height="118" rx="22" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
      <text x="315" y="735" text-anchor="middle" font-size="29" font-weight="800" fill="#17324d">Biết xe ở đâu</text>
      <text x="315" y="772" text-anchor="middle" font-size="23" fill="#596775">
        <tspan x="315">nhưng chưa biết</tspan>
        <tspan x="315" dy="30">xe đang thế nào</tspan>
      </text>
    </g>

    <!-- Arrows -->
    <line x1="585" y1="510" x2="675" y2="510" stroke="#1a5276" stroke-width="9" marker-end="url(#arrowBlue)"/>
    <line x1="1260" y1="510" x2="1345" y2="510" stroke="#1a5276" stroke-width="9" marker-end="url(#arrowBlue)"/>

    <!-- Middle panel -->
    <g filter="url(#softShadow)">
      <rect x="680" y="145" width="570" height="725" rx="30" fill="#fffaf4" stroke="#f0c78b" stroke-width="3"/>
      <rect x="720" y="180" width="490" height="70" rx="20" fill="#fff0d8"/>
      <text x="965" y="225" text-anchor="middle" font-size="31" font-weight="800" fill="#9a4f00">Còn thiếu khi khai thác đội xe</text>

      <g transform="translate(730 300)">
        <g>
          <rect x="0" y="0" width="470" height="95" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M43 62a36 36 0 1 1 72 0" fill="none" stroke="#1a5276" stroke-width="6" stroke-linecap="round"/>
          <path d="M79 62l25-25" stroke="#e46b2c" stroke-width="6" stroke-linecap="round"/>
          <text x="138" y="37" font-size="26" font-weight="800" fill="#17324d">Trạng thái vận hành</text>
          <text x="138" y="70" font-size="21" fill="#596775">đang chạy, dừng, nguồn, tốc độ</text>
        </g>
        <g transform="translate(0 125)">
          <rect x="0" y="0" width="470" height="95" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M78 14l45 76H33z" fill="none" stroke="#d83b2d" stroke-width="6" stroke-linejoin="round"/>
          <line x1="78" y1="37" x2="78" y2="60" stroke="#d83b2d" stroke-width="6" stroke-linecap="round"/>
          <circle cx="78" cy="74" r="4" fill="#d83b2d"/>
          <text x="138" y="37" font-size="26" font-weight="800" fill="#17324d">Cảnh báo bất thường</text>
          <text x="138" y="70" font-size="21" fill="#596775">rung, dịch chuyển khi đỗ, vượt vùng</text>
        </g>
        <g transform="translate(0 250)">
          <rect x="0" y="0" width="470" height="95" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M40 16h58l27 27v52H40z" fill="none" stroke="#1a5276" stroke-width="5" stroke-linejoin="round"/>
          <path d="M98 16v28h27" fill="none" stroke="#1a5276" stroke-width="5" stroke-linejoin="round"/>
          <path d="M56 61h42M56 77h52" stroke="#75b7df" stroke-width="5" stroke-linecap="round"/>
          <circle cx="112" cy="77" r="20" fill="#22a06b"/>
          <text x="112" y="85" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">$</text>
          <text x="138" y="32" font-size="25" font-weight="800" fill="#17324d">
            <tspan x="138">Dữ liệu đối chiếu</tspan>
            <tspan x="138" dy="29">sau chuyến</tspan>
          </text>
          <text x="138" y="82" font-size="20" fill="#596775">quãng đường, thời gian, chi phí</text>
        </g>
        <g transform="translate(0 375)">
          <rect x="0" y="0" width="470" height="95" rx="20" fill="#ffffff" stroke="#f0c78b" stroke-width="2"/>
          <path d="M45 24h58a19 19 0 0 1 19 19v30a19 19 0 0 1-19 19H45a19 19 0 0 1-19-19V43a19 19 0 0 1 19-19z" fill="none" stroke="#1a5276" stroke-width="5"/>
          <path d="M52 59l18 18 43-47" fill="none" stroke="#22a06b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="138" y="37" font-size="26" font-weight="800" fill="#17324d">Cơ sở xử lý sự cố</text>
          <text x="138" y="70" font-size="21" fill="#596775">có bằng chứng để kiểm tra, đối chiếu</text>
        </g>
      </g>
    </g>

    <!-- Right panel -->
    <g filter="url(#softShadow)">
      <rect x="1360" y="145" width="480" height="725" rx="30" fill="#f7fbff" stroke="#b8d4e8" stroke-width="3"/>
      <rect x="1400" y="180" width="400" height="86" rx="20" fill="url(#bluePanel)"/>
      <text x="1600" y="215" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">
        <tspan x="1600">Hệ thống đề tài</tspan>
        <tspan x="1600" dy="34">xây dựng</tspan>
      </text>

      <g transform="translate(1408 325)">
        <rect x="0" y="0" width="384" height="330" rx="24" fill="#ffffff" stroke="#c8d8e8" stroke-width="3"/>
        <rect x="24" y="28" width="202" height="154" rx="15" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M48 146c34-48 58-18 90-64 22-32 50-18 72-50" fill="none" stroke="#1a9bd7" stroke-width="7" stroke-linecap="round"/>
        <circle cx="48" cy="146" r="13" fill="#22a06b"/>
        <circle cx="210" cy="32" r="13" fill="#e64b35"/>
        <rect x="246" y="28" width="104" height="58" rx="12" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M268 63a29 29 0 0 1 58 0" fill="none" stroke="#1a5276" stroke-width="4"/>
        <path d="M297 63l20-20" stroke="#e46b2c" stroke-width="4" stroke-linecap="round"/>
        <rect x="246" y="106" width="104" height="58" rx="12" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M268 135h58M268 151h44" stroke="#22a06b" stroke-width="7" stroke-linecap="round"/>
        <rect x="24" y="216" width="104" height="84" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M43 270l19-33 20 18 26-37" fill="none" stroke="#1a9bd7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="146" y="216" width="104" height="84" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <circle cx="198" cy="259" r="30" fill="none" stroke="#22a06b" stroke-width="12"/>
        <path d="M198 229a30 30 0 0 1 29 22" fill="none" stroke="#e46b2c" stroke-width="12"/>
        <rect x="272" y="216" width="78" height="84" rx="14" fill="#eef6fb" stroke="#d4e2ef" stroke-width="2"/>
        <path d="M290 238h42M290 257h31M290 276h47" stroke="#596775" stroke-width="5" stroke-linecap="round"/>
      </g>

      <rect x="1432" y="715" width="336" height="64" rx="18" fill="#e8f3fb" stroke="#c8d8e8" stroke-width="2"/>
      <text x="1600" y="756" text-anchor="middle" font-size="27" font-weight="800" fill="#1a5276">Một nền tảng quản lý</text>
    </g>

    <rect x="180" y="930" width="1560" height="82" rx="24" fill="#17324d"/>
    <text x="960" y="982" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff">
      Đề tài: liên kết hành trình + vận hành + cảnh báo trong cùng một hệ thống
    </text>
  </g>
</svg>
