<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="Times New Roman, serif">
  <rect width="1360" height="800" fill="#ffffff"/>

  <!-- Section A: thời gian phản hồi của firmware -->
  <text x="40" y="40" font-size="28" font-weight="bold" fill="#1a5276">A. Thời gian phản hồi của firmware</text>

  <!-- 4 timeline bars: 0s at x=250, 1s = 40px -->
  <g transform="translate(0, 60)">
    <!-- Reference grid lines and labels -->
    <line x1="250" y1="0" x2="250" y2="280" stroke="#94a3b8" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="280" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="650" y1="0" x2="650" y2="280" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="850" y1="0" x2="850" y2="280" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="280" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="1250" y1="0" x2="1250" y2="280" stroke="#e5e7eb" stroke-width="1"/>
    <text x="250" y="280" text-anchor="middle" font-size="16" fill="#94a3b8">0s</text>
    <text x="450" y="280" text-anchor="middle" font-size="16" fill="#94a3b8">5s</text>
    <text x="650" y="280" text-anchor="middle" font-size="16" fill="#94a3b8">10s</text>
    <text x="850" y="280" text-anchor="middle" font-size="16" fill="#94a3b8">15s</text>
    <text x="1050" y="280" text-anchor="middle" font-size="16" fill="#94a3b8">20s</text>
    <text x="1250" y="280" text-anchor="middle" font-size="16" fill="#94a3b8">25s</text>

    <!-- Row 1: Khởi động → sẵn sàng truyền (12-18s) -->
    <text x="20" y="35" font-size="20" fill="#000">Khởi động → sẵn sàng truyền</text>
    <rect x="730" y="20" width="240" height="22" rx="4" fill="#1a5276"/>
    <text x="980" y="38" font-size="20" font-weight="bold" fill="#000">12 – 18s</text>

    <!-- Row 2: Khởi động → bản tin định vị đầu tiên (20-25s) -->
    <text x="20" y="95" font-size="20" fill="#000">Khởi động → bản tin định vị đầu</text>
    <rect x="1050" y="80" width="200" height="22" rx="4" fill="#1a5276"/>
    <text x="1260" y="98" font-size="20" font-weight="bold" fill="#000">20 – 25s</text>

    <!-- Row 3: Đánh thức định kỳ → sẵn sàng (2-4s) -->
    <text x="20" y="155" font-size="20" font-weight="bold" fill="#000">Đánh thức định kỳ → sẵn sàng</text>
    <rect x="330" y="140" width="80" height="22" rx="4" fill="#16a34a"/>
    <text x="420" y="158" font-size="20" font-weight="bold" fill="#16a34a">2 – 4s ✓</text>

    <!-- Row 4: Từ đỗ sang chạy → có định vị (6-10s) -->
    <text x="20" y="215" font-size="20" fill="#000">Từ đỗ sang chạy → có định vị</text>
    <rect x="490" y="200" width="160" height="22" rx="4" fill="#1a5276"/>
    <text x="660" y="218" font-size="20" font-weight="bold" fill="#000">6 – 10s</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="430" x2="1320" y2="430" stroke="#cccccc" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Section B: bảo trì & lưu trữ -->
  <text x="40" y="475" font-size="28" font-weight="bold" fill="#1a5276">B. Bảo trì &amp; lưu trữ offline</text>

  <!-- 2 cards -->
  <g transform="translate(40, 510)">
    <!-- OTA card -->
    <rect width="620" height="240" rx="8" fill="#f5f9fc" stroke="#1a5276" stroke-width="3"/>
    <rect width="620" height="60" rx="8" fill="#1a5276"/>
    <rect y="35" width="620" height="25" fill="#1a5276"/>
    <text x="20" y="42" font-size="22" font-weight="bold" fill="#ffffff">CẬP NHẬT OTA TỪ XA</text>
    <text x="20" y="105" font-size="40" font-weight="bold" fill="#1a5276">817 KB</text>
    <text x="20" y="140" font-size="22" fill="#000">nạp trong 18 – 20 giây</text>
    <text x="20" y="180" font-size="20" fill="#000">Dual-partition + quay lui khi lỗi</text>
    <text x="20" y="215" font-size="22" font-weight="bold" fill="#16a34a">✓ thành công</text>
  </g>

  <g transform="translate(700, 510)">
    <!-- SD buffer card -->
    <rect width="620" height="240" rx="8" fill="#fefce8" stroke="#1a5276" stroke-width="3"/>
    <rect width="620" height="60" rx="8" fill="#1a5276"/>
    <rect y="35" width="620" height="25" fill="#1a5276"/>
    <text x="20" y="42" font-size="22" font-weight="bold" fill="#ffffff">LƯU ĐỆM OFFLINE (SD 1 GB)</text>
    <text x="20" y="105" font-size="40" font-weight="bold" fill="#1a5276">~2 triệu</text>
    <text x="220" y="105" font-size="32" fill="#000">bản tin</text>
    <text x="20" y="145" font-size="22" font-weight="bold" fill="#1a5276">≈ 24,3 ngày liên tục</text>
    <text x="20" y="185" font-size="20" fill="#000">Gửi bù tự động khi có lại sóng</text>
    <text x="20" y="220" font-size="22" font-weight="bold" fill="#16a34a">✓ ổn định</text>
  </g>
</svg>
