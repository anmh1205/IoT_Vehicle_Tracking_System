<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="Times New Roman, serif">
  <rect width="1360" height="800" fill="#ffffff"/>

  <!-- Top half: tiêu thụ điện theo chế độ (4 bars) -->
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#1a5276">A. Tiêu thụ điện theo chế độ</text>

  <!-- Bar chart: 4 modes -->
  <!-- Scale: max = 1.2W -->
  <!-- Each bar: x_label at 30, bar from x=400 with width proportional to value -->

  <!-- Y-axis line -->
  <g transform="translate(0, 60)">
    <!-- Bar 1: Hoạt động đầy đủ -->
    <text x="40" y="35" font-size="22" fill="#000">Hoạt động đầy đủ</text>
    <rect x="450" y="20" width="675" height="22" fill="#94a3b8"/>
    <text x="1140" y="38" font-size="22" font-weight="bold" fill="#000">~1 W</text>

    <!-- Bar 2: vgate iCar Pro (so sánh) -->
    <text x="40" y="85" font-size="22" fill="#000">vgate iCar Pro</text>
    <text x="320" y="85" font-size="20" fill="#475569">(so sánh)</text>
    <rect x="450" y="70" width="540" height="22" fill="#dc2626"/>
    <text x="1000" y="88" font-size="22" font-weight="bold" fill="#dc2626">~1,2 W (tắt sau 30 phút)</text>

    <!-- Bar 3: TB khi đỗ (10s/120s) -->
    <text x="40" y="135" font-size="22" font-weight="bold" fill="#000">TB khi đỗ (10s/120s)</text>
    <rect x="450" y="120" width="55" height="22" fill="#1a5276"/>
    <text x="520" y="138" font-size="22" font-weight="bold" fill="#1a5276">0,082 W</text>

    <!-- Bar 4: Ngủ sâu -->
    <text x="40" y="185" font-size="22" font-weight="bold" fill="#000">Ngủ sâu (chỉ LIS3DSH)</text>
    <rect x="450" y="170" width="4" height="22" fill="#16a34a"/>
    <text x="465" y="188" font-size="22" font-weight="bold" fill="#16a34a">0,006 W (0,5 mA @ 12 V)</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="290" x2="1320" y2="290" stroke="#cccccc" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Bottom half: thời gian giám sát theo nguồn (timeline horizontal) -->
  <text x="40" y="335" font-size="26" font-weight="bold" fill="#1a5276">B. Thời gian giám sát khi xe đỗ (theo nguồn)</text>

  <!-- 3 horizontal "battery" bars -->
  <g transform="translate(0, 360)">
    <!-- Pin 18650 (chỉ pin) -->
    <text x="40" y="40" font-size="22" font-weight="bold" fill="#000">Chỉ pin 18650 (11 Wh)</text>
    <rect x="350" y="20" width="50" height="35" rx="4" fill="#ffffff" stroke="#1a5276" stroke-width="2"/>
    <rect x="350" y="20" width="50" height="35" rx="4" fill="#94a3b8" opacity="0.6"/>
    <text x="420" y="44" font-size="22" font-weight="bold" fill="#1a5276">5,6 ngày</text>

    <!-- Pin + 20% ắc quy -->
    <text x="40" y="100" font-size="22" font-weight="bold" fill="#000">Pin + 20% ắc quy 45 Ah</text>
    <rect x="350" y="80" width="460" height="35" rx="4" fill="#ffffff" stroke="#1a5276" stroke-width="2"/>
    <rect x="350" y="80" width="460" height="35" rx="4" fill="#1a5276" opacity="0.5"/>
    <text x="830" y="104" font-size="22" font-weight="bold" fill="#1a5276">52 ngày</text>

    <!-- Pin + toàn bộ ắc quy -->
    <text x="40" y="160" font-size="22" font-weight="bold" fill="#000">Pin + toàn bộ ắc quy</text>
    <rect x="350" y="140" width="950" height="35" rx="4" fill="#fefce8" stroke="#1a5276" stroke-width="3"/>
    <rect x="350" y="140" width="950" height="35" rx="4" fill="#1a5276" opacity="0.65"/>
    <text x="1310" y="164" text-anchor="end" font-size="24" font-weight="bold" fill="#1a5276">237,5 ngày  ✓</text>
  </g>

  <!-- Conclusion -->
  <rect x="40" y="700" width="1280" height="65" rx="8" fill="#1a5276"/>
  <text x="680" y="745" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">
    → Không gây hao điện đáng kể cho ắc quy xe
  </text>
</svg>
