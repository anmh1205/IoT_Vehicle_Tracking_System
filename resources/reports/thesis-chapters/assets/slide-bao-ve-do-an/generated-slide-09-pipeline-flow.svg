      <rect x="577" y="386" width="66" height="66" rx="8" fill="none" stroke="#1a5276" stroke-width="5"/>
      <g stroke="#1a5276" stroke-width="4" stroke-linecap="round">
        <line x1="560" y1="396" x2="577" y2="396"/><line x1="560" y1="410" x2="577" y2="410"/><line x1="560" y1="424" x2="577" y2="424"/><line x1="560" y1="438" x2="577" y2="438"/>
        <line x1="643" y1="396" x2="660" y2="396"/><line x1="643" y1="410" x2="660" y2="410"/><line x1="643" y1="424" x2="660" y2="424"/><line x1="643" y1="438" x2="660" y2="438"/>
        <line x1="587" y1="369" x2="587" y2="386"/><line x1="601" y1="369" x2="601" y2="386"/><line x1="615" y1="369" x2="615" y2="386"/><line x1="629" y1="369" x2="629" y2="386"/>
        <line x1="587" y1="452" x2="587" y2="469"/><line x1="601" y1="452" x2="601" y2="469"/><line x1="615" y1="452" x2="615" y2="469"/><line x1="629" y1="452" x2="629" y2="469"/>
      </g>
      <text x="610" y="538" text-anchor="middle" font-size="27" font-weight="800" fill="#1f2937">
