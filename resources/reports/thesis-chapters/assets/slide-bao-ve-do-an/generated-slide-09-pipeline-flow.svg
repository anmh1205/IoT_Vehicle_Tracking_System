        <tspan x="1675" dy="36">tin quản lý</tspan>
      </text>
      <text x="1675" y="616" text-anchor="middle" font-size="23" fill="#e7f7ff">
        <tspan x="1675">Bản đồ, trạng thái, lịch</tspan>
        <tspan x="1675" dy="31">sử, cảnh báo</tspan>
      </text>
    </g>
