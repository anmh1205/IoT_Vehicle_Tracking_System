        <rect x="1635" y="400" width="36" height="38"/>
        <line x1="1681" y1="401" x2="1715" y2="401"/>
        <line x1="1681" y1="427" x2="1715" y2="427"/>
        <line x1="1681" y1="441" x2="1715" y2="441"/>
        <line x1="1676" y1="456" x2="1676" y2="470"/>
        <line x1="1640" y1="470" x2="1712" y2="470"/>
      </g>
      <text x="1675" y="538" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">
