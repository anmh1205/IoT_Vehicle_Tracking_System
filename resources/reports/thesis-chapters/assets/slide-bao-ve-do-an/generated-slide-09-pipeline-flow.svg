      <path d="M0,0 L12,6 L0,12 Z" fill="#8db9d6"/>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="2" flood-color="#dbe4ee" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g stroke="#8db9d6" stroke-width="6" marker-end="url(#arrowBlue)">
    <line x1="417" y1="502" x2="444" y2="502"/>
    <line x1="772" y1="502" x2="799" y2="502"/>
    <line x1="1127" y1="502" x2="1154" y2="502"/>
    <line x1="1482" y1="502" x2="1509" y2="502"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
