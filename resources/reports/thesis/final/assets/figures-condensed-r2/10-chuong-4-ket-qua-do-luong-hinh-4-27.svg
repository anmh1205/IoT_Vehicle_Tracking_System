<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 700px; background-color: white;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#my-svg{font-family:Noto Sans,Segoe UI,Arial,sans-serif;font-size:22px;fill:#111827;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#eef2ff;}#my-svg .error-text{fill:#110d00;stroke:#110d00;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#1f2937;stroke:#1f2937;}#my-svg .marker.cross{stroke:#1f2937;}#my-svg svg{font-family:Noto Sans,Segoe UI,Arial,sans-serif;font-size:22px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#1f2937;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#1f2937;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:Noto Sans,Segoe UI,Arial,sans-serif;}</style><g/><g class="main"><rect width="700" height="500" class="background" fill="#f4f4f4"/><g class="chart-title"><text x="0" y="0" fill="#111827" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(350, 23.5) rotate(0)">Thời gian lấy lại vị trí theo trạng thái khởi động</text></g><g class="plot"><g class="bar-plot-0"><rect x="67.04687690734863" y="113.35714285714286" width="133" height="350.6428571428571" fill="#FFA07A" stroke="#FFA07A" stroke-width="0"/><rect x="315.2734384536743" y="397.64285714285717" width="133" height="66.35714285714283" fill="#FFA07A" stroke="#FFA07A" stroke-width="0"/><rect x="563.5" y="431.75714285714287" width="133" height="32.24285714285713" fill="#FFA07A" stroke="#FFA07A" stroke-width="0"/><text x="133.54687690734863" y="103.35714285714286" text-anchor="middle" dominant-baseline="auto" fill="#111827" font-size="22px">30</text><text x="381.7734384536743" y="387.64285714285717" text-anchor="middle" dominant-baseline="auto" fill="#111827" font-size="22px">5</text><text x="630" y="421.75714285714287" text-anchor="middle" dominant-baseline="auto" fill="#111827" font-size="22px">2</text></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 63.54687690734863,465 L 700,465" fill="none" stroke="#111827" stroke-width="2"/></g><g class="label"><text x="0" y="0" fill="#111827" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(133.54687690734863, 476) rotate(0)">Cold Start\n(khởi động từ trạng thái chưa có dữ liệu vệ tinh gần trước đó)</text><text x="0" y="0" fill="#111827" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(381.7734384