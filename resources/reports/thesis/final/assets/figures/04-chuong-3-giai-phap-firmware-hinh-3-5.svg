<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1260" viewBox="0 0 920 1260" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ kiến trúc phân lớp của firmware</title>
  <desc id="desc">Kiến trúc firmware theo hướng app-core, domain, adapter, platform và phần cứng thực tế.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 18; ry: 18; }
    .box-alt { fill: #eef4ff; stroke: #0f172a; stroke-width: 2; rx: 18; ry: 18; }
    .box-soft { fill: #f1f5f9; stroke: #475569; stroke-width: 2; rx: 18; ry: 18; }
    .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .body { font: 600 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
    .sub { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .small { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
    .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="1260" />

  <text class="title" x="460" y="60">Firmware nhiều component theo hướng Clean + Hexagonal</text>
  <text class="small" x="460" y="95">Lõi điều phối đi qua các cổng runtime, còn công nghệ cụ thể được ghép vào bằng adapter</text>

  <rect class="box-alt" x="120" y="140" width="680" height="170" />
  <text class="body" x="460" y="200">Lõi điều phối ứng dụng</text>
  <text class="sub" x="460" y="240">app-core</text>
  <text class="small" x="460" y="275">tracker-app-bootstrap • state_machine_core • state_sleep_controller • state_ota_runtime</text>

  <rect class="box" x="90" y="390" width="740" height="180" />
  <text class="body" x="460" y="450">Miền nghiệp vụ</text>
  <text class="sub" x="460" y="490">domain-connectivity • domain-telemetry • domain-obd • domain-ota • domain-storage</text>
  <text class="small" x="460" y="525">Kết nối mạng • telemetry • đọc dữ liệu OBD2 • OTA • hàng đợi cục bộ và replay</text>

  <rect class="box-alt" x="70" y="650" width="780" height="230" />
  <text class="body" x="460" y="710">Cổng runtime và adapter</text>
  <text class="sub" x="460" y="750">modem • mqtt • storage queue • ota download • config store • rtc • obd • power control</text>
  <text class="small" x="460" y="790">adapter-modem-sim7600-at • adapter-mqtt-sim7600-at • adapter-ble-obd-nimble</text>
  <text class="small" x="460" y="820">adapter-kv-nvs • adapter-rtc-ds3231m • adapter-storage-sdmmc-fatfs</text>
  <text class="small" x="460" y="850">Mỗi adapter chịu trách nhiệm nối lõi với công nghệ hoặc phần cứng cụ thể</text>

  <rect class="box-soft" x="140" y="960" width="640" height="140" />
  <text class="body" x="460" y="1015">Nền tảng bo mạch và HAL</text>
  <text class="sub" x="460" y="1055">platform-board-esp32s3 • platform-hal-esp-idf • shared-kernel • contracts-device-cloud</text>
  <text class="small" x="460" y="1085">Pin map • lớp cổng runtime • cấu trúc dữ liệu dùng chung • hợp đồng payload</text>

  <rect class="box" x="170" y="1160" width="580" height="70" />
  <text class="body" x="460" y="1204">Phần cứng thực: ESP32-S3 • SIM7600CE-T • LIS3DH • DS3231M • microSD</text>

  <path class="arrow" d="M460 310 L460 390" />
  <path class="arrow" d="M460 570 L460 650" />
  <path class="arrow" d="M460 880 L460 960" />
  <path class="arrow" d="M460 1100 L460 1160" />
</svg>
