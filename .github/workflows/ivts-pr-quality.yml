name: IVTS Pull Request Quality

on:
  pull_request:
    branches: [main, uat]
    paths:
      - 'iot-vehicle-tracking-system-firmware/**'
      - 'iot-vehicle-tracking-system-cloud/Tracking_Backend/**'
      - 'iot-vehicle-tracking-system-cloud/Tracking_MqttBridge/**'
      - 'iot-vehicle-tracking-system-cloud/Tracking_Frontend/**'
      - 'iot-vehicle-tracking-system-cloud/Tracking_Mobile/**'
      - '.github/workflows/ivts-pr-quality.yml'
      - '.github/workflows/mqtt-bridge-uat.yml'
      - '.github/workflows/frontend-uat.yml'
      - '.github/workflows/mobile-uat.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.paths.outputs.node }}
      mobile: ${{ steps.paths.outputs.mobile }}
      firmware: ${{ steps.paths.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node:
              - 'iot-vehicle-tracking-system-cloud/Tracking_Backend/**'
              - 'iot-vehicle-tracking-system-cloud/Tracking_MqttBridge/**'
              - 'iot-vehicle-tracking-system-cloud/Tracking_Frontend/**'
              - '.github/workflows/ivts-pr-quality.yml'
              - '.github/workflows/mqtt-bridge-uat.yml'
              - '.github/workflows/frontend-uat.yml'
            mobile:
              - 'iot-vehicle-tracking-system-cloud/Tracking_Mobile/**'
              - '.github/workflows/ivts-pr-quality.yml'
              - '.github/workflows/mobile-uat.yml'
            firmware:
              - 'iot-vehicle-tracking-system-firmware/**'
              - '.github/workflows/ivts-pr-quality.yml'

  node-quality:
    needs: changed
    if: needs.changed.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [Tracking_Backend, Tracking_MqttBridge, Tracking_Frontend]
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: iot-vehicle-tracking-system-cloud/${{ matrix.component }}/package-lock.json
      - run: npm ci
      - name: Lint supported projects
        if: matrix.component != 'Tracking_MqttBridge'
        run: npm run lint
      - name: Typecheck
        run: |
          if [ "$COMPONENT" = "Tracking_Frontend" ]; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi
        env:
          COMPONENT: ${{ matrix.component }}
      - run: npm test

  mobile-quality:
    needs: changed
    if: needs.changed.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/Tracking_Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firmware-quality:
    needs: changed
    if: needs.changed.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q iot-vehicle-tracking-system-firmware/tests
      - name: ESP32-S3 cross-compile and partition validation
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: iot-vehicle-tracking-system-firmware
