name: PostgreSQL UAT Deploy

on:
  push:
    branches: [uat]
    paths:
      - 'iot-vehicle-tracking-system/Tracking_PostgreSQL/**'

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "iot-vehicle-tracking-system/Tracking_PostgreSQL/"
          target: /opt/tracking/
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/tracking/Tracking_PostgreSQL
            docker compose pull
            docker compose up -d

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "PostgreSQL UAT Deploy"
          status: ${{ job.status }}
