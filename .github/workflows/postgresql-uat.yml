name: PostgreSQL UAT Deploy

on:
  push:
    branches: [uat]
    paths:
      - 'iot-vehicle-tracking-system-cloud/Tracking_PostgreSQL/**'
      - 'scripts/deploy/**'
      - '.github/workflows/postgresql-uat.yml'
  workflow_dispatch:

concurrency:
  group: postgresql-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required deploy secrets
        env:
          SSH_DEPLOY_IP: ${{ secrets.SSH_DEPLOY_IP }}
          SSH_DEPLOY_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          SSH_DEPLOY_USER: ${{ secrets.SSH_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          required_vars=(
            SSH_DEPLOY_IP
            SSH_DEPLOY_PORT
            SSH_DEPLOY_USER
            SSH_PRIVATE_KEY
          )
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

      - name: Build service env payload
        env:
          BASE_ENV_CONTENT: ${{ secrets.POSTGRESQL_UAT_ENV_FILE || secrets.BACKEND_UAT_ENV_FILE }}
        run: |
          {
            printf '%s\n' "$BASE_ENV_CONTENT"
            cat iot-vehicle-tracking-system-cloud/Tracking_PostgreSQL/.env.example
          } > /tmp/postgresql-env-raw

          awk -F= '
            /^[[:space:]]*#/ || /^[[:space:]]*$/ {next}
            !seen[$1]++ {print}
          ' /tmp/postgresql-env-raw > /tmp/postgresql-env-merged

          # Fail before SSH deployment when the new initial-admin secret is
          # missing or still the public template value.
          bootstrap_secret="$(sed -n 's/^POSTGRES_BOOTSTRAP_ADMIN_PASSWORD=//p' /tmp/postgresql-env-merged | head -n 1)"
          if [ "${#bootstrap_secret}" -lt 16 ] || [ "$bootstrap_secret" = 'CHANGE_ME_INITIAL_ADMIN_PASSWORD' ] || [ "$bootstrap_secret" = 'Admin@2026' ]; then
            echo '::error::Provide a unique POSTGRES_BOOTSTRAP_ADMIN_PASSWORD in the UAT secret env file before deployment'
            exit 1
          fi

          {
            echo "SERVICE_ENV_CONTENT<<EOF"
            cat /tmp/postgresql-env-merged
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Ensure VPS directories exist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/tracking/scripts/deploy
            mkdir -p /opt/tracking/Tracking_PostgreSQL

      - name: SCP config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "iot-vehicle-tracking-system-cloud/Tracking_PostgreSQL/"
          target: /opt/tracking/
          strip_components: 1

      - name: Upload deploy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts/deploy/bootstrap-vps.sh,scripts/deploy/sync-postgres-schema.sh"
          target: /opt/tracking/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVICE_ENV_CONTENT,SERVICE_DIR,COMPOSE_FILE
          script: |
            chmod +x /opt/tracking/scripts/deploy/bootstrap-vps.sh
            chmod +x /opt/tracking/scripts/deploy/sync-postgres-schema.sh
            export SERVICE_ENV_CONTENT="$SERVICE_ENV_CONTENT"
            /opt/tracking/scripts/deploy/bootstrap-vps.sh "$SERVICE_DIR" "$COMPOSE_FILE"
            cd "$SERVICE_DIR"
            docker compose pull
            docker compose up -d
            docker compose ps postgres
            /opt/tracking/scripts/deploy/sync-postgres-schema.sh "$SERVICE_DIR" "$COMPOSE_FILE"
        env:
          SERVICE_ENV_CONTENT: ${{ env.SERVICE_ENV_CONTENT }}
          SERVICE_DIR: /opt/tracking/Tracking_PostgreSQL
          COMPOSE_FILE: docker-compose.yml

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "PostgreSQL UAT Deploy"
          status: ${{ job.status }}
