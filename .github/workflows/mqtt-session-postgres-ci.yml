name: MQTT Session PostgreSQL Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'iot-vehicle-tracking-system-cloud/Tracking_MqttBridge/**'
      - '.github/workflows/mqtt-session-postgres-ci.yml'

permissions:
  contents: read

jobs:
  session-watermark-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivts_test
          POSTGRES_PASSWORD: ivts_test_password
          POSTGRES_DB: ivts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivts_test -d ivts_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/Tracking_MqttBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: iot-vehicle-tracking-system-cloud/Tracking_MqttBridge/package-lock.json
      - run: npm ci
      - name: Run live Postgres batch writer SQL cases
        env:
          IVTS_PG_INTEGRATION: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ivts_test
          PGPASSWORD: ivts_test_password
          PGDATABASE: ivts_test
        run: npx tsx --test tests/session-last-position-postgres.integration.test.ts tests/device-auth-postgres.integration.test.ts
