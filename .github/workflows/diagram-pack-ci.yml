name: Diagram Pack CI

on:
  pull_request:
    branches: [main, uat]
    paths:
      - 'resources/reports/diagram-reference-packs/**'
      - '.github/workflows/diagram-pack-ci.yml'
  push:
    branches: [feature/system-coding, uat]
    paths:
      - 'resources/reports/diagram-reference-packs/**'
      - '.github/workflows/diagram-pack-ci.yml'

jobs:
  validate-build-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/reports/diagram-reference-packs/diagram-pack-v2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resources/reports/diagram-reference-packs/diagram-pack-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest and source map
        run: npm run pack:validate

      - name: Build SVG/PNG/PDF outputs
        run: npm run pack:build

      - name: Run quality gates
        run: npm run pack:qa

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: diagram-pack-build
          path: |
            resources/reports/diagram-reference-packs/diagram-pack-v2/build/svg
            resources/reports/diagram-reference-packs/diagram-pack-v2/build/png
            resources/reports/diagram-reference-packs/diagram-pack-v2/build/pdf
          retention-days: 14

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagram-pack-qa-reports
          path: |
            resources/reports/diagram-reference-packs/diagram-pack-v2/qa/gates/validate-report.json
            resources/reports/diagram-reference-packs/diagram-pack-v2/qa/gates/build-report.json
            resources/reports/diagram-reference-packs/diagram-pack-v2/qa/gates/report.jsonl
            resources/reports/diagram-reference-packs/diagram-pack-v2/qa/gates/qa-summary.json
          retention-days: 30
