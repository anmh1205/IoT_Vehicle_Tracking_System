name: npm audit dependency evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'iot-vehicle-tracking-system-cloud/Tracking_Frontend/package*.json'
      - 'iot-vehicle-tracking-system-cloud/Tracking_MqttBridge/package*.json'
      - '.github/workflows/npm-audit-evidence.yml'
      - 'iot-vehicle-tracking-system-cloud/audit-dependencies.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: npm audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Tracking_Frontend
            dir: iot-vehicle-tracking-system-cloud/Tracking_Frontend
          - component: Tracking_MqttBridge
            dir: iot-vehicle-tracking-system-cloud/Tracking_MqttBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install exact lockfile versions
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit
      - name: Capture all dependency advisories and production subset
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          npm audit --json > npm-audit-all.json || :
          npm audit --omit=dev --json > npm-audit-production.json || :
          node ../audit-dependencies.cjs npm-audit-all.json npm-audit-production.json
      - name: Attach machine-readable audit for triage
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.component }}
          path: |
            ${{ matrix.dir }}/npm-audit-all.json
            ${{ matrix.dir }}/npm-audit-production.json
          retention-days: 7
