name: Grafana UAT Deploy

on:
  push:
    branches: [uat]
    paths:
      - 'iot-vehicle-tracking-system-cloud/Tracking_Grafana/**'
      - 'scripts/deploy/**'
      - '.github/workflows/grafana-uat.yml'
  workflow_dispatch:

concurrency:
  group: grafana-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SCP config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "iot-vehicle-tracking-system-cloud/Tracking_Grafana/"
          target: /opt/tracking/
          strip_components: 1

      - name: Validate required deploy secrets
        env:
          SSH_DEPLOY_IP: ${{ secrets.SSH_DEPLOY_IP }}
          SSH_DEPLOY_PORT: ${{ secrets.SSH_DEPLOY_PORT }}
          SSH_DEPLOY_USER: ${{ secrets.SSH_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVICE_ENV_CONTENT: ${{ secrets.GRAFANA_UAT_ENV_FILE || secrets.BACKEND_UAT_ENV_FILE }}
        run: |
          required_vars=(
            SSH_DEPLOY_IP
            SSH_DEPLOY_PORT
            SSH_DEPLOY_USER
            SSH_PRIVATE_KEY
            SERVICE_ENV_CONTENT
          )
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.SSH_DEPLOY_PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SERVICE_ENV_CONTENT,SERVICE_DIR,COMPOSE_FILE
          script: |
            chmod +x /opt/tracking/scripts/deploy/bootstrap-vps.sh
            export SERVICE_ENV_CONTENT="$SERVICE_ENV_CONTENT"
            /opt/tracking/scripts/deploy/bootstrap-vps.sh "$SERVICE_DIR" "$COMPOSE_FILE"
            cd "$SERVICE_DIR"
            docker compose pull
            docker compose up -d
            docker compose ps grafana
            for _ in {1..20}; do
              if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:4002/api/health >/dev/null; then
                exit 0
              fi
              sleep 3
            done
            docker compose logs --tail=100 grafana || true
            exit 1
        env:
          SERVICE_ENV_CONTENT: ${{ secrets.GRAFANA_UAT_ENV_FILE || secrets.BACKEND_UAT_ENV_FILE }}
          SERVICE_DIR: /opt/tracking/Tracking_Grafana
          COMPOSE_FILE: docker-compose.yml

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "Grafana UAT Deploy"
          status: ${{ job.status }}
