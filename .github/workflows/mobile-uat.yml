name: Mobile UAT Build

on:
  push:
    branches: [uat]
    paths:
      - 'iot-vehicle-tracking-system-cloud/Tracking_Mobile/**'
      - '.github/workflows/mobile-uat.yml'
  workflow_dispatch:

concurrency:
  group: mobile-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/Tracking_Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter doctor -v
      - run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory, skipping flutter test"
          fi
      - name: Build Android APK (skip unsupported gradle)
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/flutter-build-apk.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "unsupported Gradle project" /tmp/flutter-build-apk.log; then
            echo "Unsupported Gradle project detected, skipping APK artifact upload."
            exit 0
          fi

          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('iot-vehicle-tracking-system-cloud/Tracking_Mobile/build/app/outputs/flutter-apk/app-release.apk') != '' }}
        with:
          name: android-apk
          path: iot-vehicle-tracking-system-cloud/Tracking_Mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "Android Build"
          status: ${{ job.status }}

  build-ios:
    if: ${{ false }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/Tracking_Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: iot-vehicle-tracking-system-cloud/Tracking_Mobile/build/ios/iphoneos/Runner.app
          retention-days: 30

      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "iOS Build"
          status: ${{ job.status }}
