name: Mobile UAT Build

on:
  push:
    branches: [uat]
    paths:
      - 'iot-vehicle-tracking-system-cloud/Tracking_Mobile/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/Tracking_Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter doctor -v
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: iot-vehicle-tracking-system-cloud/Tracking_Mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: iot-vehicle-tracking-system-cloud/Tracking_Mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "Android Build"
          status: ${{ job.status }}

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-cloud/Tracking_Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: iot-vehicle-tracking-system-cloud/Tracking_Mobile/build/ios/iphoneos/Runner.app
          retention-days: 30

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "iOS Build"
          status: ${{ job.status }}
