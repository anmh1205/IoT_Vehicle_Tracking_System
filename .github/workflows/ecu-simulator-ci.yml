name: Arduino ECU simulator
on:
  pull_request:
    branches: [main, uat]
    paths:
      - 'iot-vehicle-tracking-system-ecu-simulator/**'
      - '.github/workflows/ecu-simulator-ci.yml'
permissions:
  contents: read
jobs:
  ecu-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-vehicle-tracking-system-ecu-simulator/ecu-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test/host/run.py
      - run: python -m pip install platformio==6.1.19
      - run: pio run
