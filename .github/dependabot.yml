version: 2
updates:
  - package-ecosystem: npm
    directory: /iot-vehicle-tracking-system-cloud/Tracking_Frontend
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      compatible-updates:
        applies-to: version-updates
        update-types: ['minor', 'patch']
        patterns: ['*']
      security-patches:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /iot-vehicle-tracking-system-cloud/Tracking_MqttBridge
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      compatible-updates:
        applies-to: version-updates
        update-types: ['minor', 'patch']
        patterns: ['*']
      security-patches:
        applies-to: security-updates
        patterns: ['*']
