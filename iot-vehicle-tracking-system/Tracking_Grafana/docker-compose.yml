version: '3.8'

services:
  grafana:
    image: grafana/grafana:10.2.0
    container_name: tracking-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_SERVER_HTTP_PORT: "4001"
    volumes:
      - ../Tracking_Data/Tracking_Grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    ports:
      - "0.0.0.0:4001:4001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tracking-network

networks:
  tracking-network:
    external: true
