global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "tracking-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["tracking-backend:3000"]
        labels:
          service: "backend"

  - job_name: "mqtt-bridge"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["tracking-mqtt-bridge:3001"]
        labels:
          service: "mqtt-bridge"

  - job_name: "victoriametrics"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["victoriametrics:8428"]
        labels:
          service: "victoriametrics"
