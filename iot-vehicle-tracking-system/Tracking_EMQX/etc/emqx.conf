## EMQX Configuration for IoT Vehicle Tracking System
## See: https://www.emqx.io/docs/en/v5.4/configuration/configuration.html

node {
  name = "tracking-emqx@127.0.0.1"
  cookie = "tracking_emqx_secret_cookie"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10240
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 10240
  ssl_options {
    certfile = "/opt/emqx/etc/certs/emqx.pem"
    keyfile = "/opt/emqx/etc/certs/emqx.key"
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 1024
}

listeners.wss.default {
  bind = "0.0.0.0:8084"
  max_connections = 1024
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

authorization {
  no_match = deny
  deny_action = disconnect
}
