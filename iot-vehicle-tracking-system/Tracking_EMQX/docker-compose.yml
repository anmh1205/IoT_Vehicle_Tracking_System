version: '3.8'

services:
  emqx:
    image: emqx/emqx:5.4.0
    container_name: tracking-emqx
    environment:
      EMQX_NAME: tracking-emqx
      EMQX_HOST: 0.0.0.0
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__ENABLE: "true"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:?EMQX_DASHBOARD__DEFAULT_PASSWORD is required}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    ports:
      - "127.0.0.1:1883:1883"     # MQTT (non-TLS) - internal/dev only
      - "0.0.0.0:8883:8883"       # MQTTS (TLS) - production
      - "127.0.0.1:8083:8083"     # WebSocket (WS) - internal only
      - "0.0.0.0:8084:8084"       # WebSocket Secure (WSS) - production
      - "127.0.0.1:18083:18083"   # Dashboard - admin only
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tracking-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

volumes:
  emqx-data:
  emqx-log:

networks:
  tracking-network:
    external: true
