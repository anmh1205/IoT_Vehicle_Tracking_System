services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/tracking-frontend:uat
    container_name: tracking-frontend
    ports:
      - '3002:3002'
    env_file: .env
    restart: always
    networks:
      - tracking-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  tracking-network:
    external: true
