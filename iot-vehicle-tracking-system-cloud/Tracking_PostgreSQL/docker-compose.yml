version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tracking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_tracking}
      POSTGRES_BOOTSTRAP_ADMIN_PASSWORD: ${POSTGRES_BOOTSTRAP_ADMIN_PASSWORD:?A unique initial admin password is required}
    volumes:
      - ../Tracking_Data/Tracking_PostgreSQL/data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tracking-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

networks:
  tracking-network:
    external: true
